# ============================================================
# TuniX — Render Blueprint (Free tier)
# Deploy cả web service + PostgreSQL bằng 1 file.
# Cách dùng: push lên GitHub, vào render.com → New → Blueprint
# → chọn repo tuongdx/tunix-test → Render tự tạo mọi thứ.
# Docs: https://render.com/docs/blueprint-spec
# ============================================================

databases:
  - name: Tunix-test1-db
    databaseName: tunixtest1
    user: tunixtest1_user
    plan: free                 # Free Postgres: 1 GB, hết hạn sau 30 ngày
    region: singapore          # Gần VN → độ trễ thấp, cùng region với web
    postgresMajorVersion: "18"
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere   # Cho phép kết nối từ ngoài (đẩy dữ liệu từ máy local)

services:
  - type: web
    name: tunix
    runtime: python
    plan: free                 # 512 MB RAM, ngủ sau 15 phút không truy cập
    region: singapore
    autoDeploy: true           # Tự deploy lại khi push code mới lên main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      # Tạo SECRET_KEY ngẫu nhiên, an toàn khi deploy
      - key: SECRET_KEY
        generateValue: true
      # TuniAI (DeepSeek) — Điền API key tại Dashboard Render (không lưu secret trong git)
      # Sau khi thêm, vào Render → Service tunix → Environment → set DEEPSEEK_API_KEY rồi Deploy lại.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Kết nối Postgres tự động (internal URL, cùng region)
      - key: DATABASE_URL
        fromDatabase:
          name: Tunix-test1-db
          property: connectionString
      # Có thể set sau khi biết URL thật của service (để link reset mật khẩu đúng)
      - key: FRONTEND_URL
        value: https://tunix.onrender.com
