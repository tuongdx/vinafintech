<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Không tìm thấy trang - VinaFintech</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/frontend/Logo/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/frontend/Logo/favicon-32x32.png" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #1a1f36;
            background: radial-gradient(circle at 20% 0%, #e6f4f4 0%, #f6f8fb 45%, #eef2f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            min-height: 100%;
        }
        .nf-card {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border: 1px solid #e9edf2;
            border-radius: 20px;
            padding: 40px 32px 32px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(15, 42, 56, 0.10);
        }
        .nf-logo { display: inline-block; margin-bottom: 22px; }
        .nf-logo img { width: 168px; height: 42px; object-fit: contain; }
        .nf-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 92px;
            padding: 7px 18px;
            border-radius: 999px;
            background: rgba(0, 128, 128, 0.10);
            border: 1px solid rgba(0, 128, 128, 0.22);
            color: #008080;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        h1 { margin: 18px 0 10px; font-size: 24px; line-height: 1.3; }
        .nf-desc { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #4a5a72; }
        .nf-desc code {
            display: inline-block;
            max-width: 100%;
            padding: 3px 9px;
            border-radius: 8px;
            background: #f5f7fb;
            border: 1px solid #e9edf2;
            font-size: 13px;
            color: #12203a;
            word-break: break-all;
        }
        .nf-hint { margin: 0 0 26px; font-size: 13.5px; line-height: 1.6; color: #6b7a8f; }
        .nf-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .nf-actions .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 18px;
            border-radius: 11px;
            border: 1px solid #e2e8f0;
            background: #f6f8fb;
            color: #1a2b45;
            font-size: 13.5px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .nf-actions .btn:hover { background: #eef2f6; border-color: #cbd5e1; }
        .nf-actions .btn.primary { background: #008080; border-color: #008080; color: #fff; }
        .nf-actions .btn.primary:hover { background: #006f6f; border-color: #006f6f; }
        @media (prefers-color-scheme: dark) {
            body { background: radial-gradient(circle at 20% 0%, #10343a 0%, #0d1117 55%, #0b0f14 100%); color: #e6edf3; }
            .nf-card { background: #161b22; border-color: #21262d; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); }
            .nf-desc { color: #adbac7; }
            .nf-desc code { background: #10151c; border-color: #21262d; color: #e6edf3; }
            .nf-hint { color: #8b949e; }
            .nf-actions .btn { background: #21262d; border-color: #30363d; color: #e6edf3; }
            .nf-actions .btn:hover { background: #30363d; border-color: #3e4c61; }
            .nf-actions .btn.primary { background: #008080; border-color: #008080; color: #fff; }
            .nf-actions .btn.primary:hover { background: #009b9b; border-color: #009b9b; }
        }
    </style>
</head>
<body>
    <main class="nf-card">
        <a class="nf-logo" href="/" aria-label="VinaFintech"><img src="/frontend/Logo/VinaFintech-Logo.png" alt="VinaFintech" /></a>
        <div class="nf-badge">404</div>
        <h1>Không tìm thấy trang</h1>
        <p class="nf-desc">Đường dẫn <code>{{PATH}}</code> không tồn tại, hoặc mã cổ phiếu không hợp lệ.</p>
        <p class="nf-hint">Mã cổ phiếu chỉ gồm chữ cái và chữ số (ví dụ <b>FPT</b>, <b>ACB</b>). Hãy kiểm tra lại đường dẫn rồi thử lại.</p>
        <div class="nf-actions">
            <a class="btn primary" href="/">Về trang chủ</a>
            <a class="btn" href="/co-phieu">Bảng giá cổ phiếu</a>
            <a class="btn" href="/co-phieu/nganh">Cổ phiếu theo ngành</a>
            <a class="btn" href="/tin-tuc">Tin tức thị trường</a>
        </div>
    </main>
</body>
</html>
