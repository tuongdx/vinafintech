    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #12203a;
            line-height: 1.45;
        }
        .tt-page { max-width: none; width: 100%; margin: 0 auto; padding: 20px; }
        .embedded .tt-page { padding: 0 0 40px; }

        /* ===== Layout ===== */
        .tt-top { display: flex; flex-direction: column; gap: 18px; margin-bottom: 18px; }
        /* Khối xanh đầu trang (giống Tỷ giá ngoại tệ / Vàng-Bạc — cùng size & màu, chỉ khác text) */
        .tt-hero {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #006b6b 0%, #008080 55%, #00a08a 100%);
            border-radius: 18px; padding: 22px 26px; color: #fff;
            box-shadow: 0 2px 10px rgba(0, 60, 60, 0.10);
        }
        .tt-hero::after {
            content: ''; position: absolute; right: -60px; top: -60px;
            width: 240px; height: 240px;
            background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .tt-hero h1 { color: #fff; font-size: 21px; font-weight: 800; letter-spacing: -0.3px; position: relative; z-index: 1; }
        .tt-hero .tt-hero-sub { color: rgba(255,255,255,0.92); font-size: 13px; margin-top: 6px; max-width: 800px; line-height: 1.55; position: relative; z-index: 1; }
        .tt-hero .tt-hero-pill {
            display: inline-block; margin-top: 10px; position: relative; z-index: 1;
            background: rgba(255,255,255,0.16); padding: 4px 12px; border-radius: 20px;
            font-size: 12px; color: #fff;
        }
        .tt-hero .tt-hero-pill i { margin-right: 5px; }
        .tt-hero .tt-hero-pill b { color: #fff; font-weight: 700; }
        .tt-body { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: stretch; }
        .tt-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .tt-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

        /* ===== Card ===== */
        .tt-card {
            background: #fff;
            border: 1px solid #e9edf2;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
        }
        .tt-card h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .tt-card h2 .tt-h2-ico { color: #008080; }

        /* ===== 4 index cards ===== */
        .tt-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .tt-idx {
            background: #fff; border: 1px solid #e9edf2; border-radius: 14px; padding: 14px;
            cursor: pointer; transition: box-shadow 0.2s, transform 0.2s; box-shadow: 0 1px 3px rgba(15,23,42,0.05);
        }
        .tt-idx:hover { box-shadow: 0 6px 18px rgba(15,23,42,0.10); transform: translateY(-2px); }
        .tt-idx.active { border-color: #008080; box-shadow: 0 6px 18px rgba(0,128,128,0.16); }
        .tt-idx .ti-name { font-size: 12px; font-weight: 600; color: #6b7a8f; }
        .tt-idx .ti-val { font-size: 21px; font-weight: 800; margin-top: 3px; letter-spacing: -0.3px; }
        .tt-idx .ti-chg { font-size: 13px; font-weight: 700; margin-top: 2px; }
        .tt-idx .ti-spark { margin-top: 10px; height: 42px; }
        .tt-idx .ti-spark svg { width: 100%; height: 42px; display: block; }
        .ti-up { color: #0f7b3a; }
        .ti-down { color: #d0314e; }

        /* ===== Main chart ===== */
        .tt-chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .tt-chart-title { font-size: 17px; font-weight: 800; }
        .tt-chart-quote { font-size: 13px; color: #6b7a8f; margin-top: 2px; }
        .tt-chart-quote b { font-size: 15px; color: #12203a; }
        .tt-chart-select {
            font-family: inherit; font-size: 17px; font-weight: 800; color: #12203a;
            background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 5px 10px; cursor: pointer;
            outline: none;
        }
        .tt-chart-select:hover { border-color: #d8dee8; }
        .tt-periods { display: flex; gap: 4px; background: #f1f4f8; border-radius: 10px; padding: 3px; }
        .tt-periods button {
            border: none; background: transparent; color: #4a5a72; font-weight: 600; font-size: 12px;
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .tt-periods button:hover { color: #008080; }
        .tt-periods button.active { background: #fff; color: #008080; box-shadow: 0 1px 3px rgba(15,23,42,0.12); }
        .tt-chart-svg svg { width: 100%; height: 300px; display: block; }
        .tt-chart-svg { position: relative; }
        .tt-chart-ylab, .tt-chart-xlab { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .tt-chart-ylab .yl { position: absolute; left: 4px; font-size: 10.5px; color: #8a99b1; font-weight: 600; transform: translateY(-50%); }
        .tt-chart-xlab .xl { position: absolute; font-size: 10.5px; color: #8a99b1; white-space: nowrap; }
        .tt-chart-tip {
            position: absolute; z-index: 30; pointer-events: none; min-width: 150px;
            background: #12203a; color: #fff; border-radius: 10px; padding: 8px 12px;
            font-size: 12px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            opacity: 0; visibility: hidden; transition: opacity 0.1s;
        }
        .tt-chart-tip.show { opacity: 1; visibility: visible; }
        .tt-chart-tip .tip-v { font-size: 14px; font-weight: 800; }
        .tt-chart-tip .tip-r { color: #c9d3e0; font-size: 11.5px; margin-top: 2px; }
        .tt-chart-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: #8a99b1; margin-top: 6px; flex-wrap: wrap; gap: 6px; }
        /* Thanh công cụ biểu đồ: kỳ hạn + zoom + toàn màn hình */
        .tt-chart-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .tt-chart-btns { display: flex; gap: 4px; }
        .tt-chart-btn {
            width: 30px; height: 30px; border: 1px solid #dbe4ec; background: #fff; color: #4a5a72;
            border-radius: 9px; cursor: pointer; font-size: 12px; font-family: inherit;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s;
        }
        .tt-chart-btn:hover { border-color: #008080; color: #008080; }
        .tt-chart-hint { font-size: 11px; color: #a3b0c2; margin-top: 4px; }
        body.dark-mode .tt-chart-hint { color: #8b949e; }
        body.dark-mode .tt-chart-btn { background: #21262d; border-color: #3e4c61; color: #d3deeb; }
        body.dark-mode .tt-chart-btn:hover { border-color: #4db6b6; color: #5fd6cf; }

        /* ===== Breadth ===== */
        .tt-breadth-stack { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 10px 0 14px; }
        .tt-breadth-stack .seg { display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: #fff; min-width: 0; }
        .tt-breadth-meta { display: flex; gap: 18px; flex-wrap: wrap; }
        .tt-breadth-meta .bm { display: flex; align-items: center; gap: 7px; font-size: 13px; }
        .tt-breadth-meta .dot { width: 10px; height: 10px; border-radius: 3px; }
        .tt-breadth-meta .bm b { font-size: 15px; }
        .tt-breadth-chips { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        .tt-chip { font-size: 11.5px; padding: 4px 10px; border-radius: 20px; background: #f1f4f8; color: #4a5a72; }
        .tt-chip b { margin-left: 4px; }

        /* ===== Flow cards ===== */
        .tt-flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .tt-flow-card {
            border: 1px solid #eef1f5; border-radius: 12px; padding: 13px 14px; background: #fafbfd;
        }
        .tt-flow-card .fc-ico { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: rgba(0,128,128,0.10); color: #008080; margin-bottom: 10px; }
        .tt-flow-card .fc-label { font-size: 11.5px; color: #6b7a8f; }
        .tt-flow-card .fc-val { font-size: 18px; font-weight: 800; margin-top: 2px; }
        .tt-flow-card .fc-sub { font-size: 11.5px; color: #8a99b1; margin-top: 2px; }
        .fc-up { color: #0f7b3a; } .fc-down { color: #d0314e; }

        /* ===== Sectors ===== */
        .tt-sector-row { display: grid; grid-template-columns: 150px 1fr 90px 90px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f2f4f8; }
        .tt-sector-row:last-child { border-bottom: none; }
        .tt-sector-name { font-weight: 600; font-size: 13px; }
        .tt-sector-name .ts-count { color: #8a99b1; font-weight: 500; font-size: 11.5px; }
        .tt-sector-bar-wrap { background: #f1f4f8; height: 10px; border-radius: 6px; overflow: hidden; position: relative; }
        .tt-sector-bar { height: 100%; border-radius: 6px; }
        .ts-up { background: linear-gradient(90deg, #00a08a, #008080); }
        .ts-down { background: linear-gradient(90deg, #e06a6a, #d0314e); }
        .tt-sector-pct { text-align: right; font-weight: 700; font-size: 13px; }
        .tt-sector-count { text-align: right; font-size: 11.5px; color: #8a99b1; }

        /* ===== VN30 ===== */
        .tt-vn30-wrap .tt-vn30-empty { color: #8a99b1; font-size: 12px; padding: 10px 0; }
        .tt-vn30-scroll { max-height: 384px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .tt-vn30-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
        .tt-vn30-scroll::-webkit-scrollbar-thumb { background: transparent; }
        .tt-vn30-table { width: 100%; border-collapse: collapse; }
        .tt-vn30-table thead th { position: sticky; top: 0; background: #fff; z-index: 2; font-size: 11px; color: #8a99b1; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef1f5; }
        .tt-vn30-table tbody td { padding: 8px 10px; border-bottom: 1px solid #f2f4f8; font-size: 12.5px; white-space: nowrap; }
        .tt-vn30-row { cursor: pointer; }
        .tt-vn30-row:hover td { background: #f0fbf9; }
        .tt-vn30-sym { font-weight: 700; }
        .tt-vn30-name { font-size: 11px; color: #8a99b1; font-weight: 500; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tt-vn30-price { font-weight: 700; }
        .tt-vn30-spark svg { display: block; width: 84px; height: 30px; }
        .tt-vn30-num { color: #4a5a72; }

        /* ===== Radar ===== */
        .tt-radar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .tt-radar-col { border: 1px solid #eef1f5; border-radius: 12px; padding: 12px; background: #fafbfd; }
        .tt-radar-col h3 { font-size: 12px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .tt-radar-col h3 i { color: #008080; }
        .tt-radar-item { font-size: 12.5px; padding: 5px 4px; border-bottom: 1px dashed #eef1f5; cursor: pointer; border-radius: 6px; }
        .tt-radar-item:hover { background: #f0fbf9; }
        .tt-radar-item:last-child { border-bottom: none; }
        .tt-radar-item .rr-sym { font-weight: 700; }
        .tt-radar-item .rr-pct { float: right; font-weight: 700; }
        .tt-radar-empty { color: #8a99b1; font-size: 12px; }

        /* ===== AI ===== */
        .tt-ai { flex: 1; border-color: rgba(0,128,128,0.35); background: linear-gradient(180deg, #ffffff, #f2fbfa); }
        .tt-ai-body { font-size: 13.5px; color: #33415e; }
        .tt-ai-body .ai-sym { font-weight: 700; cursor: pointer; }
        .tt-ai-body .ai-sym:hover { color: #008080; }
        .tt-ai-body p { margin-bottom: 8px; }
        .tt-ai-body .ai-tag { display: inline-block; background: rgba(0,128,128,0.10); color: #008080; font-weight: 700; border-radius: 6px; padding: 1px 7px; margin-right: 5px; font-size: 12px; }

        /* ===== Sidebar lists ===== */
        .tt-ev { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f2f4f8; cursor: pointer; }
        .tt-ev:last-child { border-bottom: none; }
        .tt-n-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f2f4f8; cursor: pointer; }
        .tt-n-item:last-child { border-bottom: none; }
        .tt-news-img { flex: 0 0 auto; width: 60px; height: 48px; object-fit: cover; border-radius: 8px; background: #eef1f5; }
        .tt-news-ph { flex: 0 0 auto; width: 60px; height: 48px; border-radius: 8px; background: #f1f4f8; color: #8a99b1; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .tt-news-body { min-width: 0; display: flex; flex-direction: column; }
        .tt-ev .te-title, .tt-n-item .ni-title { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
        .tt-ev .te-date, .tt-n-item .ni-date { font-size: 11px; color: #8a99b1; margin-top: 3px; }
        .tt-news-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        /* Danh sách tin nổi bật: tối thiểu 6 tin đầu, các tin còn lại cuộn dọc (ẩn thanh cuộn).
           Block này là block DUY NHẤT giãn ra trong sidebar: khi "Lịch sự kiện thị trường"
           ngắn lại thì nó cao lên bù vào đúng phần chỗ trống đó (xem fitNewsScroll()). */
        .tt-news-card { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
        .tt-news-card > h2 { flex: 0 0 auto; }
        .tt-news-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -ms-overflow-style: none; }
        .tt-news-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
        .tt-news-scroll::-webkit-scrollbar-thumb { background: transparent; }

        /* ===== Lịch sự kiện thị trường — sự kiện SẮP DIỄN RA (kiểu "Sự kiện liên quan") ===== */
        .tt-ev-note { font-size: 12px; color: #6b7a8f; margin-bottom: 10px; line-height: 1.5; }
        .tt-ev-group { margin-bottom: 14px; }
        .tt-ev-group:last-child { margin-bottom: 0; }
        .tt-ev-sym { font-weight: 800; font-size: 13.5px; color: #008080; margin-bottom: 7px; }
        .tt-ev-item { display: flex; gap: 10px; background: #f8fafc; border: 1px solid #e9edf2; border-radius: 11px; padding: 10px 12px; margin-bottom: 7px; text-decoration: none; cursor: pointer; transition: all 0.15s; }
        .tt-ev-item:hover { border-color: #008080; }
        .tt-ev-item:last-child { margin-bottom: 0; }
        .tt-ev-ico { flex: 0 0 auto; font-size: 15px; padding-top: 2px; width: 22px; text-align: center; }
        .tt-ev-body { flex: 1; min-width: 0; }
        .tt-ev-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
        .tt-ev-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; padding: 2px 7px; border-radius: 5px; }
        .tt-ev-date { font-size: 11px; color: #8a99b1; font-weight: 700; }
        .tt-ev-days { font-size: 10.5px; font-weight: 800; color: #008080; background: rgba(0,128,128,0.1); border-radius: 5px; padding: 1px 6px; }
        .tt-ev-title { font-size: 12.5px; font-weight: 700; color: #12203a; line-height: 1.4; }
        .tt-ev-desc { font-size: 11.5px; color: #4a5a72; line-height: 1.5; margin-top: 3px; }
        .tt-ev-scroll { max-height: 470px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -ms-overflow-style: none; padding-right: 2px; }
        .tt-ev-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
        .tt-n-tag { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: rgba(0,128,128,0.09); color: #008080; border: 1px solid rgba(0,128,128,0.18); cursor: pointer; }
        .tt-n-tag:hover { border-color: #008080; }
        .tt-n-tag.neg { background: #fdeaea; color: #d0314e; border-color: rgba(208,49,78,0.2); }
        .tt-n-tag .pct { font-weight: 800; margin-left: 2px; }
        /* Không giãn: chỗ trống dư trong cột để cho "Tin tức nổi bật" hưởng */
        .tt-impact-card { flex: 0 0 auto; }
        .tt-impact-row { display: grid; grid-template-columns: 46px 1fr 70px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid #f2f4f8; cursor: pointer; }
        .tt-impact-row:hover { background: #f0fbf9; border-radius: 6px; }
        .tt-impact-row:last-child { border-bottom: none; }
        .tt-impact-sym { font-weight: 700; font-size: 12.5px; }
        .tt-impact-bar { background: #f1f4f8; height: 6px; border-radius: 4px; overflow: hidden; }
        .tt-impact-bar i { display: block; height: 100%; border-radius: 4px; }
        .tt-impact-val { text-align: right; font-size: 11.5px; color: #6b7a8f; }

<body>
    <!-- SEO-H1 -->
    <h1 class="seo-h1" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Thị trường chứng khoán Việt Nam</h1>
    <div class="tt-page">
        <div class="tt-top" id="ttTop"></div>
        <div class="tt-body">
            <div class="tt-main" id="ttMain">
                <div class="tt-loading" id="ttLoading"><i class="fas fa-spinner fa-spin"></i> Đang tải toàn cảnh thị trường...</div>
            </div>
            <aside class="tt-side" id="ttSide"></aside>
        </div>
    </div>

    <script>
        (function() {
            const main = document.getElementById('ttMain');
            const side = document.getElementById('ttSide');
            const asofEl = document.getElementById('ttAsof');
            let dash = null;

            function esc(s) {
                return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function fmt(v, d) {
                const n = Number(v);
                if (!isFinite(n)) return '--';
                return n.toLocaleString('vi-VN', { maximumFractionDigits: d == null ? 2 : d });
            }
            function fmtBig(v) { // tỷ vnd
                const n = Number(v) || 0;
                return fmt(Math.abs(n), 2);
            }
            function pct(v) {
                const n = Number(v) || 0;
                return (n >= 0 ? '+' : '') + n.toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + '%';
            }
            function signed(v, unit) {
                const n = Number(v) || 0;
                return (n >= 0 ? '+' : '−') + ' ' + fmt(Math.abs(n), 0) + (unit ? ' ' + unit : '');
            }
            function cls(v) { return Number(v) >= 0 ? 'ti-up' : 'ti-down'; }
            function cls2(v) { return Number(v) >= 0 ? 'fc-up' : 'fc-down'; }
            function fmtDate(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                if (isNaN(d.getTime())) return '';
                return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
            }
            function fmtUpd(iso) {
                // as_of ở dạng ISO UTC → +7h giờ VN, định dạng dd/MM/yyyy · HH:mm
                if (!iso) return '';
                const d = new Date(new Date(iso).getTime() + 7 * 3600 * 1000);
                if (isNaN(d.getTime())) return '';
                const p = function (x) { return (x < 10 ? '0' : '') + x; };
                return p(d.getUTCDate()) + '/' + p(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear() + ' · ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
            }
            function ttHeroHtml(asof) {
                return '<div class="tt-hero"><h1>Thị trường</h1>' +
                    '<div class="tt-hero-sub">Toàn cảnh chứng khoán Việt Nam: chỉ số chính, độ rộng, dòng tiền, hiệu suất ngành, bản đồ thị trường, radar & cổ phiếu VN30.</div>' +
                    (asof ? '<span class="tt-hero-pill"><i class="far fa-clock"></i> Cập nhật lần cuối: <b>' + asof + '</b></span>' : '') +
                    '</div>';
            }

            // ---------- SVG helpers ----------
            function sparkline(points, w, h, up) {
                if (!points || points.length < 2) return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"></svg>';
                const min = Math.min.apply(null, points), max = Math.max.apply(null, points);
                const range = (max - min) || 1;
                const pad = 2;
                const n = points.length;
                const pts = points.map(function(v, i) {
                    const x = pad + (i / (n - 1)) * (w - 2 * pad);
                    const y = h - pad - ((v - min) / range) * (h - 2 * pad);
                    return [x, y];
                });
                const line = pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
                const area = pad + ',' + (h - pad) + ' ' + line + ' ' + (w - pad) + ',' + (h - pad);
                const col = up ? '#008080' : '#d0314e';
                return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
                    '<polygon points="' + area + '" fill="' + col + '" opacity="0.14"/>' +
                    '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' +
                    '</svg>';
            }

            // ---------- Index cards ----------
            function renderIndexCards(indices) {
                const html = (indices || []).map(function(ix) {
                    const up = Number(ix.percent_change) >= 0;
                    const closes = (ix.history || []).map(function(b) { return Number(b.close); }).filter(function(v) { return isFinite(v); });
                    return '<div class="tt-idx' + (ix.key === chartKey ? ' active' : '') + '" data-key="' + esc(ix.key) + '" data-symbol="' + esc(indexSymbolOf(ix.key)) + '">' +
                        '<div class="ti-name">' + esc(ix.label) + '</div>' +
                        '<div class="ti-val">' + fmt(ix.value) + '</div>' +
                        '<div class="ti-chg ' + cls(ix.percent_change) + '">' + pct(ix.percent_change) + '</div>' +
                        '<div class="ti-spark">' + sparkline(closes, 120, 42, up) + '</div>' +
                        '</div>';
                }).join('');
                return '<div class="tt-cards">' + html + '</div>';
            }

            // ---------- Main chart ----------
            const PERIODS = [
                { label: '1D', p: '1m', slice: 5 },
                { label: '1W', p: '1m', slice: 10 },
                { label: '1M', p: '1m', slice: 0 },
                { label: '3M', p: '3m', slice: 0 },
                { label: '1Y', p: '1y', slice: 0 },
                { label: '5Y', p: '5y', slice: 0 }
            ];
            const INDEX_KEYS = [
                { key: 'vnindex', label: 'VN-INDEX' },
                { key: 'vn30', label: 'VN30' },
                { key: 'hnx', label: 'HNX-INDEX' },
                { key: 'upcom', label: 'UPCOM' }
            ];
            let chartKey = 'vnindex';
            let chartPeriod = '1y';
            let chartQuote = null;
            let chartView = null;        // cửa sổ đang xem khi ZOOM: {n, from, to} — null = xem toàn bộ
            let lastChart = null;        // {hist, d} — dữ liệu nến gần nhất để vẽ lại khi đổi kích thước / zoom
            let chartRenderedW = 0;      // bề rộng khung lúc vẽ nến (px) — tránh vẽ lại vô ích
            let chartResizeTimer = null;

            function mainChartHtml() {
                return '<section class="tt-card tt-chart">' +
                    '<div class="tt-chart-head">' +
                        '<div><select id="ttChartSelect" class="tt-chart-select">' + INDEX_KEYS.map(function(k) {
                            return '<option value="' + k.key + '"' + (k.key === chartKey ? ' selected' : '') + '>' + k.label + '</option>';
                        }).join('') + '</select>' +
                        '<div class="tt-chart-quote" id="ttChartQuote"></div>' +
                        '<div class="tt-chart-hint">Lăn chuột để zoom · kéo để di chuyển · nhấp đúp để xem toàn bộ</div></div>' +
                        '<div class="tt-chart-tools">' +
                            '<div class="tt-periods" id="ttPeriods">' + PERIODS.map(function(x) {
                                return '<button data-p="' + x.p + '" data-slice="' + x.slice + '" class="' + (x.p === chartPeriod && x.slice === 0 ? 'active' : '') + '">' + x.label + '</button>';
                            }).join('') + '</div>' +
                            '<div class="tt-chart-btns">' +
                                '<button type="button" class="tt-chart-btn" id="ttChartFs" title="Biểu đồ phân tích kỹ thuật (toàn màn hình)"><i class="fas fa-expand"></i></button>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="tt-chart-svg" id="ttChartWrap">' +
                        '<svg id="ttMainChart" viewBox="0 0 640 300" preserveAspectRatio="none"></svg>' +
                        '<div class="tt-chart-ylab" id="ttChartYlab"></div>' +
                        '<div class="tt-chart-xlab" id="ttChartXlab"></div>' +
                        '<div class="tt-chart-tip" id="ttChartTip"></div>' +
                    '</div>' +
                    '<div class="tt-chart-foot" id="ttChartFoot"></div>' +
                    '</section>';
            }

            async function loadMainChart(p, slice) {
                try {
                    const r = await fetch('/api/stocks/index-detail?key=' + chartKey + '&period=' + encodeURIComponent(p), { cache: 'no-store' });
                    const d = await r.json();
                    let hist = (d.history || []).map(function(b) {
                        // Giữ đủ OHLC để vẽ NẾN; nguồn thiếu open/high/low thì suy từ close.
                        const c = Number(b.close);
                        const o = Number(b.open) > 0 ? Number(b.open) : c;
                        const h = Number(b.high) > 0 ? Number(b.high) : Math.max(o, c);
                        const l = Number(b.low) > 0 ? Number(b.low) : Math.min(o, c);
                        return { t: b.time, o: o, h: h, l: l, c: c, v: Number(b.volume) || 0, m: Number(b.value) || 0 };
                    }).filter(function(b) { return isFinite(b.c); });
                    if (slice > 0) hist = hist.slice(-slice);
                    chartQuote = d;
                    chartView = null;                     // dữ liệu mới (đổi kỳ hạn/chỉ số) → xem toàn bộ
                    lastChart = { hist: hist, d: d };
                    renderMainChart(hist, d);
                } catch (e) {
                    const svg = document.getElementById('ttMainChart');
                    if (svg) svg.innerHTML = '';
                    const q = document.getElementById('ttChartQuote');
                    if (q) q.textContent = 'Không tải được dữ liệu biểu đồ.';
                }
            }

            function niceTicks(min, max, count) {
                const span = (max - min) || 1;
                const step0 = span / (count - 1);
                const mag = Math.pow(10, Math.floor(Math.log10(step0)));
                const norm = step0 / mag;
                const step = (norm >= 5 ? 5 : norm >= 2.5 ? 2.5 : norm >= 2 ? 2 : norm >= 1 ? 1 : 0.5) * mag;
                const start = Math.ceil(min / step) * step;
                const ticks = [];
                for (let v = start; v <= max + step * 1e-9; v += step) ticks.push(v);
                return ticks;
            }
            function fmtPts(v) {
                const n = Number(v) || 0;
                return n.toLocaleString('vi-VN', { maximumFractionDigits: Math.abs(n) >= 100 ? 1 : 2 });
            }
            function fmtVol(v) {
                const n = Number(v) || 0;
                if (n >= 1e9) return (n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' tỷ';
                if (n >= 1e6) return (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' triệu';
                if (n >= 1e3) return (n / 1e3).toLocaleString('vi-VN', { maximumFractionDigits: 0 }) + ' nghìn';
                return String(Math.round(n));
            }
            function renderMainChart(hist, d) {
                const svg = document.getElementById('ttMainChart');
                const wrap = document.getElementById('ttChartWrap');
                const q = document.getElementById('ttChartQuote');
                const foot = document.getElementById('ttChartFoot');
                const tip = document.getElementById('ttChartTip');
                if (!svg) return;

                // Cửa sổ đang xem (ZOOM): [from..to] là chỉ số trong `hist`; chartView = null → xem toàn bộ.
                const n = hist.length;
                if (!chartView || chartView.n !== n) chartView = { n: n, from: 0, to: n - 1 };
                const from = Math.max(0, Math.min(chartView.from, Math.max(0, n - 2)));
                const to = Math.min(n - 1, Math.max(chartView.to, from + 1));
                chartView = { n: n, from: from, to: to };
                const view = hist.slice(from, to + 1);
                const m = view.length;

                if (q) {
                    const up = Number(d.percent_change) >= 0;
                    q.innerHTML = '<b>' + fmt(d.value) + '</b> điểm · <span class="' + cls(d.percent_change) + '">' + pct(d.percent_change) + '</span>';
                }
                if (foot) {
                    if (m) {
                        const f0 = view[0], f1 = view[m - 1];
                        foot.innerHTML = '<span>Phiên đầu: ' + fmtDate(f0.t) + ' · ' + fmt(f0.c) + '</span>' +
                            '<span>Phiên cuối: ' + fmtDate(f1.t) + ' · ' + fmt(f1.c) + '</span>' +
                            (m < n ? '<span>Đang xem ' + m + '/' + n + ' phiên — nhấp đúp để xem toàn bộ</span>' : '');
                    } else {
                        foot.innerHTML = '';
                    }
                }
                if (hist.length < 2) { svg.innerHTML = ''; return; }

                // Đo kích thước THẬT của khung rồi set viewBox 1:1 ⇒ NẾN không bị kéo giãn ngang
                // (khung rộng hơn 640px rất nhiều; viewBox cố định + preserveAspectRatio=none làm nến dẹt).
                const W = Math.max(320, Math.round((wrap && wrap.clientWidth) || 640));
                const H = Math.max(180, Math.round((wrap && wrap.clientHeight) || 300));
                svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
                chartRenderedW = W;

                const padL = 52, padR = 12, padT = 12, padB = 26;
                const lows = view.map(function(b) { return b.l; });
                const highs = view.map(function(b) { return b.h; });
                let min = Math.min.apply(null, lows), max = Math.max.apply(null, highs);
                if (!(max > min)) max = min + 1;
                const edge = (max - min) * 0.05;        // chừa mép trên/dưới cho bấc nến
                min -= edge; max += edge;
                const range = max - min;
                const plotW = W - padL - padR, plotH = H - padT - padB;
                const step = plotW / m;
                const cx = function(i) { return padL + step * (i + 0.5); };   // tâm nến
                const py = function(v) { return padT + (1 - (v - min) / range) * plotH; };
                const bw = Math.max(1, Math.min(step * 0.62, 13));           // bề rộng thân nến
                const UP = '#008080', DOWN = '#d0314e';

                // horizontal gridlines + Y point labels (HTML để chữ không méo)
                const ticks = niceTicks(min, max, 6);
                let grid = '';
                let ylab = '';
                ticks.forEach(function(v) {
                    const y = py(v);
                    grid += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="rgba(15,23,42,0.07)" stroke-width="1"/>';
                    ylab += '<div class="yl" style="top:' + (y / H * 100) + '%;">' + fmtPts(v) + '</div>';
                });
                // vertical gridlines
                for (let i = 0; i <= 6; i++) {
                    const x = padL + (i / 6) * plotW;
                    grid += '<line x1="' + x.toFixed(1) + '" y1="' + padT + '" x2="' + x.toFixed(1) + '" y2="' + (H - padB) + '" stroke="rgba(15,23,42,0.05)" stroke-width="1"/>';
                }
                // X date labels (HTML)
                const idxs = [0, Math.floor((m - 1) / 2), m - 1];
                const xlab = idxs.map(function(i) {
                    const left = cx(i) / W * 100;
                    const tr = i === 0 ? 'translateX(0)' : (i === m - 1 ? 'translateX(-100%)' : 'translateX(-50%)');
                    return '<div class="xl" style="left:' + left + '%;transform:' + tr + ';top:calc(100% - 24px);">' + fmtDate(view[i].t) + '</div>';
                }).join('');

                // NẾN: bấc (high→low) + thân (open→close). Tăng = xanh teal, giảm = đỏ (quy ước up/down toàn site).
                let candles = '';
                view.forEach(function(b, i) {
                    const x = cx(i);
                    const col = b.c >= b.o ? UP : DOWN;
                    const yO = py(b.o), yC = py(b.c);
                    const top = Math.min(yO, yC);
                    const bodyH = Math.max(1, Math.abs(yC - yO));
                    candles += '<line x1="' + x.toFixed(1) + '" y1="' + py(b.h).toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + py(b.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1"/>' +
                        '<rect x="' + (x - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bodyH.toFixed(1) + '" fill="' + col + '"/>';
                });
                // Đường giá ĐÓNG CỬA phiên cuối (mốc hiện tại) — nét đứt mảnh
                const lastY = py(view[m - 1].c);
                const lastLine = '<line x1="' + padL + '" y1="' + lastY.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + lastY.toFixed(1) + '" stroke="#008080" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>';

                svg.innerHTML = grid + candles + lastLine +
                    '<line id="ttChartCross" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" stroke="#4a5a72" stroke-width="1" stroke-dasharray="4 3" opacity="0.55" visibility="hidden"/>';

                const ylabEl = document.getElementById('ttChartYlab');
                if (ylabEl) ylabEl.innerHTML = ylab;
                const xlabEl = document.getElementById('ttChartXlab');
                if (xlabEl) xlabEl.innerHTML = xlab;

                // crosshair + tooltip (điểm, ngày, OHLC, thanh khoản)
                const cross = document.getElementById('ttChartCross');
                if (wrap && tip) {
                    wrap.onmousemove = function(e) {
                        const r = svg.getBoundingClientRect();
                        const mx = (e.clientX - r.left) / r.width * W;
                        const step = (W - padL - padR) / (n - 1);
                        let i = Math.round((mx - padL) / step - 0.5);
                        i = Math.max(0, Math.min(m - 1, i));
                        const b = view[i];
                        const bx = cx(i);
                        if (cross) { cross.setAttribute('x1', bx); cross.setAttribute('x2', bx); cross.setAttribute('visibility', 'visible'); }
                        tip.innerHTML =
                            '<div class="tip-v">' + fmtPts(b.c) + ' điểm</div>' +
                            '<div class="tip-r">Ngày: ' + fmtDate(b.t) + '</div>' +
                            '<div class="tip-r">Mở ' + fmtPts(b.o) + ' · Cao ' + fmtPts(b.h) + ' · Thấp ' + fmtPts(b.l) + '</div>' +
                            '<div class="tip-r">Thanh khoản: ' + fmtVol(b.v) + ' cp' + (b.m ? ' · ' + fmt(b.m / 1e9, 0) + ' tỷ' : '') + '</div>';
                        tip.classList.add('show');
                        let t = e.clientX - r.left + 16;
                        let ty = e.clientY - r.top + 16;
                        const tw = tip.offsetWidth || 160;
                        const th = tip.offsetHeight || 70;
                        if (t + tw > r.width) t = e.clientX - r.left - tw - 12;
                        if (ty + th > r.height) ty = e.clientY - r.top - th - 12;
                        tip.style.left = Math.max(4, t) + 'px';
                        tip.style.top = Math.max(4, ty) + 'px';
                    };
                    wrap.onmouseleave = function() {
                        tip.classList.remove('show');
                        if (cross) cross.setAttribute('visibility', 'hidden');
                    };
                }

                // ---------- ZOOM: lăn chuột (theo vị trí trỏ) · kéo để di chuyển · nhấp đúp xem toàn bộ ----------
                if (wrap) {
                    wrap.style.cursor = m < n ? 'grab' : '';
                    let dragging = false, dragStartX = 0, dragFrom = 0;
                    wrap.onwheel = function(e) {
                        if (n < 4) return;
                        e.preventDefault();                       // chặn cuộn trang khi zoom biểu đồ
                        const r = svg.getBoundingClientRect();
                        const mx = (e.clientX - r.left) / r.width * W;
                        const anchor = Math.max(from, Math.min(to, from + Math.round((mx - padL) / step - 0.5)));
                        const span0 = to - from + 1;
                        const span = e.deltaY < 0
                            ? Math.max(3, Math.round(span0 * 0.8))
                            : Math.min(n, Math.round(span0 * 1.25));
                        if (span === span0) return;
                        let nf = anchor - Math.round((anchor - from) / span0 * span);
                        let nt = nf + span - 1;
                        if (nf < 0) { nf = 0; nt = span - 1; }
                        if (nt > n - 1) { nt = n - 1; nf = Math.max(0, nt - span + 1); }
                        chartView = { n: n, from: nf, to: nt };
                        renderMainChart(hist, d);
                    };
                    wrap.onpointerdown = function(e) {
                        if (e.button !== 0 || m >= n) return;
                        dragging = true; dragStartX = e.clientX; dragFrom = from;
                        wrap.style.cursor = 'grabbing';
                        try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
                    };
                    wrap.onpointermove = function(e) {
                        if (!dragging || m >= n) return;
                        const r = svg.getBoundingClientRect();
                        const shift = Math.round(-((e.clientX - dragStartX) / r.width * W) / step);
                        const nf = Math.max(0, Math.min(n - m, dragFrom + shift));
                        if (nf !== from) {
                            chartView = { n: n, from: nf, to: nf + m - 1 };
                            renderMainChart(hist, d);
                        }
                    };
                    wrap.onpointerup = function() { dragging = false; wrap.style.cursor = m < n ? 'grab' : ''; };
                    wrap.onpointercancel = function() { dragging = false; };
                    wrap.ondblclick = function() { chartView = null; renderMainChart(hist, d); };
                }
            }

            // ---------- Breadth ----------
            function renderBreadth(b) {
                const up = Number(b.up) || 0, down = Number(b.down) || 0, flat = Number(b.flat) || 0;
                const total = (Number(b.total) || (up + down + flat)) || 1;
                const pUp = (up / total * 100).toFixed(1), pDown = (down / total * 100).toFixed(1), pFlat = (flat / total * 100).toFixed(1);
                return '<section class="tt-card">' +
                    '<h2>Market Breadth</h2>' +
                    '<div class="tt-breadth-stack">' +
                        '<div class="seg" style="flex:' + up + ';background:#00A745;min-width:' + (up ? '28px' : '0') + '">' + (up ? (pUp + '%') : '') + '</div>' +
                        '<div class="seg" style="flex:' + down + ';background:#d0314e;min-width:' + (down ? '28px' : '0') + '">' + (down ? (pDown + '%') : '') + '</div>' +
                        '<div class="seg" style="flex:' + flat + ';background:#FFC107;color:#6b5b00;min-width:' + (flat ? '28px' : '0') + '">' + (flat ? (pFlat + '%') : '') + '</div>' +
                    '</div>' +
                    '<div class="tt-breadth-meta">' +
                        '<div class="bm"><span class="dot" style="background:#00A745;"></span><div>Tăng <b class="ti-up">' + up + '</b></div></div>' +
                        '<div class="bm"><span class="dot" style="background:#d0314e;"></span><div>Giảm <b class="ti-down">' + down + '</b></div></div>' +
                        '<div class="bm"><span class="dot" style="background:#FFC107;"></span><div>Đứng <b>' + flat + '</b></div></div>' +
                    '</div>' +
                    '<div class="tt-breadth-chips">' +
                        '<span class="tt-chip">Tăng trần <b class="ti-up">' + (b.ceiling || 0) + '</b></span>' +
                        '<span class="tt-chip">Giảm sàn <b class="ti-down">' + (b.floor || 0) + '</b></span>' +
                        '<span class="tt-chip">Tổng mã giao dịch <b>' + total + '</b></span>' +
                    '</div>' +
                    '</section>';
            }

            // ---------- Flow ----------
            function renderFlow(f) {
                const liq = f.liquidity || {};
                const net = Number(f.foreign_net) || 0;
                const gtg = Number(f.gtgd_today) || 0;
                const gtgY = Number(f.gtgd_yesterday) || 0;
                const gtgDelta = gtgY ? ((gtg / gtgY - 1) * 100) : 0;
                const volNow = Number(liq.last_volume) || 0;
                const volPrev = Number(liq.prev_volume) || 0;
                const volDelta = volPrev ? ((volNow / volPrev - 1) * 100) : 0;
                const cards = [
                    { ico: 'fa-coins', label: 'Giá trị giao dịch', val: fmt(gtg, 0) + ' <span style="font-size:12px;font-weight:600;">tỷ</span>', sub: 'Hôm qua ' + fmt(gtgY, 0) + ' tỷ · ' + pct(gtgDelta), cls2: cls2(gtgDelta) },
                    { ico: 'fa-flag', label: 'Khối ngoại', val: signed(net / 1e9, 'tỷ'), sub: 'Mua ròng theo giá trị giao dịch', cls2: cls2(net) },
                    { ico: 'fa-building-columns', label: 'Tự doanh', val: '—', sub: 'Chưa có dữ liệu', cls2: '' },
                    { ico: 'fa-water', label: 'Thanh khoản', val: (liq.volume_ratio ? fmt(liq.volume_ratio, 2) : '--') + '<span style="font-size:12px;font-weight:600;"> lần TB 1 tháng</span>', sub: 'Hôm nay: ' + fmt(volNow / 1e6, 1) + ' tr cp · ' + fmt(gtg, 0) + ' tỷ<br>Hôm qua: ' + fmt(volPrev / 1e6, 1) + ' tr cp · ' + fmt(gtgY, 0) + ' tỷ · ' + pct(volDelta), cls2: cls2(volDelta) },
                    { ico: 'fa-arrow-trend-up', label: 'Số mã tăng trần', val: (f.ceiling_count || 0), sub: 'Trong tổng mã tăng', cls2: 'fc-up' },
                    { ico: 'fa-arrow-trend-down', label: 'Số mã giảm sàn', val: (f.floor_count || 0), sub: 'Trong tổng mã giảm', cls2: 'fc-down' }

                            '<div class="fc-label">' + c.label + '</div>' +

            // ---------- Sectors ----------
            function renderSectors(secs) {
                if (!secs || !secs.length) return '<section class="tt-card"><h2>Hiệu suất ngành</h2><div class="tt-radar-empty">Chưa có dữ liệu ngành.</div></section>';
                const maxAbs = Math.max.apply(null, secs.map(function(s) { return Math.abs(s.avg_pct); })) || 1;
                const rows = secs.map(function(s) {
                    const up = s.avg_pct >= 0;
                    const width = Math.max(4, Math.round(Math.abs(s.avg_pct) / maxAbs * 100));
                    return '<div class="tt-sector-row">' +
                        '<div class="tt-sector-name">' + esc(s.name) + ' <span class="ts-count">(' + s.total + ')</span></div>' +
                        '<div class="tt-sector-bar-wrap"><div class="tt-sector-bar ' + (up ? 'ts-up' : 'ts-down') + '" style="width:' + width + '%;"></div></div>' +
                        '<div class="tt-sector-pct ' + cls(s.avg_pct) + '">' + pct(s.avg_pct) + '</div>' +
                        '<div class="tt-sector-count">▲' + s.up_count + ' ▼' + s.down_count + '</div>' +
                        '</div>';
                }).join('');
                return '<section class="tt-card">' +
                    '<h2>Hiệu suất ngành</h2>' + rows + '</section>';

            // ---------- VN30 ----------
            async function loadVn30() {
                const wrap = document.getElementById('ttVn30Wrap');
                if (!wrap) return;
                try {
                    const r = await fetch('/api/stocks/watchlist', { cache: 'no-store' });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const rows = await r.json();
                    if (!rows || !rows.length) { wrap.innerHTML = '<div class="tt-vn30-empty">Chưa có dữ liệu.</div>'; return; }
                    const body = rows.map(function(s) {
                        const p = Number(s.percent_change) || 0;
                        const up = p >= 0;
                        const closes = (s.sparkline || []).map(function(pt) { return Number(pt && pt.close); }).filter(function(v) { return isFinite(v); });
                        const spUp = closes.length >= 2 ? (closes[closes.length - 1] >= closes[0]) : up;
                        return '<tr class="tt-vn30-row" data-symbol="' + esc(s.symbol) + '">' +
                            '<td class="tt-vn30-sym">' + esc(s.symbol) + '<span data-div="' + esc(s.symbol) + '"></span><div class="tt-vn30-name">' + esc(s.name) + '</div></td>' +
                            '<td class="tt-vn30-price">' + fmt(s.price) + '</td>' +
                            '<td class="' + cls(p) + '">' + pct(p) + '</td>' +
                            '<td class="tt-vn30-spark">' + sparkline(closes, 84, 30, spUp) + '</td>' +
                            '<td class="tt-vn30-num">' + fmt(s.pe, 1) + '</td>' +
                            '<td class="tt-vn30-num">' + fmt(s.pb, 1) + '</td>' +
                            '</tr>';
                    }).join('');
                    wrap.innerHTML = '<div class="tt-vn30-scroll"><table class="tt-vn30-table"><thead><tr>' +
                        '<th>Mã</th><th>Giá</th><th>% HN</th><th>30 ngày</th><th>P/E</th><th>P/B</th>' +
                        '</tr></thead><tbody>' + body + '</tbody></table></div>';
                    wrap.querySelectorAll('.tt-vn30-row').forEach(function(row) {
                        row.addEventListener('click', function() {
                            const sym = row.getAttribute('data-symbol');
                            if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'vinafintech-open-stock', symbol: sym }, '*');
                        });
                    });
                } catch (e) {
                    wrap.innerHTML = '<div class="tt-vn30-empty">Không tải được dữ liệu VN30.</div>';
                }
                notifyParentHeight();
            }

            // ---------- Radar ----------
            function radarItem(st, pctv) {
                return '<div class="tt-radar-item" data-symbol="' + esc(st) + '"><span class="rr-sym">' + esc(st) + '</span><span class="rr-pct ' + cls(pctv) + '">' + pct(pctv) + '</span></div>';

            function radarList(items, symKey, pctKey, empty) {
                if (!items || !items.length) return '<div class="tt-radar-empty">' + empty + '</div>';

            // Khối ngoại: 8 mã mua/bán ròng mạnh nhất (giá trị ròng tính theo tỷ đồng).
            function radarForeign(items, empty) {
                const list = (items || []).slice(0, 8);
                if (!list.length) return '<div class="tt-radar-empty">' + empty + '</div>';

                    const net = Number(it.net_value) || 0;
                    return '<div class="tt-radar-item" data-symbol="' + esc(it.symbol) + '"><span class="rr-sym">' + esc(it.symbol) + '</span><span class="rr-pct ' + (net >= 0 ? 'fc-up' : 'fc-down') + '">' + (net >= 0 ? '+' : '-') + fmt(Math.abs(net) / 1e9, 0) + ' tỷ</span></div>';

            function renderRadar(r) {
                const sell = r.foreign_sell || [];

                return '<section class="tt-card tt-radar" id="ttMarketRadarCard">' +
                    '<h2>VinaFintech Market Radar</h2>' +
                    '<div class="tt-radar-grid">' +
                        '<div class="tt-radar-col"><h3>Cổ phiếu breakout</h3>' +
                            radarList(r.breakout, 'symbol', 'percent_change', 'Không có mã breakout.') + '</div>' +
                        '<div class="tt-radar-col"><h3>Volume bất thường</h3>' +
                            ((r.volume_spike || []).map(function(it) {
                                return '<div class="tt-radar-item" data-symbol="' + esc(it.symbol) + '"><span class="rr-sym">' + esc(it.symbol) + '</span><span class="rr-pct">' + fmt(it.volume / 1e6, 1) + ' tr</span></div>';
                            }).join('') || '<div class="tt-radar-empty">Chưa có dữ liệu.</div>') + '</div>' +
                        '<div class="tt-radar-col"><h3>Nhóm suy yếu</h3>' +
                            radarList(r.weak, 'symbol', 'percent_change', 'Không có mã giảm.') + '</div>' +
                        '<div class="tt-radar-col"><h3>Khối ngoại mua mạnh</h3>' +
                            radarForeign(buy, 'Chưa có dữ liệu.') + '</div>' +
                        '<div class="tt-radar-col"><h3>Khối ngoại bán mạnh</h3>' +

            function focusMarketSection(focus, attempts) {
                const targetId = {
                    'market-map': 'ttMarketMapCard',

                }[focus];

            // ---------- AI analysis ----------
            function renderAi(f, b, secs, radar) {
                const trend = f.trend || {};
                const vni = dash && dash.indices ? dash.indices[0] : null;
                const net = Number(f.foreign_net) || 0;
                const liq = f.liquidity || {};
                const gtg = Number(f.gtgd_today) || 0;
                const hot = radar.hot_sector;
                const topUp = (radar.breakout || [])[0];
                const topDown = (radar.weak || [])[0];
                const parts = [];
                parts.push('<p><span class="ai-tag">Chỉ số</span>VN-INDEX ' +
                    (vni ? fmt(vni.value) + ' điểm (' + pct(vni.percent_change) + ')' : 'chưa có dữ liệu') +
                    (trend.label ? ', xu hướng <b>' + trend.label + '</b> (' + pct(trend['1m']) + ' 1T / ' + pct(trend['3m']) + ' 3T)' : '') + '.</p>');
                parts.push('<p><span class="ai-tag">Độ rộng</span>Thị trường phân hóa ' + (b.up >= b.down ? 'tích cực' : 'tiêu cực') + ': ' +
                    b.up + ' mã tăng (trong đó ' + b.ceiling + ' trần) / ' + b.down + ' mã giảm (' + b.floor + ' sàn), ' + b.flat + ' mã đứng giá.</p>');
                parts.push('<p><span class="ai-tag">Dòng tiền</span>Khối ngoại ' + (net >= 0 ? 'mua ròng' : 'bán ròng') + ' <b>' + fmt(Math.abs(net) / 1e9, 0) + ' tỷ</b> đồng; ' +
                    'giá trị giao dịch HOSE đạt ' + fmt(gtg, 0) + ' tỷ' +
                    (liq.volume_ratio ? ' (gấp ' + fmt(liq.volume_ratio, 2) + ' lần trung bình 1 tháng)' : '') + '.</p>');
                if (hot) parts.push('<p><span class="ai-tag">Điểm sáng</span>Ngành <b>' + esc(hot.name) + '</b> hút tiền nhất (' + pct(hot.avg_pct) + '), dẫn dắt bởi ' + (hot.top_gainer ? '<span class="ai-sym" data-symbol="' + esc(hot.top_gainer) + '">' + esc(hot.top_gainer) + '</span>' : '--') + '.</p>');
                if (topUp) parts.push('<p><span class="ai-tag">Đà tăng</span>Cổ phiếu breakout mạnh nhất: <span class="ai-sym" data-symbol="' + esc(topUp.symbol) + '">' + esc(topUp.symbol) + '</span> (' + pct(topUp.percent_change) + ').</p>');
                if (topDown) parts.push('<p><span class="ai-tag">Rủi ro</span>Nhóm suy yếu đáng chú ý: <span class="ai-sym" data-symbol="' + esc(topDown.symbol) + '">' + esc(topDown.symbol) + '</span> (' + pct(topDown.percent_change) + ').</p>');
                return '<section class="tt-card tt-ai">' +
                    '<h2><i class="fas fa-robot tt-h2-ico" style="color:#008080;"></i> VinaF AI Market Analysis</h2>' +
                    '<div class="tt-ai-body">' + parts.join('') + '</div></section>';
            }

            // ---------- Bản đồ thị trường (treemap: diện tích = khối lượng) ----------
            // Màu: Trần = tím, Tăng = xanh lá, Đứng = vàng, Giảm = đỏ, Sàn = xanh lơ
            const MAP_COLORS = { ceiling: '#9A26F3', up: '#00A745', flat: '#FFC107', down: '#DC3545', floor: '#33b1e3' };
            function mapState(s) {
                const p = Number(s.percent_change) || 0;
                const ex = String(s.exchange || '').toUpperCase();
                const ceil = ex === 'HNX' ? 9.5 : ex === 'UPCOM' ? 14.5 : 6.8;
                if (p >= ceil) return MAP_COLORS.ceiling;
                if (p <= -ceil) return MAP_COLORS.floor;
                if (p === 0) return MAP_COLORS.flat;
                return p > 0 ? MAP_COLORS.up : MAP_COLORS.down;
            }
            function treemapSquarify(data, width, height) {
                const total = data.reduce(function(s, d) { return s + Math.max(d.value, 0); }, 0);
                if (total <= 0 || !data.length) return [];
                const scaled = data.map(function(d) { return { d: d, v: Math.max(d.value, 0) * (width * height) / total }; });
                scaled.sort(function(a, b) { return b.v - a.v; });
                const rects = [];
                let x = 0, y = 0, w = width, h = height, i = 0;
                const row = [];
                function worst(rowArr, side) {
                    const s = rowArr.reduce(function(a, r) { return a + r.v; }, 0);
                    let max = 0, min = Infinity;
                    rowArr.forEach(function(r) { if (r.v > max) max = r.v; if (r.v < min) min = r.v; });
                    const s2 = s * s, l2 = side * side;
                    return Math.max((l2 * max) / s2, s2 / (l2 * min));
                }
                function layoutRow(rowArr, rx, ry, rw, rh) {
                    const s = rowArr.reduce(function(a, r) { return a + r.v; }, 0);
                    if (rw >= rh) {
                        const tw = s / rh;
                        let yy = ry;
                        rowArr.forEach(function(r) { const th = r.v / tw; rects.push({ d: r.d, x: rx, y: yy, w: tw, h: th }); yy += th; });
                        return { x: rx + tw, y: ry, w: rw - tw, h: rh };
                    } else {
                        const th = s / rw;
                        let xx = rx;
                        rowArr.forEach(function(r) { const tw = r.v / th; rects.push({ d: r.d, x: xx, y: ry, w: tw, h: th }); xx += tw; });
                        return { x: rx, y: ry + th, w: rw, h: rh - th };
                    }
                }
                while (i < scaled.length) {
                    const side = Math.min(w, h);
                    const candidate = row.concat([scaled[i]]);
                    if (row.length === 0 || worst(candidate, side) <= worst(row, side)) {
                        row.push(scaled[i]);
                        i++;
                        if (i >= scaled.length) { const r = layoutRow(row, x, y, w, h); x = r.x; y = r.y; w = r.w; h = r.h; row.length = 0; }
                    } else {
                        const r = layoutRow(row, x, y, w, h); x = r.x; y = r.y; w = r.w; h = r.h; row.length = 0;
                    }
                }
                return rects;
            }

            async function loadMarketMap() {

                    const groupList = Object.keys(groups).map(function(k) { return { name: k, items: groups[k] }; });
                    groupList.sort(function(a, b) {
                        const va = a.items.reduce(function(s, x) { return s + (Number(x.volume) || 0); }, 0);
                        const vb = b.items.reduce(function(s, x) { return s + (Number(x.volume) || 0); }, 0);
                        return vb - va;
                    });
                    const W = 820, H = 640, GAP_S = 1.5, GAP_T = 1.6, LABEL_H = 13;

                        const tiles = tileRects.map(function(rr) {

            // ---------- Sidebar ----------

            function extractNewsTickers(n) {
                const cands = [];

                };
                String(n.tags || '').split(',').forEach(push);

                const m = body.match(/\b[A-Z]{3}\b/g) || [];

            function daysLeft(iso) {

            // ---------- Lịch sự kiện thị trường: TOÀN BỘ cổ phiếu 3 sàn, làm mới 12h trưa ----------

            let ttEventsDay = '';

            function vnSnapshotKey() {
                const d = new Date(Date.now() + 7 * 3600 * 1000);   // UTC+7
                const day = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
                return day + (d.getUTCHours() >= 12 ? '|pm' : '|am');   // mốc đổi lúc 12h trưa VN

                    el.addEventListener('click', function() {
                        const sym = el.getAttribute('data-symbol');
                        if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'vinafintech-open-stock', symbol: sym }, '*');
                    });
                });
                side.querySelectorAll('[data-symbol]').forEach(function(el) {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const sym = el.getAttribute('data-symbol');
                        if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'vinafintech-open-stock', symbol: sym }, '*');
                    });
                });
                side.querySelectorAll('[data-news]').forEach(function(el) {
                    el.addEventListener('click', function() {
                        const id = el.getAttribute('data-news');
                        const slug = el.getAttribute('data-slug') || '';
                        if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'vinafintech-open-tintuc', id: Number(id), slug: slug }, '*');
                    });
                });
                const periods = document.getElementById('ttPeriods');
                if (periods) periods.addEventListener('click', function(e) {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    periods.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    chartPeriod = btn.getAttribute('data-p');
                    loadMainChart(chartPeriod, Number(btn.getAttribute('data-slice') || 0));
                });
                const sel = document.getElementById('ttChartSelect');
                if (sel) sel.addEventListener('change', function() {
                    chartKey = sel.value;
                    document.querySelectorAll('.tt-idx').forEach(function(c) {
                        c.classList.toggle('active', c.getAttribute('data-key') === chartKey);
                    });
                    loadMainChart(chartPeriod, 0);
                });
                // Nút toàn màn hình của biểu đồ nến (đã bỏ nút zoom +/− và nút xem toàn bộ: zoom vẫn
                // dùng được bằng LĂN CHUỘT, kéo để di chuyển, nhấp đúp để xem toàn bộ).
                const fsBtn = document.getElementById('ttChartFs');
                if (fsBtn) fsBtn.addEventListener('click', openChartFullscreen);
                const shotBtn = document.getElementById('ttMapShot');
                if (shotBtn) shotBtn.addEventListener('click', exportMapPng);
                const shareBtn = document.getElementById('ttMapShare');
                if (shareBtn) shareBtn.addEventListener('click', function() {
                    window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(window.location.href), '_blank', 'width=640,height=520,noopener=yes');
                });
            }

            async function load() {
                try {
                    const res = await fetch('/api/stocks/market-dashboard', { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    dash = await res.json();
                } catch (e) {
                    main.innerHTML = '<div class="tt-loading">Không tải được dữ liệu thị trường. <a href="#" onclick="location.reload();return false;">Thử lại</a></div>';
                    notifyParentHeight();
                    return;
                }
                const b = dash.breadth || {}, f = dash.flow || {}, secs = dash.sectors || [], radar = dash.radar || {}, imp = dash.impact || [];
                if (asofEl) asofEl.textContent = 'Cập nhật: ' + fmtDate(dash.as_of);

                const top = document.getElementById('ttTop');
                if (top) top.innerHTML = ttHeroHtml(fmtUpd(dash.as_of)) + mainChartHtml() +
                    '<section class="tt-card" id="ttMarketMapCard"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;"><h2 style="margin-bottom:0;">Bản đồ thị trường</h2><div style="margin-left:auto;display:flex;align-items:center;gap:10px;"><div class="tt-map-legend" id="ttMapLegend" style="margin-bottom:0;flex-shrink:0;"></div><button id="ttMapShot" class="tt-map-btn" title="Tải ảnh bản đồ thị trường"><i class="fas fa-camera"></i></button><button id="ttMapShare" class="tt-map-btn fb" title="Chia sẻ lên Facebook"><i class="fab fa-facebook"></i></button></div></div><div id="ttMapSlot"><div class="tt-loading" style="padding:16px;"><i class="fas fa-spinner fa-spin"></i> Đang tải bản đồ...</div></div></section>';
                main.innerHTML = renderBreadth(b) +
                    renderFlow(f) +
                    renderRadar(radar) +
                    renderSectors(secs) +
                    '<section class="tt-card"><h2>Danh sách cổ phiếu trong VN30</h2><div class="tt-vn30-wrap" id="ttVn30Wrap"><div class="tt-vn30-empty"><i class="fas fa-spinner fa-spin"></i> Đang tải...</div></div></section>' +
                    renderAi(f, b, secs, radar);

                loadMainChart('1y', 0);
                loadMarketMap();
                loadVn30();
                focusMarketSection(new URLSearchParams(window.location.search).get('focus'), 0);

                // Sidebar: sự kiện + tin nổi bật + ảnh hưởng
                side.innerHTML = '<div class="tt-loading" style="padding:20px;"><i class="fas fa-spinner fa-spin"></i></div>';
                Promise.all([
                    // "Tin tức nổi bật" = 20 tin MỚI NHẤT của chuyên mục Chứng khoán
                    // (block chỉ hiện 6 tin đầu, các tin còn lại cuộn trong block)
                    fetch('/api/news?category=chung-khoan&limit=20').then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; }),
                    fetch('/api/stocks/stock-screener').then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; })
                ]).then(function(arrs) {
                    const pops = Array.isArray(arrs[0]) ? arrs[0] : ((arrs[0] && arrs[0].items) || []);
                    const sd = arrs[1];
                    const symMap = {};
                    (sd && sd.stocks || []).forEach(function(s) { symMap[s.symbol] = s; });
                    setNewsSyms(symMap);
                    renderSide(pops, imp);
                    fitNewsScroll();
                    loadUpcomingEvents();
                    bindClicks();
                    notifyParentHeight();
                });
                setTimeout(notifyParentHeight, 500);
            }

            // ===== Embed =====
            if (window.self !== window.top) document.body.classList.add('embedded');
            function applyEmbedTheme(mode) { document.body.classList.toggle('dark-mode', mode === 'dark'); }
            function notifyParentHeight() {
                try {
                    const el = document.querySelector('.tt-page') || document.body;
                    const height = Math.ceil(el.getBoundingClientRect().height);
                    if (!height || height <= 0) return;
                    if (Math.abs(height - (window.__lastSentH || 0)) < 2) return;
                    window.__lastSentH = height;
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'vinafintech-embed-height', height: height }, '*');
                    }
                } catch (e) {}
            }
            window.addEventListener('message', function(event) {
                const data = event.data;
                if (!data || data.type !== 'vinafintech-theme') return;
                const mode = data.mode === 'dark' ? 'dark' : 'light';
                localStorage.setItem('theme', mode);
                applyEmbedTheme(mode);
                setTimeout(notifyParentHeight, 50);
            });
            window.addEventListener('load', function() {
                applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
                setTimeout(notifyParentHeight, 60);
                setTimeout(notifyParentHeight, 400);
            });
            // ---------- Zoom biểu đồ nến ----------
            function zoomChart(factor) {
                if (!lastChart || !lastChart.hist || lastChart.hist.length < 4) return;
                const n = lastChart.hist.length;
                const cur = chartView || { n: n, from: 0, to: n - 1 };
                const span0 = cur.to - cur.from + 1;
                const span = Math.max(3, Math.min(n, Math.round(span0 / factor)));
                if (span === span0) return;
                const center = (cur.from + cur.to) / 2;
                let nf = Math.round(center - span / 2);
                let nt = nf + span - 1;
                if (nf < 0) { nf = 0; nt = span - 1; }
                if (nt > n - 1) { nt = n - 1; nf = Math.max(0, nt - span + 1); }
                chartView = { n: n, from: nf, to: nt };
                renderMainChart(lastChart.hist, lastChart.d);
            }
            // Chỉ số đang xem → mã dùng cho màn hình biểu đồ nến TOÀN MÀN HÌNH.
            function indexSymbolOf(key) {
                return key === 'vnindex' ? 'VNINDEX' : key === 'hnx' ? 'HNXINDEX' : key === 'upcom' ? 'UPINDEX' : 'VN30';
            }
            // Nút fullscreen trong block biểu đồ → dùng ĐÚNG xử lý của icon nến ở header.
            // Gọi thẳng hàm mà shell dùng cho icon nến (`window.parent.vinafintechChartFullscreenRequest`) nên
            // hai chỗ chỉ có MỘT code path: nạp trang chi tiết kèm ?fs=1 + bật fullscreen, thoát thì quay lại
            // đúng trang Thị trường. Chỉ khi không gọi được trực tiếp (khác origin) mới postMessage dự phòng.
            function openChartFullscreen() {
                const sym = indexSymbolOf(chartKey);
                if (window.parent && window.parent !== window) {
                    try {
                        if (typeof window.parent.vinafintechChartFullscreenRequest === 'function') {
                            window.parent.vinafintechChartFullscreenRequest(sym);
                            return;
                        }
                    } catch (e) { /* khác origin → dùng postMessage bên dưới */ }
                    window.parent.postMessage({ type: 'vinafintech-open-chart-fullscreen', symbol: sym }, '*');
                } else {
                    window.location.href = '/cophieu-' + encodeURIComponent(sym) + '?fs=1';
                }
            }

            window.addEventListener('resize', function() {
                fitNewsScroll();
                notifyParentHeight();
                // Nến vẽ theo bề rộng THẬT của khung ⇒ vẽ lại khi bề rộng đổi (debounce, tránh vòng lặp).
                if (lastChart) {
                    clearTimeout(chartResizeTimer);
                    chartResizeTimer = setTimeout(function() {
                        const w = document.getElementById('ttChartWrap');
                        if (w && Math.abs(w.clientWidth - chartRenderedW) >= 4) renderMainChart(lastChart.hist, lastChart.d);
                    }, 180);
                }
            });
            if (window.ResizeObserver) {
                const obs = new ResizeObserver(function() { fitNewsScroll(); notifyParentHeight(); });
                obs.observe(document.querySelector('.tt-page') || document.body);
            }
            applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
            load();
        })();
    </script>
