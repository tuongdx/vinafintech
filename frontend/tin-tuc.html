            // Ảnh lazy-load xong thì báo lại chiều cao
            window.__newsNotify = function () {
                var t = window.__newsNotifyTimer;
                if (t) clearTimeout(t);
                window.__newsNotifyTimer = setTimeout(notifyParentHeight, 300);
            };

            function buildQuery(offset, limit) {
                var params = 'limit=' + limit + '&offset=' + offset;
                if (currentQ) {
                    params += '&search=' + encodeURIComponent(currentQ);
                    if (currentCat) params += '&category=' + encodeURIComponent(currentCat);
                } else if (currentCat) {
                    params += '&category=' + encodeURIComponent(currentCat);
                }
                return params;
            }

            async function fetchNews(offset, limit) {
                var res = await fetch('/api/news?' + buildQuery(offset, limit), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();
                return Array.isArray(data) ? data : [];
            }

            // ---------------- Đo vị trí trong trang cha (cùng origin) ----------------
            function getParentIframe() {
                try {
                    if (window.parent && window.parent !== window && window.parent.document) {
                        var pd = window.parent.document;
                        var frames = pd.querySelectorAll('iframe');
                        for (var i = 0; i < frames.length; i++) {
                            try {
                                if (frames[i].contentWindow === window) return frames[i];
                            } catch (e2) {}
                        }
                    }
                } catch (e) {}
                return null;
            }

            function parentScrollY() {
                try {
                    if (window.parent && window.parent !== window) {
                        var pd = window.parent.document;
                        return window.parent.pageYOffset || pd.documentElement.scrollTop || 0;
                    }
                } catch (e) {}
                return 0;
            }

            // Đáy block "Tin được xem nhiều nhất" (cột phải) trong tọa độ document cha.
            // Chỉ áp dụng khi block nằm BÊN PHẢI iframe (layout 2 cột máy tính).
            // Trả về null nếu không có (mobile/tablet cột phải nằm dưới, hoặc mở trực tiếp).
            function mostViewedBottomDoc() {
                try {
                    if (window.parent && window.parent !== window && window.parent.document) {
                        var pd = window.parent.document;
                        var block = pd.getElementById('newsBlockMostViewed');
                        var frame = getParentIframe();
                        if (block && block.offsetHeight > 0 && frame) {
                            var bRect = block.getBoundingClientRect();
                            var fRect = frame.getBoundingClientRect();
                            if (bRect.left >= fRect.right - 10) {
                                return bRect.bottom + parentScrollY();
                            }
                        }
                    }
                } catch (e) {}
                return null;
            }

            // Vị trí đỉnh lưới tin trong tọa độ document trang cha
            function gridTopDoc() {
                var iframeTop = 0;
                var frame = getParentIframe();
                if (frame) {
                    var r = frame.getBoundingClientRect();
                    iframeTop = r.top + parentScrollY();
                }
                var ourScrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
                return iframeTop + gridEl.getBoundingClientRect().top + ourScrollY;
            }

            // Chiều cao khung nhìn dành cho lưới tin (từ đỉnh lưới tới cuối màn hình trang cha),
            // để căn số bài "vừa đủ cân bằng" theo mọi kích thước màn hình khi không có cột phải
            // (right-col đang tạm ẩn) để so sánh.
            function viewportAvailHeight() {
                var vh = 0;
                try {
                    if (window.parent && window.parent !== window && window.parent.innerHeight) {
                        vh = window.parent.innerHeight;
                    }
                } catch (e) {}
                if (!vh) vh = window.innerHeight || document.documentElement.clientHeight || 720;
                var top = 0;
                try {
                    var frame = getParentIframe();
                    if (frame) top = frame.getBoundingClientRect().top;
                } catch (e) {}
                if (!top) top = gridEl.getBoundingClientRect().top;
                // Chừa khoảng trống dưới cùng cho nút "Xem thêm" + lề an toàn
                return Math.max(240, vh - top - 90);
            }

            // Vị trí đáy lưới tin trong tọa độ document trang cha
            function gridBottomDoc() {
                return gridTopDoc() + gridEl.offsetHeight;
            }

            // Số cột hiện tại của lưới tin
            function gridCols() {
                try {
                    var grid = gridEl.querySelector('.news-grid-section') || gridEl;
                    var tc = getComputedStyle(grid).gridTemplateColumns;
                    if (tc && tc !== 'none') {
                        var cols = tc.split(' ').filter(Boolean).length;
                        if (cols > 0) return cols;
                    }
                } catch (e) {}
                return 1;
            }

            // ---------------- Bản tin tổng hợp (tab "Tất cả") ----------------
            function digestCellHtml(n, size) {
                var img = n.image_url
                    ? '<img class="news-cell-img" src="' + esc(n.image_url) + '" alt="" loading="lazy" onload="window.__newsNotify && window.__newsNotify()">'
                    : '';
                var cat = categoryLabel(n.category);
                var catIc = categoryIcon(n.category);
                var time = formatTime(newsStamp(n));
                var url = n.slug ? '/' + n.slug + '-' + n.id + '.html' : '/tintuc?id=' + n.id;
                return '<div class="news-cell ' + size + '" data-id="' + esc(n.id) + '" data-slug="' + esc(n.slug || '') + '">' +
                    img +
                    '<div class="news-cell-shade"></div>' +
                    '<span class="news-cell-cat"><i class="fas ' + catIc + '"></i>' + esc(cat) + '</span>' +
                    '<div class="news-cell-body">' +
                        '<a class="news-cell-title" href="' + url + '">' + esc(n.title) + '</a>' +
                        (time ? '<div class="news-cell-meta"><i class="far fa-clock"></i>' + esc(time) + '</div>' : '') +
                    '</div>' +
                '</div>';
            }

            // Dòng list (dùng trong khối danh sách 2 cột)
            function digestRowHtml(n) {
                var img = n.image_url
                    ? '<img src="' + esc(n.image_url) + '" alt="" loading="lazy" onload="window.__newsNotify && window.__newsNotify()">'
                    : '<i class="fas fa-newspaper"></i>';
                var cat = categoryLabel(n.category);
                var time = formatTime(newsStamp(n));
                var url = n.slug ? '/' + n.slug + '-' + n.id + '.html' : '/tintuc?id=' + n.id;
                return '<div class="news-row" data-id="' + esc(n.id) + '" data-slug="' + esc(n.slug || '') + '">' +
                    '<div class="nr-img">' + img + '</div>' +
                    '<div class="nr-body">' +
                        '<a class="nr-title" href="' + url + '">' + esc(n.title) + '</a>' +
                        '<div class="nr-meta">' +
                            '<span class="nr-cat">' + esc(cat) + '</span>' +
                            (time ? '<span><i class="far fa-clock"></i>' + esc(time) + '</span>' : '') +
                        '</div>' +
                    '</div>' +
                '</div>';
            }

            // Mỗi menu lấy tối đa 5 bài mới nhất → bản tin tổng hợp 4 khối
            async function loadDigest() {
                gridEl.className = 'news-grid-digest';
                gridEl.innerHTML = '<div class="news-loading"><i class="fas fa-spinner fa-spin"></i> Đang tải tin tức...</div>';
                showLoadMore(false);
                try {
                    var lists = await Promise.all(DIGEST_MENUS.map(function (slug) {
                        return fetch('/api/news?category=' + encodeURIComponent(slug) + '&limit=5', { cache: 'no-store' })
                            .then(function (r) { return r.ok ? r.json() : []; })
                            .then(function (arr) { return Array.isArray(arr) ? arr : []; })
                            .catch(function () { return []; });
                    }));
                    // Trộn đều giữa các menu: mỗi vòng lấy bài mới nhất của từng menu
                    var items = [];
                    var maxPerMenu = 0;
                    lists.forEach(function (arr) { if (arr.length > maxPerMenu) maxPerMenu = arr.length; });
                    for (var r = 0; r < maxPerMenu; r++) {
                        lists.forEach(function (arr) {
                            if (arr[r]) items.push(arr[r]);
                        });
                    }
                    if (!items.length) {
                        gridEl.innerHTML = '<div class="news-empty"><i class="fas fa-inbox"></i><p>Chưa có bài viết trong chuyên mục này.</p></div>';
                        hasMore = false;
                        nextOffset = 0;
                        showLoadMore(false);
                        notifyParentHeight();
                        return;
                    }

                    // Layout: 4 bài + cơ hội nổi bật → 8 bài dạng thẻ → 22 bài danh sách
                    var featured = items.slice(0, 4);
                    var halfItems = items.slice(4, 12);
                    var mediumItems = items.slice(12, 34);

                    var html = '';
                    if (featured.length) {
                        html += '<div class="digest-featured">' + featured.map(function (n, i) {
                            return digestCellHtml(n, i === 0 ? 'big' : 'small');
                        }).join('') + '<div class="news-cell small" id="digestOpportunitySlot">' +
                            '<div class="digest-opportunity-loading">Đang tải cơ hội...</div></div></div>';
                    }
                    if (halfItems.length) {
                        html += '<div class="digest-half">' + halfItems.map(function (n) {
                            return digestCellHtml(n, 'half');
                        }).join('') + '</div>';
                    }
                    html += '<div class="digest-medium-layout">' +
                        '<div class="digest-medium">' + mediumItems.map(digestRowHtml).join('') + '</div>' +
                        '<div class="digest-market-sidebar">' +
                        '<section class="market-highlight"><div class="market-highlight-head"><div class="market-highlight-title">Bản đồ thị trường</div>' +
                        '<button type="button" class="market-highlight-link" data-market-page="/thi-truong?focus=market-map">Xem chi tiết <i class="fas fa-arrow-right"></i></button></div>' +
                        '<div class="mh-map" id="digestMarketMap"></div></section>' +
                        '<section class="market-highlight"><div class="market-highlight-head"><div class="market-highlight-title">VinaFintech Market Radar</div>' +
                        '<button type="button" class="market-highlight-link" data-market-page="/thi-truong?focus=market-radar">Xem chi tiết <i class="fas fa-arrow-right"></i></button></div>' +
                        '<div class="mh-radar" id="digestMarketRadar"></div></section>' +
                        '<section class="market-highlight"><div class="market-highlight-head"><div class="market-highlight-title">Lãi suất ngân hàng</div>' +
                        '<button type="button" class="market-highlight-link" data-market-page="/lai-ngan-hang">Xem chi tiết <i class="fas fa-arrow-right"></i></button></div>' +
                        '<div id="digestBankRates"></div></section>' +
                        '<section class="market-highlight"><div class="market-highlight-head"><div class="market-highlight-title">Giá vàng</div>' +
                        '<button type="button" class="market-highlight-link" data-market-page="/gia-vang-bac">Xem chi tiết <i class="fas fa-arrow-right"></i></button></div>' +
                        '<div id="digestWorldGold"></div></section>' +
                        '<section class="market-highlight"><div class="market-highlight-head"><div class="market-highlight-title">Crypto</div>' +
                        '<button type="button" class="market-highlight-link" data-market-page="/crypto">Xem chi tiết <i class="fas fa-arrow-right"></i></button></div>' +
                        '<div id="digestCryptoPrices"></div></section>' +
                        '</div>';

                    gridEl.innerHTML = html;
                    mountMarketOpportunityInDigest();
                    gridEl.querySelectorAll('[data-market-page]').forEach(function (link) {
                        if (marketOpportunitiesEl.contains(link)) return;
                        link.addEventListener('click', function () {
                            openMarketPage(link.getAttribute('data-market-page'));
                        });
                    });
                    loadDigestMarketWidgets();
                    gridEl.querySelectorAll('.news-cell:not(.news-cell-opportunity), .news-row').forEach(function (el) {
                        el.addEventListener('click', function (e) {
                            var id = el.getAttribute('data-id');
                            var slug = el.getAttribute('data-slug');
                            if (!id) return;
                            if (e && e.preventDefault) e.preventDefault();
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'tunix-open-tintuc', id: Number(id), slug: slug }, '*');
                            }
                        });
                    });
                    hasMore = false;
                    nextOffset = items.length;
                    showLoadMore(false);
                    notifyParentHeight();
                } catch (e) {
                    gridEl.innerHTML = '<div class="news-empty"><i class="fas fa-exclamation-triangle"></i><p>Không thể tải tin tức. Vui lòng thử lại.</p></div>';
                    hasMore = false;
                    showLoadMore(false);
                    notifyParentHeight();
                }
            }

            // Nạp lại từ đầu (chuyển chuyên mục / xóa tìm kiếm / lần mở đầu)
            async function loadNews() {
                resetMarketOpportunityPlacement();
                refreshMarketHighlight();
                nextOffset = 0;
                hasMore = true;
                isLoadingMore = false;
                if (alignTimer) { clearTimeout(alignTimer); alignTimer = null; }
                gridEl.innerHTML = '<div class="news-loading"><i class="fas fa-spinner fa-spin"></i> Đang tải tin tức...</div>';
                showLoadMore(false);
                try {
                    if (!currentCat && !currentQ) {
                        // Tab "Tất cả": bản tin tổng hợp — mỗi menu 1-2 bài mới nhất, so le to/nhỏ
                        await loadDigest();
                    } else {
                        // Chuyên mục / tìm kiếm: lưới tin có phân trang (Xem thêm)
                        gridEl.className = 'news-grid';
                        await loadInitial();
                    }
                } catch (e) {
                    gridEl.innerHTML = '<div class="news-empty"><i class="fas fa-exclamation-triangle"></i><p>Không thể tải tin tức. Vui lòng thử lại.</p></div>';
                    hasMore = false;
                    showLoadMore(false);
                    notifyParentHeight();
                }
            }

            // Trang đầu: căn số bài theo màn hình và cột tin xem nhiều nhất nếu có.
            async function loadInitial() {
                var target = mostViewedBottomDoc();

                // Đo chiều cao 1 thẻ bằng cách render 1 bài tạm
                var probe = await fetchNews(0, 1);
                if (!probe.length) { renderEmpty(); return; }
                gridEl.innerHTML = probe.map(cardHtml).join('');
                var probeCard = gridEl.querySelector('.news-card');
                var cardH = probeCard ? probeCard.offsetHeight : 0;
                var cols = gridCols();

                var viewportH = viewportAvailHeight();
                var sidebarH = target == null ? 0 : target - gridTopDoc();
                var availH = Math.max(viewportH, sidebarH);
                var rows = Math.max(1, Math.ceil((availH + GRID_GAP) / (cardH + GRID_GAP)));
                var count = Math.max(cols, rows * cols);
                count = Math.max(1, Math.min(count, MAX_INIT));
                if (currentCat === 'ngan-hang' && !currentQ) count = Math.max(count, 6);
                if (currentCat === 'chung-khoan' && !currentQ) count = Math.max(count, 6);
                if (currentCat === 'tai-chinh-quoc-te' && !currentQ) count = Math.max(count, 3);

                var data = await fetchNews(0, count);
                if (!data.length) { renderEmpty(); return; }
                var visibleCount = renderInitialNews(data);

                nextOffset = data.length;
                hasMore = data.length >= count;
                showLoadMore(hasMore);
                notifyParentHeight();

                // Số bài mỗi lần "Xem thêm" = đúng số bài đang hiển thị (1 màn hình cân bằng)
                // → sau mỗi lần bấm layout vẫn giữ nguyên độ cân bằng như ban đầu.
                balancedPage = Math.max(1, visibleCount);

                scheduleRealign();
            }

            function setLoadMoreLoading(loading) {
                var btn = document.getElementById('loadMoreBtn');
                var text = document.getElementById('loadMoreText');
                if (btn) btn.disabled = loading;
                if (text) {
                    text.innerHTML = loading
                        ? '<i class="fas fa-spinner fa-spin"></i> Đang tải...'
                        : 'Xem thêm bài viết';
                }
            }

            // Nút "Xem thêm": tải thêm đúng 1 màn hình cân bằng (balancedPage) — giống số bài lần nạp đầu
            async function loadMore() {
                if (isLoadingMore || !hasMore) return;
                isLoadingMore = true;
                setLoadMoreLoading(true);
                try {
                    var data = await fetchNews(nextOffset, balancedPage);
                    if (!data.length) {
                        hasMore = false;
                    } else {
                        appendNews(data, balancedPage);
                    }
                } catch (e) {
                    // Lỗi mạng: giữ nút để người dùng bấm lại
                } finally {
                    isLoadingMore = false;
                    setLoadMoreLoading(false);
                    showLoadMore(hasMore);
                    notifyParentHeight();
                    scheduleScrollLoad();
                }
            }

            var scrollLoadFrame = null;
            function scheduleScrollLoad() {
                if (scrollLoadFrame != null) return;
                scrollLoadFrame = requestAnimationFrame(function () {
                    scrollLoadFrame = null;
                    if (isLoadingMore || !hasMore || !loadMoreEl || loadMoreEl.style.display === 'none') return;

                    var button = document.getElementById('loadMoreBtn');
                    if (!button) return;
                    var frame = getParentIframe();
                    var buttonBottom;
                    var viewportBottom;
                    if (frame && window.parent && window.parent !== window) {
                        buttonBottom = frame.getBoundingClientRect().top + parentScrollY() +
                            button.getBoundingClientRect().bottom +
                            (window.pageYOffset || document.documentElement.scrollTop || 0);
                        viewportBottom = parentScrollY() + window.parent.innerHeight;
                    } else {
                        var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
                        buttonBottom = button.getBoundingClientRect().bottom + scrollY;
                        viewportBottom = scrollY + (window.innerHeight || document.documentElement.clientHeight || 0);
                    }
                    if (buttonBottom - viewportBottom <= 600) loadMore();
                });
            }

            // Block cột phải tải muộn hơn (8 bài xem nhiều) → chờ rồi căn lại số bài cho khớp
            function scheduleRealign() {
                if (alignTimer) clearTimeout(alignTimer);
                alignTimer = setTimeout(realignToTarget, 1200);
            }

            function realignToTarget() {
                alignTimer = null;
                if (isLoadingMore) { scheduleRealign(); return; }
                var target = mostViewedBottomDoc();
                var probeCard = gridEl.querySelector('.news-card');
                if (!probeCard) return;
                var cardH = probeCard.offsetHeight;
                var cols = gridCols();
                var viewportH = viewportAvailHeight();
                var sidebarH = target == null ? 0 : target - gridTopDoc();
                var availH = Math.max(viewportH, sidebarH);
                var rows = Math.max(1, Math.ceil((availH + GRID_GAP) / (cardH + GRID_GAP)));
                var want = Math.max(cols, rows * cols);
                var current = gridEl.querySelectorAll('.news-card').length;
                if (want <= current || !hasMore) return;
                var add = Math.min(want - current, balancedPage);
                isLoadingMore = true;
                showLoadMore(true);
                fetchNews(nextOffset, add).then(function (data) {
                    isLoadingMore = false;
                    showLoadMore(false);
                    if (data.length) {
                        appendNews(data, add);
                        notifyParentHeight();
                        if (hasMore) scheduleRealign();
                    }
                }).catch(function () {
                    isLoadingMore = false;
                    showLoadMore(false);
                });
            }

            window.addEventListener('resize', scheduleRealign);
            window.addEventListener('scroll', scheduleScrollLoad, { passive: true });
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.addEventListener('scroll', scheduleScrollLoad, { passive: true });
                    window.parent.addEventListener('resize', scheduleScrollLoad);
                }
            } catch (e) {}

            // Nút "Xem thêm" — người dùng chủ động bấm để tải thêm, không tự động tải khi cuộn.

            // ---------------- Khởi tạo ----------------
            var params = new URLSearchParams(window.location.search);
            var initialCat = params.get('cat') || '';
            var valid = false;
            CATEGORIES.forEach(function (c) { if (c.slug === initialCat) valid = true; });
            currentCat = valid ? initialCat : '';
            currentQ = params.get('q') || '';

            setSearchInfo();
            notifyParentCat();
            loadNews();

            window.addEventListener('load', function () {
                setTimeout(notifyParentHeight, 400);
            });
            setTimeout(notifyParentHeight, 500);
        })();
    </script>
