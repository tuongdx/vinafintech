<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="/frontend/Logo/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/frontend/Logo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/frontend/Logo/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/frontend/Logo/apple-touch-icon.png" />
    <title>TuniX · Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
            color: #1a1f36;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background: #0d1117;
            color: #e6edf3;
        }

        /* Card chính */
        .auth-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px 36px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .auth-card {
            background: #161b22;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        /* Logo */
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
            text-decoration: none;
        }

        .auth-logo .tuni {
            color: #008080;
        }
        .auth-logo .x {
            color: #8A95A5;
        }

        body.dark-mode .auth-logo .x {
            color: #6b7a8f;
        }

        /* Theme toggle */
        .theme-toggle-mini {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 18px;
            color: #4a5a72;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            outline: none;
        }

        .theme-toggle-mini:hover {
            color: #008080;
        }

        body.dark-mode .theme-toggle-mini {
            color: #8b949e;
        }
        body.dark-mode .theme-toggle-mini:hover {
            color: #008080;
        }

        /* Tiêu đề trang */
        .auth-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1f36;
            transition: color 0.3s ease;
        }

        body.dark-mode .auth-title h1 {
            color: #e6edf3;
        }

        .auth-title p {
            font-size: 14px;
            color: #6b7a8f;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        body.dark-mode .auth-title p {
            color: #8b949e;
        }

        /* Input group */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #4a5a72;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
            transition: color 0.3s ease;
        }

        body.dark-mode .input-group label {
            color: #8b949e;
        }

        .input-icon-wrapper {
            display: flex;
            align-items: center;
            background: #f8faff;
            border: 1px solid #e5e9f0;
            border-radius: 14px;
            padding: 0 14px;
            transition: all 0.25s ease;
        }

        body.dark-mode .input-icon-wrapper {
            background: #0d1117;
            border-color: #30363d;
        }

        .input-icon-wrapper:focus-within {
            border-color: #008080;
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.08);
        }

        body.dark-mode .input-icon-wrapper:focus-within {
            border-color: #008080;
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.12);
        }

        .input-icon-wrapper i {
            color: #8a99b1;
            font-size: 15px;
            width: 20px;
            transition: color 0.3s ease;
        }

        body.dark-mode .input-icon-wrapper i {
            color: #6b7a8f;
        }

        .input-icon-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 14px 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #1a1f36;
            outline: none;
        }

        body.dark-mode .input-icon-wrapper input {
            color: #e6edf3;
        }

        .input-icon-wrapper input::placeholder {
            color: #b0b8c4;
            font-weight: 400;
        }

        body.dark-mode .input-icon-wrapper input::placeholder {
            color: #6b7a8f;
        }

        /* Password toggle */
        .password-toggle {
            cursor: pointer;
            color: #8a99b1;
            transition: color 0.2s;
            font-size: 15px;
        }

        .password-toggle:hover {
            color: #008080;
        }

        body.dark-mode .password-toggle:hover {
            color: #008080;
        }

        /* Nút chính */
        .btn-primary {
            width: 100%;
            border: none;
            background: #008080;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            padding: 14px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.25s ease, box-shadow 0.2s;
            margin-top: 8px;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: #0e4ad0;
            box-shadow: 0 6px 18px rgba(26, 92, 255, 0.2);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        body.dark-mode .btn-primary {
            background: #238636;
        }
        body.dark-mode .btn-primary:hover {
            background: #2ea043;
            box-shadow: 0 6px 18px rgba(35, 134, 54, 0.25);
        }

        .btn-primary .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Tùy chọn phụ */
        .auth-extra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 18px;
            color: #6b7a8f;
            flex-wrap: wrap;
            gap: 8px;
        }

        body.dark-mode .auth-extra {
            color: #8b949e;
        }

        .auth-extra a {
            color: #008080;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        body.dark-mode .auth-extra a {
            color: #008080;
        }

        .auth-extra a:hover {
            text-decoration: underline;
        }

        .auth-extra .forgot-link {
            font-weight: 400;
            color: #6b7a8f;
        }

        body.dark-mode .auth-extra .forgot-link {
            color: #8b949e;
        }

        .auth-extra .forgot-link:hover {
            color: #008080;
            text-decoration: underline;
        }

        body.dark-mode .auth-extra .forgot-link:hover {
            color: #008080;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0 16px;
            color: #b0b8c4;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e9f0;
        }

        body.dark-mode .divider::before,
        body.dark-mode .divider::after {
            background: #30363d;
        }

        body.dark-mode .divider {
            color: #6b7a8f;
        }

        /* Social buttons */
        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-buttons button {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #f8faff;
            border: 1px solid #e5e9f0;
            border-radius: 30px;
            padding: 10px 0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #1a1f36;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        body.dark-mode .social-buttons button {
            background: #0d1117;
            border-color: #30363d;
            color: #e6edf3;
        }

        .social-buttons button i {
            font-size: 16px;
        }

        .social-buttons button:hover {
            background: #eef2ff;
            border-color: #b0b8c4;
        }

        body.dark-mode .social-buttons button:hover {
            background: #21262d;
            border-color: #008080;
        }

        /* Chuyển đổi form */
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7a8f;
            transition: color 0.3s ease;
        }

        body.dark-mode .auth-switch {
            color: #8b949e;
        }

        .auth-switch a {
            color: #008080;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        body.dark-mode .auth-switch a {
            color: #008080;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        /* Success/Error message */
        .message-box {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
        }

        .message-box.show {
            display: flex;
        }

        .message-box.success {
            background: #e8f8ef;
            border: 1px solid #2ecc71;
            color: #1a7a3a;
        }

        .message-box.error {
            background: #fde8e5;
            border: 1px solid #e74c3c;
            color: #a93226;
        }

        .message-box.info {
            background: #e8ecf5;
            border: 1px solid #008080;
            color: #1a3a7a;
        }

        body.dark-mode .message-box.success {
            background: #1b2d1f;
            border-color: #3fb950;
            color: #3fb950;
        }

        body.dark-mode .message-box.error {
            background: #2d1b1e;
            border-color: #f85149;
            color: #f85149;
        }

        body.dark-mode .message-box.info {
            background: #1c2333;
            border-color: #008080;
            color: #008080;
        }

        .message-box i {
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .auth-card {
                padding: 32px 20px 28px;
            }
            .social-buttons {
                flex-direction: column;
            }
            .auth-extra {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/typography.css" />
</head>
<body>
    <div class="auth-card">
        <!-- Theme toggle -->
        <button class="theme-toggle-mini" id="themeToggleMini" aria-label="Chuyển đổi giao diện">
            <i class="fas fa-moon"></i>
        </button>

        <!-- Logo -->
        <a href="/" class="auth-logo">
            <span class="tuni">Tuni</span><span class="x">X</span>
        </a>

        <!-- Title -->
        <div class="auth-title">
            <h1>Đăng nhập</h1>
            <p>Chào mừng bạn quay trở lại TuniX</p>
        </div>

        <!-- Message Box -->
        <div class="message-box" id="messageBox">
            <i class="fas fa-info-circle"></i>
            <span id="messageText">Thông báo</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" autocomplete="off">
            <div class="input-group">
                <label for="loginEmail">Email</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="example@tunix.vn" required />
                </div>
            </div>
            <div class="input-group">
                <label for="loginPassword">Mật khẩu</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                    <span class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Đăng nhập</span>
            </button>
            <div class="auth-extra">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
                    <input type="checkbox" checked /> Ghi nhớ
                </label>
                <a href="/forgot-password" class="forgot-link">Quên mật khẩu?</a>
            </div>
        </form>

        <div class="divider">hoặc</div>
        <div class="social-buttons">
            <button type="button"><i class="fab fa-google"></i> Google</button>
        </div>

        <div class="auth-switch">
            Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
        </div>
    </div>

    <script>
        (function() {
            // ---- Theme toggle ----
            const themeBtn = document.getElementById('themeToggleMini');
            const icon = themeBtn.querySelector('i');
            let isDark = localStorage.getItem('theme') === 'dark';

            if (isDark) {
                document.body.classList.add('dark-mode');
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }

            themeBtn.addEventListener('click', function() {
                isDark = !isDark;
                if (isDark) {
                    document.body.classList.add('dark-mode');
                    icon.className = 'fas fa-sun';
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    icon.className = 'fas fa-moon';
                    localStorage.setItem('theme', 'light');
                }
            });

            // ---- Password toggle ----
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('loginPassword');

            togglePassword.addEventListener('click', function() {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            });

            // ---- Message box ----
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');

            function showMessage(text, type = 'info') {
                messageBox.className = 'message-box show ' + type;
                messageText.textContent = text;
                // Auto hide after 5 seconds
                clearTimeout(messageBox._hideTimer);
                messageBox._hideTimer = setTimeout(() => {
                    messageBox.classList.remove('show');
                }, 5000);
            }

            // ---- Lấy trang cần quay lại sau khi đăng nhập ----
            function parseNextUrl() {
                const p = new URLSearchParams(window.location.search);
                if (p.get('next')) return p.get('next');
                const saved = localStorage.getItem('tunix_next');
                localStorage.removeItem('tunix_next');
                return saved || '/';
            }

            // ---- Xử lý redirect từ Google OAuth ----
            (function handleOAuthRedirect() {
                const params = new URLSearchParams(window.location.search);
                if (params.get('oauth') === 'success') {
                    const at = params.get('access_token');
                    const rt = params.get('refresh_token');
                    if (at) {
                        localStorage.setItem('tunix_access_token', at);
                        if (rt) localStorage.setItem('tunix_refresh_token', rt);
                        const next = params.get('next') || '/';
                        fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + at } })
                            .then(r => (r.ok ? r.json() : null))
                            .then(u => { if (u) localStorage.setItem('tunix_user', JSON.stringify(u)); })
                            .catch(() => {});
                        window.location.href = next;
                    }
                    return;
                }
                if (params.get('oauth_error')) {
                    const map = {
                        not_configured: 'Đăng nhập mạng xã hội chưa được cấu hình. Vui lòng thử lại sau.',
                        access_denied: 'Bạn đã huỷ đăng nhập mạng xã hội.',
                        email_required: 'Nhà cung cấp không trả về email. Vui lòng đăng ký bằng email hoặc thử cách khác.',
                        oauth_failed: 'Đăng nhập mạng xã hội thất bại. Vui lòng thử lại.'
                    };
                    showMessage('❌ ' + (map[params.get('oauth_error')] || 'Đăng nhập mạng xã hội thất bại.'), 'error');
                    history.replaceState(null, '', window.location.pathname);
                }
            })();

            // ---- Login form ----
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                const remember = document.querySelector('#loginForm input[type=checkbox]').checked;

                if (!email || !password) {
                    showMessage('Vui lòng nhập đầy đủ email và mật khẩu.', 'error');
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showMessage('Vui lòng nhập địa chỉ email hợp lệ.', 'error');
                    return;
                }

                // Show loading
                loginBtn.classList.add('loading');
                loginBtn.disabled = true;

                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, remember })
                })
                    .then(res => res.json().then(data => ({ ok: res.ok, status: res.status, data })))
                    .then(function({ ok, data }) {
                        if (!ok) throw new Error(data.detail || 'Đăng nhập thất bại. Vui lòng thử lại.');
                        localStorage.setItem('tunix_access_token', data.access_token);
                        localStorage.setItem('tunix_refresh_token', data.refresh_token);
                        localStorage.setItem('tunix_user', JSON.stringify(data.user));
                        showMessage('✅ Đăng nhập thành công! Chào mừng bạn quay lại TuniX.', 'success');
                        const next = parseNextUrl();
                        setTimeout(() => { window.location.href = next; }, 600);
                    })
                    .catch(function(err) {
                        loginBtn.classList.remove('loading');
                        loginBtn.disabled = false;
                        showMessage('❌ ' + (err.message || 'Đăng nhập thất bại. Vui lòng thử lại.'), 'error');
                    });
            });

            // ---- Social buttons: chuyển hướng tới OAuth backend ----
            document.querySelectorAll('.social-buttons button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const next = new URLSearchParams(window.location.search).get('next') || localStorage.getItem('tunix_next') || '/';
                    window.location.href = '/api/auth/oauth/google/authorize?next=' + encodeURIComponent(next);
                });
            });

            // ---- Enter key on email input ----
            document.getElementById('loginEmail').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginPassword').focus();
                }
            });

            document.getElementById('loginPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

            // Auto focus email
            document.addEventListener('DOMContentLoaded', function() {
                document.getElementById('loginEmail').focus();
            });
        })();
    </script>
</body>
</html>
