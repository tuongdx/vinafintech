<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="/frontend/Logo/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/frontend/Logo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/frontend/Logo/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/frontend/Logo/apple-touch-icon.png" />
    <title>TuniX · Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
            color: #1a1f36;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode { background: #0d1117; color: #e6edf3; }

        .auth-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px 36px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .auth-card { background: #161b22; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45); }

        .auth-logo {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
            margin-bottom: 28px; text-decoration: none;
        }
        .auth-logo .tuni { color: #008080; }
        .auth-logo .x { color: #8A95A5; }
        body.dark-mode .auth-logo .x { color: #6b7a8f; }

        .theme-toggle-mini {
            position: absolute; top: 20px; right: 24px;
            font-size: 18px; color: #4a5a72; cursor: pointer; transition: color 0.2s;
            background: none; border: none; outline: none;
        }
        .theme-toggle-mini:hover { color: #008080; }
        body.dark-mode .theme-toggle-mini { color: #8b949e; }
        body.dark-mode .theme-toggle-mini:hover { color: #008080; }

        .auth-title { text-align: center; margin-bottom: 28px; }
        .auth-title .icon-circle {
            width: 64px; height: 64px; border-radius: 50%;
            background: #e8ecf5; color: #008080;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 0 auto 16px; transition: all 0.3s ease;
        }
        body.dark-mode .auth-title .icon-circle { background: #21262d; color: #008080; }
        .auth-title h1 { font-size: 24px; font-weight: 700; color: #1a1f36; transition: color 0.3s ease; }
        body.dark-mode .auth-title h1 { color: #e6edf3; }
        .auth-title p { font-size: 14px; color: #6b7a8f; margin-top: 4px; line-height: 1.6; transition: color 0.3s ease; }
        body.dark-mode .auth-title p { color: #8b949e; }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-size: 12px; font-weight: 500;
            color: #4a5a72; margin-bottom: 5px; letter-spacing: 0.2px; transition: color 0.3s ease;
        }
        body.dark-mode .input-group label { color: #8b949e; }

        .input-icon-wrapper {
            display: flex; align-items: center;
            background: #f8faff; border: 1px solid #e5e9f0; border-radius: 14px;
            padding: 0 14px; transition: all 0.25s ease;
        }
        body.dark-mode .input-icon-wrapper { background: #0d1117; border-color: #30363d; }
        .input-icon-wrapper:focus-within { border-color: #008080; box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.08); }
        body.dark-mode .input-icon-wrapper:focus-within { border-color: #008080; box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.12); }
        .input-icon-wrapper i { color: #8a99b1; font-size: 15px; width: 20px; transition: color 0.3s ease; }
        body.dark-mode .input-icon-wrapper i { color: #6b7a8f; }
        .input-icon-wrapper input {
            width: 100%; border: none; background: transparent;
            padding: 14px 10px; font-size: 14px; font-family: 'Inter', sans-serif;
            color: #1a1f36; outline: none;
        }
        body.dark-mode .input-icon-wrapper input { color: #e6edf3; }
        .input-icon-wrapper input::placeholder { color: #b0b8c4; font-weight: 400; }
        body.dark-mode .input-icon-wrapper input::placeholder { color: #6b7a8f; }

        .password-toggle { cursor: pointer; color: #8a99b1; transition: color 0.2s; font-size: 15px; }
        .password-toggle:hover { color: #008080; }
        body.dark-mode .password-toggle:hover { color: #008080; }

        .btn-primary {
            width: 100%; border: none; background: #008080; color: #fff;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px;
            padding: 14px 0; border-radius: 40px; cursor: pointer;
            transition: background 0.25s ease, box-shadow 0.2s;
            margin-top: 8px; letter-spacing: 0.2px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary:hover { background: #0e4ad0; box-shadow: 0 6px 18px rgba(26, 92, 255, 0.2); }
        .btn-primary:active { transform: scale(0.97); }
        body.dark-mode .btn-primary { background: #238636; }
        body.dark-mode .btn-primary:hover { background: #2ea043; box-shadow: 0 6px 18px rgba(35, 134, 54, 0.25); }
        .btn-primary .spinner {
            display: none; width: 20px; height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .btn-primary.loading .spinner { display: inline-block; }
        .btn-primary.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7a8f; transition: color 0.3s ease; }
        body.dark-mode .auth-switch { color: #8b949e; }
        .auth-switch a { color: #008080; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        body.dark-mode .auth-switch a { color: #008080; }
        .auth-switch a:hover { text-decoration: underline; }

        .message-box {
            display: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px;
            font-size: 13px; align-items: center; gap: 10px;
        }
        .message-box.show { display: flex; }
        .message-box.success { background: #e8f8ef; border: 1px solid #2ecc71; color: #1a7a3a; }
        .message-box.error { background: #fde8e5; border: 1px solid #e74c3c; color: #a93226; }
        .message-box.info { background: #e8ecf5; border: 1px solid #008080; color: #1a3a7a; }
        body.dark-mode .message-box.success { background: #1b2d1f; border-color: #3fb950; color: #3fb950; }
        body.dark-mode .message-box.error { background: #2d1b1e; border-color: #f85149; color: #f85149; }
        body.dark-mode .message-box.info { background: #1c2333; border-color: #008080; color: #008080; }
        .message-box i { font-size: 18px; }

        @media (max-width: 500px) { .auth-card { padding: 32px 20px 28px; } }
    </style>
</head>
<body>
    <div class="auth-card">
        <button class="theme-toggle-mini" id="themeToggleMini" aria-label="Chuyển đổi giao diện">
            <i class="fas fa-moon"></i>
        </button>

        <a href="/" class="auth-logo">
            <span class="tuni">Tuni</span><span class="x">X</span>
        </a>

        <div class="auth-title">
            <div class="icon-circle"><i class="fas fa-key"></i></div>
            <h1>Đặt lại mật khẩu</h1>
            <p>Nhập mật khẩu mới cho tài khoản TuniX của bạn</p>
        </div>

        <div class="message-box" id="messageBox">
            <i class="fas fa-info-circle"></i>
            <span id="messageText">Thông báo</span>
        </div>

        <form id="resetForm" autocomplete="off">
            <div class="input-group">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="Tối thiểu 6 ký tự" required minlength="6" />
                    <span class="password-toggle" id="togglePassword1"><i class="fas fa-eye"></i></span>
                </div>
            </div>
            <div class="input-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" required />
                    <span class="password-toggle" id="togglePassword2"><i class="fas fa-eye"></i></span>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-check"></i> Cập nhật mật khẩu</span>
            </button>
        </form>

        <div class="auth-switch">
            <a href="/Login"><i class="fas fa-arrow-left"></i> Quay lại đăng nhập</a>
        </div>
    </div>

    <script>
        (function() {
            const themeBtn = document.getElementById('themeToggleMini');
            const icon = themeBtn.querySelector('i');
            let isDark = localStorage.getItem('theme') === 'dark';
            if (isDark) { document.body.classList.add('dark-mode'); icon.className = 'fas fa-sun'; }
            else { icon.className = 'fas fa-moon'; }
            themeBtn.addEventListener('click', function() {
                isDark = !isDark;
                document.body.classList.toggle('dark-mode', isDark);
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            function showMessage(text, type) {
                messageBox.className = 'message-box show ' + (type || 'info');
                messageText.textContent = text;
                clearTimeout(messageBox._hideTimer);
                messageBox._hideTimer = setTimeout(() => messageBox.classList.remove('show'), 6000);
            }

            function bindToggle(btnId, inputId) {
                const btn = document.getElementById(btnId);
                const input = document.getElementById(inputId);
                btn.addEventListener('click', function() {
                    const t = input.type === 'password' ? 'text' : 'password';
                    input.type = t;
                    this.querySelector('i').className = t === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
                });
            }
            bindToggle('togglePassword1', 'newPassword');
            bindToggle('togglePassword2', 'confirmPassword');

            const token = new URLSearchParams(window.location.search).get('token');
            const resetForm = document.getElementById('resetForm');
            const submitBtn = document.getElementById('submitBtn');

            if (!token) {
                showMessage('❌ Link đặt lại mật khẩu không hợp lệ hoặc thiếu token.', 'error');
                submitBtn.disabled = true;
            }

            resetForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('newPassword').value;
                const confirm = document.getElementById('confirmPassword').value;

                if (password.length < 6) {
                    showMessage('❌ Mật khẩu phải có ít nhất 6 ký tự.', 'error');
                    return;
                }
                if (password !== confirm) {
                    showMessage('❌ Mật khẩu xác nhận không khớp.', 'error');
                    return;
                }

                submitBtn.classList.add('loading');
                submitBtn.disabled = true;

                fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                })
                    .then(res => res.json().then(data => ({ ok: res.ok, data })))
                    .then(function({ ok, data }) {
                        submitBtn.classList.remove('loading');
                        if (!ok) {
                            submitBtn.disabled = false;
                            showMessage('❌ ' + (data.detail || 'Đã có lỗi xảy ra. Vui lòng thử lại.'), 'error');
                            return;
                        }
                        showMessage('✅ ' + (data.message || 'Mật khẩu đã được cập nhật.'), 'success');
                        setTimeout(() => { window.location.href = '/Login'; }, 2000);
                    })
                    .catch(function() {
                        submitBtn.classList.remove('loading');
                        submitBtn.disabled = false;
                        showMessage('❌ Đã có lỗi xảy ra. Vui lòng thử lại.', 'error');
                    });
            });
        })();
    </script>
</body>
</html>
