    <style>

        .cp-ai textarea:focus { outline: none; border-color: #008080; }

<body>
    <div class="cp-page">

        <!-- Screener -->
        <div class="cp-screener" id="cpScreener"></div>

        <!-- Notable -->
        <div class="cp-notable" id="cpNotable"></div>
    </div>

    <script>
        (function() {
            const screenerEl = document.getElementById('cpScreener');
            const notableEl = document.getElementById('cpNotable');
            let all = [];
            let filtered = [];
            let sortKey = 'score';
            let sortDir = -1;
            let page = 0;
            const PAGE_SIZE = 16;
            let activeTab = 'score';
            const sparkCache = {};
            const SCORE_TIP = 'Tuni Score là điểm đánh giá tổng hợp từ 0–100, được TuniX tính toán dựa trên nhiều yếu tố như sức khỏe tài chính, tăng trưởng, định giá, xu hướng giá và mức độ rủi ro của doanh nghiệp. Điểm số càng cao cho thấy cổ phiếu càng có nhiều yếu tố tích cực theo hệ thống đánh giá của TuniX.';
            let tipEl = null;
            function ensureTip() {
                if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'cp-tip-pop'; document.body.appendChild(tipEl); }
                return tipEl;
            }
            function showTip(tip) {
                const t = ensureTip();
                t.textContent = tip.getAttribute('data-tip') || '';
                t.style.display = 'block';
                const r = tip.getBoundingClientRect();
                t.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 330)) + 'px';
                t.style.top = (r.bottom + 8) + 'px';
            }
            function hideTip() { if (tipEl) tipEl.style.display = 'none'; }
            let currentPath = parseIndPath();
            let currentStock = parseStockParam();
            // View do SHELL chỉ định qua postMessage 'tunix-co-phieu-goto'. Iframe này được dùng CHUNG cho
            // mọi view (screener / ngành / chi tiết mã), nên khi quay lại/tới một mốc lịch sử thì shell là
            // bên quyết định phải hiển thị view nào — không thể tin vào ?ind/?stock trên src của iframe.
            let viewOverride = null;

            function esc(s) {
                return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function fmt(v, d) {
                const n = Number(v);
                if (!isFinite(n) || n === 0) return '--';
                return n.toLocaleString('vi-VN', { maximumFractionDigits: d == null ? 2 : d });
            }
            function fmtCap(cap) { // tỷ
                const n = Number(cap) || 0;
                if (!n) return '--';
                return fmt(n / 1e9, 0) + ' tỷ';
            }
            function fmtVol(v) {
                const n = Number(v) || 0;
                if (!n) return '--';
                return (n >= 1e6 ? fmt(n / 1e6, 1) + ' tr' : fmt(n, 0));
            }
            function fmtGtgd(v) { // Giá trị giao dịch (VND) → tỷ đồng
                const n = Number(v) || 0;
                if (!n) return '--';
                if (n >= 1e12) return fmt(n / 1e12, 2) + ' nghìn tỷ';
                if (n >= 1e9) return fmt(n / 1e9, 1) + ' tỷ';
                if (n >= 1e6) return fmt(n / 1e6, 0) + ' tr';
                return fmt(n, 0);
            }
            function pct(v) {
                const n = Number(v) || 0;
                if (!n) return '0%';
                return (n >= 0 ? '+' : '') + n.toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + '%';
            }
            function cls(v) { return Number(v) >= 0 ? 'pos' : 'neg'; }

            // Đường ngành đầy đủ của 1 mã: ưu tiên đường đang duyệt (3 cấp); nếu chưa có thì
            // suy từ dữ liệu screener (sector + industry) → URL /co-phieu/nganh/{sector}/{industry}/{MÃ}.
            function stockPathFor(sym) {
                const s = all.find(function(x) { return x.symbol === String(sym || '').trim().toUpperCase(); });
                if (currentPath.length >= 3) return currentPath;
                if (s && s.sector && s.industry) return ['nganh', s.sector, s.industry];
                return currentPath.length ? currentPath : [];
            }
            function stockUrl(sym) {
                const p = stockPathFor(sym);
                return '/co-phieu' + (p.length ? '/' + p.join('/') : '') + '/' + encodeURIComponent(sym);
            }
            function openStock(sym) {
                // Luôn nhúng chi tiết cổ phiếu ngay trong trang (breadcrumb ... > MÃ) ở mọi view
                currentStock = String(sym || '').trim().toUpperCase();
                if (!currentStock) return;
                const url = stockUrl(currentStock);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'tunix-co-phieu-nav', url: url }, '*');
                }
                render();
                notifyParentHeight();
            }

            // ---------- TuniX Score circle ----------
            function scoreSvg(score) {
                const s = Number(score) || 0;
                const r = 15, c = 2 * Math.PI * r;
                const col = s >= 70 ? '#008080' : s >= 50 ? '#f5a623' : '#d0314e';
                const off = c * (1 - Math.min(100, Math.max(0, s)) / 100);
                return '<div class="score-circle">' +
                    '<svg width="34" height="34" viewBox="0 0 34 34">' +
                        '<circle cx="17" cy="17" r="' + r + '" fill="none" stroke="#eef1f5" stroke-width="4"/>' +
                        '<circle cx="17" cy="17" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/>' +
                    '</svg><span class="sc-val" style="color:' + col + ';">' + s + '</span></div>';
            }

            // ---------- Phân cấp ngành ----------
            function parseIndPath() {
                try {
                    const q = new URLSearchParams(window.location.search);
                    const ind = (q.get('ind') || '').trim();
                    return ind ? ind.split('/').filter(Boolean) : [];
                } catch (e) { return []; }
            }
            function parseStockParam() {
                try {
                    const q = new URLSearchParams(window.location.search);
                    const st = (q.get('stock') || '').trim().toUpperCase();
                    return st || null;
                } catch (e) { return null; }
            }
            function buildIndustryTree() {
                const secMap = {};
                all.forEach(function(s) {
                    const s1 = s.sector || 'khac';
                    const s2 = s.industry || 'khac';
                    const sec = secMap[s1] || (secMap[s1] = { slug: s1, name: s.sectorName || s1, count: 0, children: {} });
                    sec.count++;
                    const ind = sec.children[s2] || (sec.children[s2] = { slug: s2, name: s.industryName || s2, count: 0 });
                    ind.count++;
                });
                const tree = Object.keys(secMap).map(function(k) {
                    const sec = secMap[k];
                    const children = Object.keys(sec.children).map(function(c) { return sec.children[c]; });
                    children.sort(function(a, b) { return b.count - a.count; });
                    return { slug: sec.slug, name: sec.name, count: sec.count, children: children };
                });
                tree.sort(function(a, b) { return b.count - a.count; });
                return tree;
            }
            function findSector(slug) {
                return buildIndustryTree().find(function(s) { return s.slug === slug; }) || null;
            }
            function currentTitleDesc() {
                if (currentPath.length === 0) return { title: 'Cổ phiếu', desc: 'Danh sách tất cả cổ phiếu trên thị trường Việt Nam.' };
                if (currentPath.length === 1) return { title: 'Nhóm ngành', desc: 'Danh sách toàn bộ các nhóm ngành cổ phiếu.' };
                const sec = findSector(currentPath[1]);
                if (currentPath.length === 2) return { title: sec ? sec.name : currentPath[1], desc: 'Các ngành con thuộc nhóm ' + (sec ? sec.name : currentPath[1]) + '.' };
                const ind = sec ? (sec.children.find(function(c) { return c.slug === currentPath[2]; }) || null) : null;
                return { title: ind ? ind.name : currentPath[2], desc: 'Danh sách các doanh nghiệp thuộc nhóm ngành ' + (ind ? ind.name : currentPath[2]) + '.' };
            }
            function breadcrumbHtml() {
                const parts = [{ label: 'Cổ phiếu', path: [] }];
                // Đường ngành: lấy từ currentPath nếu đang trong view ngành; nếu không, suy từ chính cổ phiếu
                let l1 = null, l2 = null;
                if (currentPath.length >= 2) l1 = currentPath[1];
                if (currentPath.length >= 3) l2 = currentPath[2];
                if (currentStock && currentPath.length < 3) {
                    const s = all.find(function(x) { return x.symbol === currentStock; });
                    if (s) {
                        if (!l1) l1 = s.sector || null;
                        if (!l2) l2 = s.industry || null;
                    }
                }
                const hasPath = currentPath.length >= 1 || currentStock;
                if (hasPath) parts.push({ label: 'Nhóm ngành', path: ['nganh'] });
                if (l1) parts.push({ label: (findSector(l1) || {}).name || l1, path: ['nganh', l1] });
                if (l2) {
                    const sec = findSector(l1 || '');
                    const ind = sec ? (sec.children.find(function(c) { return c.slug === l2; }) || null) : null;
                    parts.push({ label: ind ? ind.name : l2, path: ['nganh', l1 || 'khac', l2] });
                }
                if (currentStock) parts.push({ label: currentStock, path: null });
                return '<nav class="cp-breadcrumb">' + parts.map(function(p, i) {
                    const isLast = i === parts.length - 1;
                    return isLast
                        ? '<span class="cb-item cb-current">' + esc(p.label) + '</span>'
                        : '<a class="cb-item" href="#" data-nav="' + esc(p.path.join('/')) + '">' + esc(p.label) + '</a>';
                }).join('<span class="cb-sep">›</span>') + '</nav>';
            }
            // Mốc thời gian dữ liệu (phiên realtime) hiển thị động theo giờ VN.
            let marketAsOf = '';
            function fmtVnAsOf(iso) {
                if (!iso) return '';
                try {
                    const t = new Date(iso).getTime();
                    if (isNaN(t)) return '';
                    const vn = new Date(t + 7 * 3600 * 1000); // VN = UTC+7
                    const p = function(n) { return (n < 10 ? '0' : '') + n; };
                    return p(vn.getUTCDate()) + '/' + p(vn.getUTCMonth() + 1) + '/' + vn.getUTCFullYear()
                        + ' · ' + p(vn.getUTCHours()) + ':' + p(vn.getUTCMinutes());
                } catch (e) { return ''; }
            }
            function cpAsOfHtml() {
                return marketAsOf
                    ? '<span class="cp-asof"><i class="far fa-clock"></i> Cập nhật lần cuối: <b>' + marketAsOf + '</b></span>'
                    : '';
            }
            function headerHtml(title, desc, action, asof) {
                return '<div class="cp-ind-head"><div class="cp-ind-head-row"><h1>' + esc(title) + '</h1>' + (action || '') + '</div>' + (desc ? '<div class="cp-ind-desc">' + esc(desc) + '</div>' : '') + (asof || '') + '</div>';
            }
            function bindNav() {
                screenerEl.querySelectorAll('[data-nav]').forEach(function(el) {
                    el.addEventListener('click', function(ev) {
                        ev.preventDefault();
                        navTo((el.getAttribute('data-nav') || '').split('/').filter(Boolean));
                    });
                });
            }
            function navTo(path) {
                currentPath = path;
                currentStock = null;
                const url = '/co-phieu' + (path.length ? '/' + path.join('/') : '');
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'tunix-co-phieu-nav', url: url }, '*');
                }
                render();
                notifyParentHeight();
            }
            function renderIndustries() {
                const tree = buildIndustryTree();
                const cards = tree.map(function(sec) {
                    const subNames = sec.children.slice(0, 5).map(function(c) { return esc(c.name); }).join(' • ');
                    return '<a class="cp-ind-card" href="#" data-nav="nganh/' + esc(sec.slug) + '">' +
                        '<div class="cic-name">' + esc(sec.name) + '</div>' +
                        '<div class="cic-sub">' + subNames + '</div>' +
                        '<div class="cic-count">' + sec.count + ' cổ phiếu</div>' +
                        '</a>';
                }).join('');
                notableEl.style.display = '';
                renderNotable();
                // Trang bên trong: chỉ đường dẫn (ẩn block xanh).
                screenerEl.innerHTML = breadcrumbHtml() +
                    '<div class="cp-ind-grid">' + cards + '</div>';
                bindNav();
            }
            function renderIndustry(l1) {
                const sec = findSector(l1);
                if (!sec) { screenerEl.innerHTML = '<div class="cp-empty">Không tìm thấy ngành.</div>'; return; }
                const cards = sec.children.map(function(c) {
                    return '<a class="cp-ind-card" href="#" data-nav="nganh/' + esc(sec.slug) + '/' + esc(c.slug) + '">' +
                        '<div class="cic-name">' + esc(c.name) + '</div>' +
                        '<div class="cic-sub">' + esc(sec.name) + '</div>' +
                        '<div class="cic-count">' + c.count + ' cổ phiếu</div>' +
                        '</a>';
                }).join('');
                notableEl.style.display = '';
                renderNotable();
                // Trang bên trong: chỉ đường dẫn (ẩn block xanh).
                screenerEl.innerHTML = breadcrumbHtml() +
                    '<div class="cp-ind-grid">' + cards + '</div>';
                bindNav();
            }
            function renderSubIndustry(l1, l2) {
                const sec = findSector(l1);
                const ind = sec ? (sec.children.find(function(c) { return c.slug === l2; }) || null) : null;
                if (!sec || !ind) { screenerEl.innerHTML = '<div class="cp-empty">Không tìm thấy ngành.</div>'; return; }
                filtered = all.filter(function(s) { return s.sector === l1 && (s.industry || 'khac') === l2; });
                filtered.sort(function(a, b) { return (b.score || 0) - (a.score || 0); });
                page = 0;
                notableEl.style.display = '';
                renderNotable();
                renderTable();
            }
            function renderAll() {
                filtered = all.slice();
                filtered.sort(function(a, b) { return (b.score || 0) - (a.score || 0); });
                page = 0;
                renderTable();
                notableEl.style.display = '';
                renderNotable();
            }
            function renderStockDetail() {
                notableEl.style.display = 'none';
                screenerEl.innerHTML = breadcrumbHtml() +
                    '<div class="cp-stock-detail"><iframe id="cpStockFrame" src="/StockDetail?symbol=' + encodeURIComponent(currentStock) + '" title="Chi tiết cổ phiếu ' + esc(currentStock) + '"></iframe></div>';
                bindNav();
                // Báo URL phân cấp đầy đủ (ngành/ngành con/MÃ) để shell cập nhật thanh địa chỉ,
                // đặc biệt khi vào từ trang chủ / ô tìm kiếm (mới chỉ có ?stock=, chưa có đường ngành).
                if (window.parent && window.parent !== window && currentStock) {
                    window.parent.postMessage({ type: 'tunix-co-phieu-nav', url: stockUrl(currentStock) }, '*');
                }
                // Đồng bộ theme cho StockDetail mới ngay khi iframe load xong (đặc biệt khi đổi mã trong dark mode)
                const f = document.getElementById('cpStockFrame');
                if (f) {
                    f.addEventListener('load', function() {
                        const mode = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
                        if (f.contentWindow) f.contentWindow.postMessage({ type: 'tunix-theme', mode: mode }, '*');
                    });
                }
                setTimeout(notifyParentHeight, 60);
            }
            function render() {
                if (currentStock) { renderStockDetail(); return; }
                if (currentPath.length === 0) renderAll();
                else if (currentPath.length === 1) renderIndustries();
                else if (currentPath.length === 2) renderIndustry(currentPath[1]);
                else renderSubIndustry(currentPath[1], currentPath[2]);
            }
            // Áp dụng view shell yêu cầu (chỉ render khi thực sự khác view đang hiển thị).
            function applyViewOverride() {
                if (!viewOverride) return;
                const p = viewOverride.path || [];
                const st = viewOverride.stock || null;
                if (p.join('/') === currentPath.join('/') && st === currentStock) return;
                currentPath = p;
                currentStock = st;
                render();
                notifyParentHeight();
            }

            // ---------- Table (sort trực tiếp trên cột) ----------
            function tableHtml() {
                const total = filtered.length;
                const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
                page = Math.min(page, pages - 1);
                const rows = filtered.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
                const headers = [
                    { k: 'symbol', t: 'Mã' }, { k: 'price', t: 'Giá' }, { k: 'percent_change', t: '% HN' },
                    { k: 'gtgd', t: 'GTGD HN', tip: 'Giá trị giao dịch hôm nay (tỷ đồng)' },
                    { k: 'volume', t: 'KL HN', tip: 'Khối lượng giao dịch hôm nay (cổ phiếu)' },
                    { k: 'change_7d', t: '% 7 ngày' }, { k: 'change_1y', t: '% 1 năm' }, { k: 'market_cap', t: 'Vốn hóa' },
                    { k: 'pe_ratio', t: 'P/E' }, { k: 'pb_ratio', t: 'P/B' }, { k: 'roe', t: 'ROE' },
                    { k: 'net_profit_growth', t: 'Tăng trưởng' }, { k: 'score', t: 'Score', tip: SCORE_TIP }
                ];
                const body = rows.length ? rows.map(function(s) {
                    return '<tr data-symbol="' + esc(s.symbol) + '">' +
                        '<td><div class="td-sym">' + esc(s.symbol) + '<span data-div="' + esc(s.symbol) + '"></span><span class="td-name">' + esc(s.name) + '</span></div></td>' +
                        '<td>' + fmt(s.price, 0) + '</td>' +
                        '<td class="' + cls(s.percent_change) + '">' + pct(s.percent_change) + '</td>' +
                        '<td>' + fmtGtgd(s.volume * s.price) + '</td>' +
                        '<td>' + fmtVol(s.volume) + '</td>' +
                        '<td class="' + cls(s.change_7d) + '">' + pct(s.change_7d) + '</td>' +
                        '<td class="' + cls(s.change_1y) + '">' + pct(s.change_1y) + '</td>' +
                        '<td>' + fmtCap(s.market_cap) + '</td>' +
                        '<td>' + (s.pe_ratio > 0 ? fmt(s.pe_ratio, 1) : '--') + '</td>' +
                        '<td>' + (s.pb_ratio > 0 ? fmt(s.pb_ratio, 2) : '--') + '</td>' +
                        '<td>' + (s.roe > 0 ? fmt(s.roe, 1) + '%' : '--') + '</td>' +
                        '<td class="' + cls(s.net_profit_growth) + '">' + pct(s.net_profit_growth) + '</td>' +
                        '<td><div class="td-score">' + scoreSvg(s.score) + '</div></td>' +
                    '</tr>';
                }).join('') : '<tr><td colspan="13"><div class="cp-empty">Không có dữ liệu cổ phiếu.</div></td></tr>';

                let pager = '';
                if (pages > 1) {
                    let btns = '';
                    let lastEllipsis = false;
                    for (let i = 0; i < pages; i++) {
                        if (pages > 9 && i > 1 && i < pages - 2 && Math.abs(i - page) > 2) {
                            if (!lastEllipsis) btns += '<span class="cp-ell">…</span>';
                            lastEllipsis = true;
                            continue;
                        }
                        lastEllipsis = false;
                        btns += '<button class="' + (i === page ? 'active' : '') + '" data-pg="' + i + '">' + (i + 1) + '</button>';
                    }
                    pager = '<div class="cp-pager">' +
                        '<button data-pg="prev" ' + (page === 0 ? 'disabled' : '') + '><i class="fas fa-chevron-left"></i></button>' +
                        btns +
                        '<button data-pg="next" ' + (page === pages - 1 ? 'disabled' : '') + '><i class="fas fa-chevron-right"></i></button>' +
                        '</div>';
                }

                return '<div class="cp-table-card">' +
                    '<div class="cp-table-wrap"><table><thead><tr>' + headers.map(function(h) {
                        const arrow = h.k === sortKey
                            ? (sortDir === -1 ? '<i class="fas fa-sort-down"></i>' : '<i class="fas fa-sort-up"></i>')
                            : '<i class="fas fa-sort"></i>';
                        return '<th data-key="' + h.k + '">' + h.t +
                            (h.tip ? '<span class="th-tip" data-tip="' + esc(h.tip) + '"><i class="fas fa-circle-info"></i></span>' : '') +
                            '<span class="sort-arrow">' + arrow + '</span></th>';
                    }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
                    pager + '</div>';
            }

            function renderTable() {
                const isRoot = currentPath.length === 0; // Trang gốc "Cổ phiếu" (toàn thị trường)
                const hd = currentTitleDesc();
                const action = isRoot
                    ? '<a class="cp-ind-btn" href="#" data-nav="nganh"><i class="fas fa-layer-group"></i> Nhóm ngành</a>'
                    : '';
                const asof = isRoot ? cpAsOfHtml() : '';
                // Trang gốc: chỉ hiện block xanh (ẩn đường dẫn). Trang bên trong: chỉ hiện đường dẫn (ẩn block xanh).
                const head = isRoot
                    ? headerHtml(hd.title, hd.desc, action, asof)
                    : breadcrumbHtml();
                screenerEl.innerHTML = head + tableHtml();
                bindNav();
                // bind table sort + pager + rows
                const tableCard = screenerEl.querySelector('.cp-table-card');
                if (tableCard) {
                    tableCard.querySelectorAll('thead th[data-key]').forEach(function(th) {
                        th.addEventListener('click', function() {
                            const k = th.getAttribute('data-key');
                            if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'symbol' ? 1 : -1; }
                            const getV = function(o) { return k === 'gtgd' ? ((o.volume || 0) * (o.price || 0)) : o[k]; };
                            filtered.sort(function(a, b) {
                                const va = getV(a), vb = getV(b);
                                if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
                                return ((va || 0) - (vb || 0)) * sortDir;
                            });
                            page = 0;
                            renderTable();
                        });
                    });
                    tableCard.querySelectorAll('.th-tip').forEach(function(tip) {
                        tip.addEventListener('mouseenter', function() { showTip(tip); });
                        tip.addEventListener('mousemove', function() { showTip(tip); });
                        tip.addEventListener('mouseleave', hideTip);
                        tip.addEventListener('click', function(ev) { ev.stopPropagation(); hideTip(); });
                    });
                    tableCard.querySelectorAll('button[data-pg]').forEach(function(b) {
                        b.addEventListener('click', function() {
                            const pg = b.getAttribute('data-pg');
                            if (pg === 'prev') page = Math.max(0, page - 1);
                            else if (pg === 'next') page = Math.min(Math.ceil(filtered.length / PAGE_SIZE) - 1, page + 1);
                            else page = Number(pg);
                            renderTable();
                        });
                    });
                    tableCard.querySelectorAll('tbody tr[data-symbol]').forEach(function(tr) {
                        tr.addEventListener('click', function() { openStock(tr.getAttribute('data-symbol')); });
                    });
                }
            }

            // ---------- Notable ----------
            const TABS = [
                { key: 'growth', label: 'Tăng trưởng' },
                { key: 'value', label: 'Định giá hấp dẫn' },
                { key: 'cash_flow', label: 'Dòng tiền mạnh' },
                { key: 'breakout', label: 'Breakout' },
                { key: 'score', label: 'TuniX Score cao' }
            ];

            function sparkline(points, w, h, up) {
                if (!points || points.length < 2) return '<svg width="' + w + '" height="' + h + '"></svg>';
                const min = Math.min.apply(null, points), max = Math.max.apply(null, points);
                const range = (max - min) || 1, pad = 2, n = points.length;
                const pts = points.map(function(v, i) {
                    return [pad + (i / (n - 1)) * (w - 2 * pad), h - pad - ((v - min) / range) * (h - 2 * pad)];
                });
                const line = pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
                const col = up ? '#008080' : '#d0314e';
                return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
                    '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
            }

            function renderNotable() {
                const gate = window.TuniXMembership;
                // Chờ trạng thái block (features) tải xong để quyết định MỞ/KHOÁ (chỉ chờ 1 lần — tránh loop khi guest).
                if (gate && gate.features === null && !window.__memberChecked) {
                    window.__memberChecked = true;
                    gate.ensure().then(function() { renderNotable(); });
                    return;
                }
                // MỞ = Super Admin bật block "Cổ phiếu nổi bật" cho tất cả, hoặc user đang là hội viên.
                const open = gate ? gate.featureOpen('notable_stocks') : true;
                const cats = window.__cats || {};
                const list = cats[activeTab] || [];
                const headHtml =
                    '<div class="cp-notable-head"><h2>Cổ phiếu nổi bật</h2>' +
                        '<div class="cp-tabs">' + TABS.map(function(t) {
                            return '<button data-tab="' + t.key + '" class="' + (t.key === activeTab ? 'active' : '') + '">' + t.label + '</button>';
                        }).join('') + '</div></div>';
                const cardsHtml =
                    '<div class="cp-cards" id="cpCards">' + list.map(function(s) {
                        return '<div class="cp-card" data-symbol="' + esc(s.symbol) + '">' +
                            '<div class="cc-top"><span class="cc-sym">' + esc(s.symbol) + '</span><span class="cc-score" title="' + esc(SCORE_TIP) + '">Score ' + s.score + '</span></div>' +
                            '<div class="cc-name">' + esc(s.name) + '</div>' +
                            '<div class="cc-price">' + fmt(s.price, 0) + '</div>' +
                            '<div class="cc-pct ' + cls(s.percent_change) + '">' + pct(s.percent_change) + '</div>' +
                            '<div class="cc-spark" id="spark-' + esc(s.symbol) + '"><span style="color:#8a99b1;font-size:11px;">Đang tải…</span></div>' +
                            '<div class="cc-meta"><span>P/E ' + (s.pe_ratio > 0 ? fmt(s.pe_ratio, 1) : '--') + '</span><span>' + fmtCap(s.market_cap) + '</span></div>' +
                        '</div>';
                    }).join('') + '</div>';

                // Tiêu đề + tab luôn HIỂN THỊ; chỉ làm mờ PHẦN NỘI DUNG (các thẻ cổ phiếu) khi block đang KHOÁ hội viên.
                notableEl.innerHTML = headHtml + (open ? cardsHtml
                    : '<div class="cp-cards-zone" id="cpCardsZone">' + cardsHtml + '</div>');

                if (!open) {
                    // Khóa kiểu MỜ: giữ tiêu đề rõ, nội dung bên dưới bị mờ + nút mở khóa ở giữa vùng nội dung.
                    if (gate) gate.lockBlur(document.getElementById('cpCardsZone'));
                    return;
                }
                notableEl.querySelectorAll('.cp-tabs button').forEach(function(b) {
                    b.addEventListener('click', function() {
                        activeTab = b.getAttribute('data-tab');
                        renderNotable();
                        loadSparklines(activeTab);
                    });
                });
                notableEl.querySelectorAll('.cp-card').forEach(function(c) {
                    c.addEventListener('click', function() { openStock(c.getAttribute('data-symbol')); });
                });
                loadSparklines(activeTab);
            }

            function loadSparklines(tab) {
                const list = (window.__cats || {})[tab] || [];
                list.forEach(function(s) {
                    const el = document.getElementById('spark-' + s.symbol);
                    if (!el) return;
                    const sym = s.symbol;
                    if (sparkCache[sym]) { el.innerHTML = sparkline(sparkCache[sym], 120, 34, Number(s.percent_change) >= 0); return; }
                    fetch('/api/stocks/' + encodeURIComponent(sym) + '/history?period=1m')
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(bars) {
                            const closes = (Array.isArray(bars) ? bars : []).map(function(b) { return Number(b.close); }).filter(function(v) { return isFinite(v); });
                            sparkCache[sym] = closes;
                            const e = document.getElementById('spark-' + sym);
                            if (e) e.innerHTML = closes.length >= 2 ? sparkline(closes, 120, 34, Number(s.percent_change) >= 0) : '<span style="color:#8a99b1;font-size:11px;">—</span>';
                        })
                        .catch(function() { const e = document.getElementById('spark-' + sym); if (e) e.innerHTML = '<span style="color:#8a99b1;font-size:11px;">—</span>'; });
                });
            }

            // ---------- Load ----------
            async function load() {
                try {
                    const res = await fetch('/api/stocks/stock-screener');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const d = await res.json();
                    all = d.stocks || [];
                    window.__cats = d.categories || {};
                    currentPath = parseIndPath();
                    marketAsOf = fmtVnAsOf(d.as_of || '');
                    // Shell có thể đã yêu cầu view KHÁC ?ind/?stock trên URL trong lúc API đang tải
                    // (điều hướng back/forward) → ưu tiên yêu cầu của shell.
                    if (viewOverride) {
                        currentPath = viewOverride.path || [];
                        currentStock = viewOverride.stock || null;
                    }
                    render();
                } catch (e) {
                    screenerEl.innerHTML = '<div class="cp-empty">Không tải được dữ liệu cổ phiếu. <a href="#" onclick="location.reload();return false;">Thử lại</a></div>';
                }
                notifyParentHeight();
            }

            // AI widget đã bỏ (block Hãy nói điều kiện không còn hiển thị)

            // ===== Embed =====
            if (window.self !== window.top) document.body.classList.add('embedded');
            function applyEmbedTheme(mode) { document.body.classList.toggle('dark-mode', mode === 'dark'); }
            function notifyParentHeight() {
                try {
                    const el = document.querySelector('.cp-page') || document.body;
                    const height = Math.ceil(el.getBoundingClientRect().height);
                    if (!height || height <= 0) return;
                    if (Math.abs(height - (window.__lastSentH || 0)) < 2) return;
                    window.__lastSentH = height;
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'tunix-embed-height', height: height }, '*');
                    }
                } catch (e) {}
            }
            window.addEventListener('message', function(event) {
                const data = event.data;
                if (!data || !data.type) return;
                // Theme từ parent index.html → áp dụng + chuyển tiếp xuống StockDetail nhúng
                if (data.type === 'tunix-theme') {
                    const mode = data.mode === 'dark' ? 'dark' : 'light';
                    localStorage.setItem('theme', mode);
                    applyEmbedTheme(mode);
                    const f = document.getElementById('cpStockFrame');
                    if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'tunix-theme', mode: mode }, '*');
                    setTimeout(notifyParentHeight, 50);
                    return;
                }
                // Shell yêu cầu hiển thị ĐÚNG view theo URL hiện tại (back/forward, hoặc mở lại chi tiết
                // 1 mã trong khi iframe đang ở view khác). Ghi nhớ override để load() không ghi đè lại.
                if (data.type === 'tunix-co-phieu-goto') {
                    const p = Array.isArray(data.path) ? data.path.filter(Boolean).map(String) : [];
                    const st = data.stock ? String(data.stock).trim().toUpperCase() : null;
                    viewOverride = { path: p, stock: st };
                    if (!all.length) return; // dữ liệu chưa về → để load() render theo override
                    applyViewOverride();
                    return;
                }
                // Message từ StockDetail nhúng (iframe con)
                const frame = document.getElementById('cpStockFrame');
                if (frame && frame.contentWindow && event.source === frame.contentWindow) {
                    if (data.type === 'tunix-embed-height' && typeof data.height === 'number' && data.height > 0) {
                        // Gộp các height update liên tiếp (nhiều panel load song song) — chỉ resize
                        // khi ổn định để tránh giật từng nấc, kết hợp transition mượt ở CSS.
                        clearTimeout(frame._hT);
                        frame._hT = setTimeout(function() {
                            if (Math.abs((frame._h || 0) - data.height) >= 4) {
                                frame._h = data.height;
                                frame.style.height = data.height + 'px';
                            }
                            notifyParentHeight();
                        }, 40);
                        return;
                    }
                    if (data.type === 'tunix-stock-modal') {
                        // StockDetail con yêu cầu mở modal (Lịch sử cổ tức / Tóm tắt doanh nghiệp)
                        // → FORWARD lên shell index.html để hiển thị modal toàn màn hình.
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'tunix-stock-modal', title: data.title, bodyHtml: data.bodyHtml }, '*');
                        }
                        return;
                    }
                    if (data.type === 'tunix-open-stock' && data.symbol) {
                        currentStock = String(data.symbol).trim().toUpperCase();
                        const url = stockUrl(currentStock);
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'tunix-co-phieu-nav', url: url }, '*');
                        }
                        renderStockDetail();
                        return;
                    }
                    if (data.type === 'tunix-symbol-changed' && data.symbol) {
                        currentStock = String(data.symbol).trim().toUpperCase();
                        const url = stockUrl(currentStock);
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'tunix-co-phieu-nav', url: url }, '*');
                        }
                        const last = screenerEl.querySelector('.cb-item.cb-current');
                        if (last) last.textContent = currentStock;
                        return;
                    }
                }
            });
            window.addEventListener('load', function() {
                applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
                setTimeout(notifyParentHeight, 60);
                setTimeout(notifyParentHeight, 400);
            });
            window.addEventListener('resize', notifyParentHeight);
            if (window.ResizeObserver) {
                const obs = new ResizeObserver(notifyParentHeight);
                obs.observe(document.querySelector('.cp-page') || document.body);
            }
            applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
            load();
        })();
    </script>
    <script src="/static/context-menu.js?v=20260928a"></script>
    <script src="/static/dividend-badge.js?v=20260926c"></script>
