                const sym = it ? String(it.symbol).toUpperCase() : (name ? name.toUpperCase().replace(/[^A-Z0-9]/g, '') : '');
                if (name && cryptoList.length && !it) {
                    el.className = 'pf-cr-bad';
                    el.innerHTML = '❌ Không tìm thấy "' + esc(name) + '" trong danh sách Crypto — vui lòng chọn đúng coin.';
                    return;
                }
                if (!name) {
                    el.className = 'pf-cr-empty';
                    el.innerHTML = '';
                    return;
                }
                if (it && !(price > 0) && !(amt > 0)) {
                    el.className = 'pf-cr-ok';
                    el.innerHTML = '✅ ' + esc(it.name) + ' (' + esc(sym) + ') · Giá ~' + fmtDec(it.price) + ' USDT';
                    return;
                }
                if (mode === 'sell') {
                    const pos = userAssets.crypto.find(function(p) { return String(p.label || '').toUpperCase() === sym; });
                    if (!(price > 0) || !(amt > 0)) { el.className = 'pf-cr-empty'; el.innerHTML = 'Nhập Giá bán + Số tiền nhận về để xem ước tính.'; return; }
                    if (!pos) { el.className = 'pf-cr-bad'; el.innerHTML = '⚠️ Bạn chưa có vị thế ' + esc(sym) + ' để bán.'; return; }
                    const coin = (amt / (1 - fee / 100)) / price;
                    el.className = 'pf-cr-ok';
                    el.innerHTML = '💰 Bán ~' + fmtDec(coin) + ' ' + esc(sym) + ' (đang giữ ' + fmtDec(pos.quantity) + ') · nhận ~' + fmtDec(amt) + ' ' + cur + ' sau phí ' + fmtDec(fee) + '%';
                    return;
                }
                if (!(price > 0) || !(amt > 0)) { el.className = 'pf-cr-empty'; el.innerHTML = 'Nhập Giá + Số tiền mua để xem ước tính.'; return; }
                const coin = amt * (1 - fee / 100) / price;
                const vnd = cryptoFx ? ' ≈ ' + fmtMoney(amt * cryptoFx.usd_vnd) + ' đ' : '';
                el.className = 'pf-cr-ok';
                el.innerHTML = '🛒 Mua ~' + fmtDec(coin) + ' ' + esc(sym) + ' · chi ' + fmtDec(amt) + ' ' + cur + ' (phí ' + fmtDec(fee) + '%)' + vnd;
            }
            // Thêm khoản tiền gửi ngân hàng (deposit) — Số tiền gửi · Lãi suất (%/năm) · Thời gian (tháng)
            function addAsset(cls) {
                if (cls !== 'deposit') return;
                const amount = moneyNum('paDepositAmount');
                const rate = parseFloat(document.getElementById('paDepositRate').value);
                const term = Math.round(parseFloat(document.getElementById('paDepositTerm').value));
                if (!(amount > 0)) { toast('Nhập Số tiền gửi (đ) > 0.', true); return; }
                if (!(rate > 0)) { toast('Nhập Lãi suất (%/năm) > 0.', true); return; }
                if (!(term > 0)) { toast('Nhập Thời gian gửi (tháng) > 0.', true); return; }
                const label = 'Tiền gửi ' + term + ' tháng · ' + fmtRatePct(rate);
                if (amount > cashVnd) {
                    return needTopUp('VND', fmtMoney(amount) + ' đ');
                }
                fetch('/api/assets', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ asset_class: cls, label: label, quantity: term, unit_price: rate, amount: amount }) })
                    .then(function(r) {
                        if (!r.ok) return r.json().then(function(j) { throw new Error(j.detail || 'Lỗi'); });
                        return r.json();
                    })
                    .then(function() {
                        toast('✅ Đã thêm khoản tiền gửi');
                        clearAssetInputs(cls);
                        loadUserAssets(function() { refreshAssetCards(); });

                    })
                    .catch(function(e) { toast('❌ ' + ((e && e.message) || 'Không thêm được'), true); });
            }
            // Mua / Bán — dispatch theo loại (crypto theo USDT/USDC, vàng/bạc theo lượng VNĐ)
            function tradeAsset(cls) {
                if (cls === 'crypto') { tradeCrypto(); return; }
                tradeGold();
            }
            function tradeCrypto() {
                const mode = assetMode.crypto === 'sell' ? 'sell' : 'buy';
                const raw = (document.getElementById('pacryptoName').value || '').trim();
                const it = cryptoFind(raw);
                if (!raw) { toast('Nhập tên crypto.', true); return; }
                if (cryptoList.length && !it) { toast('Không tìm thấy "' + raw + '" trong danh sách Crypto.', true); return; }
                const sym = it ? String(it.symbol).toUpperCase() : raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (!sym) { toast('Tên crypto không hợp lệ.', true); return; }
                const price = moneyNum('pacryptoPrice');
                const amt = moneyNum('pacryptoAmt');
                const fee = parseFloat(document.getElementById('pacryptoFee').value) || 0;
                const cur = document.getElementById('pacryptoCur').value || 'USDT';
                if (!(price > 0)) { toast('Nhập Giá (USDT/USDC) > 0.', true); return; }
                if (!(amt > 0)) { toast(mode === 'sell' ? 'Nhập số tiền nhận về > 0.' : 'Nhập số tiền mua (USDT/USDC) > 0.', true); return; }
                if (fee < 0 || fee > 100) { toast('Phí giao dịch không hợp lệ.', true); return; }
                if (mode === 'buy' && amt > cashUsdt + 1e-6) {
                    return needTopUp('USDT', fmtDec(amt) + ' USDT');
                }
                fetch('/api/assets' + (mode === 'sell' ? '/sell' : ''), { method: 'POST', headers: authHeaders(), body: JSON.stringify({ asset_class: 'crypto', label: sym, unit_price: price, amount: amt, fee: fee, currency: cur }) })
                    .then(function(r) {
                        if (!r.ok) return r.json().then(function(j) { throw new Error(j.detail || 'Lỗi'); });
                        return r.json();
                    })
                    .then(function(d) {
                        if (mode === 'sell') toast('✅ ' + ((d && d.message) || ('Đã bán ' + sym)));
                        else toast('✅ Đã mua ' + sym);
                        clearAssetInputs('crypto');
                        loadUserAssets(function() { refreshAssetCards(); });
                        loadCash(function() { applyCashUI(); });
                    })
                    .catch(function(e) { toast('❌ ' + ((e && e.message) || (mode === 'sell' ? 'Không bán được' : 'Không mua được')), true); });
            }
            function tradeGold() {
                const mode = assetMode.gold === 'sell' ? 'sell' : 'buy';
                const label = (document.getElementById('pagoldName').value || '').trim();
                if (!label) { toast('Nhập tên khoản.', true); return; }
                const price = moneyNum('pagoldPrice');
                const qty = moneyNum('pagoldQty');
                if (!(price > 0)) { toast('Nhập Đơn giá (đ) > 0.', true); return; }
                if (!(qty > 0)) { toast('Nhập Số lượng > 0.', true); return; }
                if (mode === 'buy') {
                    const need = qty * price;
                    if (need > cashVnd) {
                        return needTopUp('VND', fmtMoney(need) + ' đ');
                    }
                }
                fetch('/api/assets' + (mode === 'sell' ? '/sell' : ''), { method: 'POST', headers: authHeaders(), body: JSON.stringify({ asset_class: 'gold', label: label, quantity: qty, unit_price: price }) })
                    .then(function(r) {
                        if (!r.ok) return r.json().then(function(j) { throw new Error(j.detail || 'Lỗi'); });
                        return r.json();
                    })
                    .then(function(d) {

                        clearAssetInputs('gold');
                        loadUserAssets(function() { refreshAssetCards(); });
                        loadCash(function() { applyCashUI(); });
                    })

            function saveAssetEdit(cls) {
                const row = editingAssetRow(cls);
                if (!row) return;
                let payload = null;
                if (cls === 'gold') {
                    const label = ((document.getElementById('paEditLabel') || {}).value || '').trim();
                    const price = parseFloat((document.getElementById('paEditPrice') || {}).value);
                    const qty = parseFloat((document.getElementById('paEditQty') || {}).value);
                    if (!label) { toast('Nhập tên khoản.', true); return; }
                    if (!(price > 0) || !(qty > 0)) { toast('Nhập Đơn giá và Số lượng > 0.', true); return; }
                    payload = { label: label, quantity: qty, unit_price: price, amount: Math.round(qty * price * 100) / 100 };
                } else if (cls === 'deposit') {
                    const amount = parseFloat((document.getElementById('paEditAmt') || {}).value);
                    const rate = parseFloat((document.getElementById('paEditRate') || {}).value);
                    const term = Math.round(parseFloat((document.getElementById('paEditTerm') || {}).value));
                    if (!(amount > 0) || !(rate > 0) || !(term > 0)) { toast('Nhập đủ Số tiền gửi · Lãi suất · Thời gian (> 0).', true); return; }
                    payload = { label: row.label, quantity: term, unit_price: rate, amount: amount };
                } else if (cls === 'crypto') {
                    const price = parseFloat((document.getElementById('paEditPrice') || {}).value);
                    const qty = parseFloat((document.getElementById('paEditQty') || {}).value);

                    if (!(price > 0) || !(qty > 0)) { toast('Nhập Giá vốn và Số lượng > 0.', true); return; }

                    payload = { label: row.label, quantity: qty, unit_price: price, amount: amount, note: cur };

            let assetBound = false;
            function bindAssetForm() {
                if (assetBound) return;
                assetBound = true;
                document.addEventListener('click', function(e) {
                    const add = e.target.closest('.pa-add');
                    if (add) { e.preventDefault(); addAsset(add.getAttribute('data-cls')); return; }
                    const pedit = e.target.closest('.pa-edit');
                    if (pedit) { e.preventDefault(); startAssetEdit(pedit.getAttribute('data-cls'), Number(pedit.getAttribute('data-id'))); return; }
                    const psave = e.target.closest('.pa-save');
                    if (psave) { e.preventDefault(); saveAssetEdit(psave.getAttribute('data-cls')); return; }
                    const pcancel = e.target.closest('.pa-cancel');
                    if (pcancel) { e.preventDefault(); stopAssetEdit(); return; }
                    const tt = e.target.closest('.pa-tt');
                    if (tt) {
                        e.preventDefault();
                        const c = tt.getAttribute('data-cls');
                        if (!c) return;
                        assetMode[c] = tt.getAttribute('data-mode') === 'sell' ? 'sell' : 'buy';
                        const wrap = document.getElementById('assetWrap-' + c);
                        if (wrap) { wrap.innerHTML = assetCardInner(c); notifyParentHeight(); }
                        return;
                    }
                    const sub = e.target.closest('.pa-submit');
                    if (sub) { e.preventDefault(); tradeAsset(sub.getAttribute('data-cls')); return; }
                    const mat = e.target.closest('.pa-mature');
                    if (mat) { e.preventDefault(); matureDeposit(Number(mat.getAttribute('data-id'))); return; }
                    const hist = e.target.closest('#paCashHistBtn');
                    if (hist) { e.preventDefault(); toggleCashHistory(); return; }
                    const cc = e.target.closest('.cash-cur-btn');
                    if (cc) { e.preventDefault(); setCashCur(cc.getAttribute('data-ccur')); return; }
                    const ci = e.target.closest('#paCashIn');
                    if (ci) { e.preventDefault(); cashMove('in'); return; }
                    const co = e.target.closest('#paCashOut');
                    if (co) { e.preventDefault(); cashMove('out'); return; }
                    const del = e.target.closest('.pa-del');
                    if (del) { e.preventDefault(); delAsset(del.getAttribute('data-cls'), Number(del.getAttribute('data-id'))); }

                // Nhập tên/giá/số tiền crypto → xác minh tên + ước tính; tự điền giá hiện tại khi chọn coin

            // ---------- AI Review ----------
            function renderReview() {
                if (!holdings.length) return '<div class="pf-card pf-review"><h3>TuniAI Portfolio Review</h3><div class="pf-empty">Thêm cổ phiếu để nhận đánh giá.</div></div>';
                const t = totals();
                const sectors = {};
                holdings.forEach(function(h) { const sec = (screenerMap[h.symbol] && screenerMap[h.symbol].sectorName) || 'Khác'; sectors[sec] = (sectors[sec] || 0) + (Number(h.market_value) || 0); });
                const secArr = Object.keys(sectors).map(function(k) { return { name: k, value: sectors[k] }; }).sort(function(a, b) { return b.value - a.value; });
                const maxWeight = secArr.length ? Math.max.apply(null, secArr.map(function(s) { return s.value / (t.totalValue || 1) * 100; })) : 0;
                const avgPnl = t.totalCost ? t.totalPnl / t.totalCost * 100 : 0;
                const upCount = holdings.filter(function(h) { return Number(h.percent_change) >= 0; }).length;
                const downCount = holdings.length - upCount;
                const profitScore = Math.max(0, Math.min(100, (avgPnl + 25) / 50 * 100));
                const diversScore = secArr.length >= 4 ? 100 : secArr.length >= 3 ? 80 : secArr.length >= 2 ? 55 : 30;
                const momentumScore = holdings.length ? upCount / holdings.length * 100 : 0;
                const concPenalty = maxWeight > 60 ? 12 : maxWeight > 45 ? 6 : 0;
                const score = Math.max(0, Math.min(100, Math.round(0.4 * profitScore + 0.25 * diversScore + 0.2 * momentumScore + 0.15 * (100 - concPenalty) - concPenalty)));

                const strengths = [];
                if (secArr.length >= 3) strengths.push('🟢 Đa dạng hóa ' + secArr.length + ' ngành');
                else strengths.push('🟢 Tập trung ' + (secArr.length || 1) + ' ngành — dễ theo dõi');
                if (avgPnl >= 0) strengths.push('🟢 Lợi nhuận trung bình khả quan (' + fmtPct(avgPnl) + ')');
                else strengths.push('🟢 Kỷ luật theo dõi lãi/lỗ theo thời gian thực');
                if (momentumScore >= 60) strengths.push('🟢 Đa số vị thế có đà tăng tích cực');

                const risks = [];
                if (maxWeight > 45) risks.push('🟡 Tỷ trọng ngành ' + secArr[0].name + ' cao (' + maxWeight.toFixed(0) + '%)');
                if (downCount >= 2) risks.push('🔴 ' + downCount + ' cổ phiếu đang giảm phiên — theo dõi xu hướng');
                holdings.forEach(function(h) {
                    const info = screenerMap[h.symbol];
                    if (info && (info.risk === 'high' || info.risk === 'extreme')) risks.push('🟡 ' + h.symbol + ' mức rủi ro ' + info.risk);
                });
                if (!risks.length) risks.push('🟢 Chưa phát hiện rủi ro đáng chú ý');

                const col = score >= 70 ? '#008080' : score >= 50 ? '#f5a623' : '#d0314e';
                const r = 30, c = 2 * Math.PI * r;
                const ring = '<div class="pf-score-ring"><svg width="74" height="74" viewBox="0 0 74 74">' +
                    '<circle cx="37" cy="37" r="' + r + '" fill="none" stroke="#eef1f5" stroke-width="6"/>' +
                    '<circle cx="37" cy="37" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - score / 100)) + '"/></svg>' +
                    '<span class="sr-val" style="color:' + col + ';">' + score + '</span></div>';

                function listHtml(arr) {
                    return arr.map(function(s) {
                        const idx = s.indexOf(' ');
                        return '<li><span class="ic">' + s.slice(0, idx) + '</span><span>' + esc(s.slice(idx + 1)) + '</span></li>';
                    }).join('');
                }
                return '<div class="pf-card pf-review"><h3>TuniAI Portfolio Review</h3>' +
                    '<div class="pf-score-row">' + ring +
                        '<div class="pf-score-meta"><div class="ps-label">Portfolio Score</div><div class="ps-label" style="color:#8a99b1;">/ 100</div><div class="ps-note">Đánh giá tự động từ dữ liệu tài sản</div></div>' +
                    '</div>' +
                    '<div class="pf-lists">' +
                        '<div class="pf-list-title">Điểm mạnh</div><ul class="pf-list">' + listHtml(strengths) + '</ul>' +
                        '<div class="pf-list-title">Rủi ro</div><ul class="pf-list">' + listHtml(risks) + '</ul>' +
                    '</div></div>';
            }

            // ---------- Phân bổ (dùng chung donut + legend) ----------
            function allocCard(title, list, centerLabel) {
                const total = list.reduce(function(a, s) { return a + s.value; }, 0) || 1;
                const donut = donutSvg(list, 170, 170, centerLabel);
                const legend = list.map(function(s, i) {
                    return '<div class="al-row"><span class="al-dot" style="background:' + PALETTE[i % PALETTE.length] + ';"></span><span class="al-name">' + esc(s.name) + '</span><span class="al-pct">' + (s.value / total * 100).toFixed(0) + '%</span><span class="al-val">' + fmtMoney(s.value) + ' đ</span></div>';
                }).join('');
                return '<div class="pf-card"><h3>' + esc(title) + '</h3><div class="pf-alloc">' +
                    '<div>' + donut + '</div><div class="pf-alloc-legend">' + legend + '</div></div></div>';
            }

            // ---------- Biểu đồ thanh ngang (dùng chung) ----------
            function hbarRowsHtml(list) {
                const total = list.reduce(function(a, s) { return a + s.value; }, 0) || 1;
                return list.map(function(s, i) {
                    const pct = s.value / total * 100;
                    return '<div class="hb-row">' +
                        '<div class="hb-top"><span class="hb-name">' + esc(s.name) + '</span><span class="hb-pct">' + pct.toFixed(0) + '%</span><span class="hb-val">' + fmtMoney(s.value) + ' đ</span></div>' +
                        '<div class="hb-track"><div class="hb-fill" style="width:' + pct.toFixed(1) + '%;background:' + PALETTE[i % PALETTE.length] + ';"></div></div>' +
                    '</div>';
                }).join('');
            }
            function hbarCard(title, list, note) {
                return '<div class="pf-card"><h3>' + esc(title) + '</h3><div class="pf-hbar">' + hbarRowsHtml(list) + '</div>' + (note || '') + '</div>';
            }

            // ---------- Phân bổ tài sản (theo tài sản thật trong Danh mục đang nắm giữ) ----------
            function fxVnd() {
                if (cryptoFx && cryptoFx.usd_vnd > 0) return Number(cryptoFx.usd_vnd);
                if (cashFxRate > 0) return Number(cashFxRate);
                return 0;
            }
            function goldTotalVnd() { return (userAssets.gold || []).reduce(function(s, x) { return s + (Number(x.amount) || 0); }, 0); }
            function depositTotalVnd() { return (userAssets.deposit || []).reduce(function(s, x) { return s + (Number(x.amount) || 0); }, 0); }
            function cryptoTotalVnd() {
                const fx = fxVnd();
                if (!(fx > 0)) return 0;
                const usdt = (userAssets.crypto || []).reduce(function(s, x) { return s + (Number(x.amount) || 0); }, 0);
                return Math.round(usdt * fx);
            }
            function assetAllocation() {
                // Các loại tài sản người dùng thật sự nhập ở tab "Danh mục đang nắm giữ", quy về VND.
                const stockValue = holdings.length ? (totals().totalValue || 0) : 0;
                const cashValue = cashTotalVnd();
                const goldValue = goldTotalVnd();
                const depValue = depositTotalVnd();
                const cryValue = cryptoTotalVnd();
                const rows = [
                    { name: 'Cổ phiếu', value: stockValue },
                    { name: 'Tiền mặt', value: cashValue },
                    { name: 'Vàng/Bạc', value: goldValue },
                    { name: 'Crypto', value: cryValue },
                    { name: 'Tiền gửi ngân hàng', value: depValue }
                ];
                // Chỉ hiển thị các loại đang thực sự nắm giữ (bỏ hàng 0% vô nghĩa).
                return rows.filter(function(r) { return r.value > 0; });
            }
            // Nội dung .pf-alloc của "Phân bổ tài sản": donut tròn + chú thích màu bên phải.
            function assetAllocBodyInner(list) {
                const total = list.reduce(function(a, s) { return a + s.value; }, 0) || 1;
                const donut = donutSvg(list, 176, 176, 'tổng giá trị', fmtCompactVnd(total));
                const legend = list.map(function(s, i) {
                    return '<div class="al-row"><span class="al-dot" style="background:' + PALETTE[i % PALETTE.length] + ';"></span>' +
                        '<span class="al-name">' + esc(s.name) + '</span>' +
                        '<span class="al-pct">' + (s.value / total * 100).toFixed(1) + '%</span>' +
                        '<span class="al-val">' + fmtMoney(s.value) + ' đ</span></div>';
                }).join('');
                return '<div>' + donut + '</div><div class="pf-alloc-legend">' + legend + '</div>';
            }
            function renderAssetAlloc() {
                const list = assetAllocation();
                if (!list.length) return '<div class="pf-card"><h3>Phân bổ tài sản</h3><div class="pf-empty">Chưa có dữ liệu — nhập tài sản ở tab Danh mục đang nắm giữ.</div></div>';
                return '<div class="pf-card"><h3>Phân bổ tài sản</h3><div class="pf-alloc" id="pfAssetAllocBody">' + assetAllocBodyInner(list) + '</div></div>';
            }
            // Làm mới riêng vùng "Phân bổ tài sản" sau khi nạp xong cash / tài sản ngoài cổ phiếu.
            function refreshAssetAlloc() {
                if (currentTab !== 'overview') return;
                const body = document.getElementById('pfAssetAllocBody');
                if (!body) return;
                const card = body.closest('.pf-card');
                if (!card) return;
                const list = assetAllocation();
                if (!list.length) {
                    card.innerHTML = '<h3>Phân bổ tài sản</h3><div class="pf-empty">Chưa có dữ liệu — nhập tài sản ở tab Danh mục đang nắm giữ.</div>';

            }
            // Nạp dữ liệu cần cho Phân bổ tài sản khi đang ở tab Phân tích tài sản (overview):
            // Tiền mặt + Vàng/Bạc + Crypto + Tiền gửi ngân hàng + tỷ giá (fx).
            function loadOverviewAssets() {
                loadCash(function() { refreshAssetAlloc(); refreshCryptoAlloc(); });
                loadUserAssets(function() { refreshAssetAlloc(); refreshCryptoAlloc(); });
                loadCryptoMeta().then(function() { refreshAssetAlloc(); refreshCryptoAlloc(); });
            }

            // ---------- Phân bổ theo mã Crypto (donut giống Phân bổ theo ngành) ----------
            // Mỗi vị thế = 1 coin; giá trị quy VND theo giá hiện tại (qty × giá live × tỷ giá),
            // nếu chưa có giá live thì dùng vốn đầu tư (amount USDT/USDC × tỷ giá).
            function cryptoAllocation() {
                const fx = fxVnd();
                if (!(fx > 0)) return [];
                const out = [];
                (userAssets.crypto || []).forEach(function(x) {
                    const q = Number(x.quantity) || 0;
                    const up = String(x.label || '').trim().toUpperCase();
                    if (!up) return;
                    const mk = cryptoMap[up] || null;
                    const px = mk ? (Number(mk.price) || 0) : 0;
                    const usd = px > 0 ? q * px : (Number(x.amount) || 0);
                    const vnd = Math.round(usd * fx);
                    const friendly = (mk && mk.name && String(mk.name).toUpperCase() !== up) ? mk.name : '';
                    if (vnd > 0) out.push({ name: up, sub: friendly, value: vnd });
                });
                return out.sort(function(a, b) { return b.value - a.value; });
            }
            function cryptoAllocBody(list) {
                const total = list.reduce(function(a, s) { return a + s.value; }, 0) || 1;
                const donut = donutSvg(list, 176, 176, 'coin');
                const legend = list.map(function(s, i) {
                    return '<div class="al-row"><span class="al-dot" style="background:' + PALETTE[i % PALETTE.length] + ';"></span>' +
                        '<span class="al-name">' + esc(s.name) + (s.sub ? '<span class="al-sub">' + esc(s.sub) + '</span>' : '') + '</span>' +
                        '<span class="al-pct">' + (s.value / total * 100).toFixed(1) + '%</span>' +
                        '<span class="al-val">' + fmtMoney(s.value) + ' đ</span></div>';
                }).join('');
                return '<div>' + donut + '</div><div class="pf-alloc-legend">' + legend + '</div>';
            }
            function cryptoAllocCardHtml(list) {
                return '<div class="pf-card"><h3><i class="fas fa-coins" style="color:#008080;"></i> Phân bổ theo mã Crypto</h3>' +
                    '<div class="pf-alloc" id="pfCryptoAllocBody">' + cryptoAllocBody(list) + '</div></div>';
            }
            function refreshCryptoAlloc() {
                if (currentTab !== 'overview') return;
                const wrap = document.getElementById('pfCryptoAllocCard');
                if (!wrap) return;
                const row = document.getElementById('pfRowB');
                const list = cryptoAllocation();
                if (!list.length) {
                    wrap.innerHTML = '';
                    wrap.style.display = 'none';
                    if (row) row.classList.add('sole'); // chỉ còn Phân bổ theo ngành, full-width
                } else {
                    wrap.innerHTML = cryptoAllocCardHtml(list);
                    wrap.style.display = '';
                    if (row) row.classList.remove('sole');
                }
                notifyParentHeight();
            }

            // ---------- Phân bổ theo ngành (taxonomy ngành thống nhất của hệ thống) ----------
            function sectorAllocation() {
                // Dùng economicSectorName từ screener (hệ thống phân ngành hiện có) — không mapping rời rạc.
                const sectors = {};
                holdings.forEach(function(h) {
                    const sec = (screenerMap[h.symbol] && screenerMap[h.symbol].sectorName) || 'Khác';
                    sectors[sec] = (sectors[sec] || 0) + (Number(h.market_value) || 0);
                });
                return Object.keys(sectors).map(function(k) { return { name: k, value: sectors[k] }; })
                    .sort(function(a, b) { return b.value - a.value; });
            }
            function renderSectorAlloc() {
                const list = sectorAllocation();
                if (!list.length) return '<div class="pf-card"><h3>Phân bổ theo ngành</h3><div class="pf-empty">Chưa có dữ liệu.</div></div>';
                return allocCard('Phân bổ theo ngành', list, 'ngành');
            }

                            '<div class="pf-ca-sub">Phân tích các mã crypto đang theo dõi &amp; vị thế của bạn bằng AI — gồm Cơ hội · Cảnh báo · Xu hướng. Bấm nút bên phải để AI quét &amp; nhận định thị trường.</div>' +

            function cryptoInPosition(sym) {

            function cryptoItemHtml(it, kind) {

                const str = Number(it.strength) || 0, conf = Number(it.confidence) || 0;
                const head = symChip(it.symbol) +

                    if (it.confirmation) extra += '<div class="ca-confirm"><i class="fas fa-check-double"></i> Xác nhận: ' + esc(it.confirmation) + '</div>';
                }
                if (it.why) extra += '<div class="pf-ac-why"><i class="fas fa-circle-question"></i> Vì sao: ' + esc(it.why) + '</div>';
                return '<div class="pf-alert-card ca-card" style="border-left-color:' + ic.c + '">' +

            function cryptoTrendHtml(it) {
                const chips = [['short_term', 'Ngắn'], ['medium_term', 'Trung'], ['long_term', 'Dài']];
                const ch = chips.map(function (p) {
                    const m = CRYPTO_TREND_META[String(it[p[0]] || 'NEUTRAL').toUpperCase()] || CRYPTO_TREND_META.NEUTRAL;
                    return '<span class="ca-chip" style="color:' + m.color + ';background:' + m.bg + '">' + p[1] + ' hạn · ' + m.label + '</span>';
                }).join('');
                const str = Number(it.strength) || 0;
                return '<div class="pf-alert-card ca-card" style="border-left-color:#4a7fc4">' +
                    '<div class="pf-ac-left"><i class="fas fa-chart-line" style="color:#4a7fc4"></i></div>' +
                    '<div class="pf-ac-main">' +
                        '<div class="pf-ac-top">' + symChip(it.symbol) +

            function renderCryptoSignals() {
                const list = document.getElementById('pfCryptoAlertList');

                const d = cryptoSignalsData;

                    list.innerHTML = '<div class="pf-loading">Đang tải tín hiệu…</div>';

                const total = opp.length + war.length + tr.length;

            function mountAlerts() {
                const gate = window.TuniXMembership;
                const apply = function(m) {
                    // "Trung tâm cảnh báo" MỞ khi Super Admin bật cho tất cả, hoặc user đang là hội viên.
                    const open = gate ? gate.featureOpen('alert_center') : !!(m && m.active);
                    const member = !!(m && m.active);
                    if (member || open) {
                        sigScanVisible('stockAlertScan', true);
                        sigScanVisible('cryptoAlertScan', true);
                        loadStockSignals(false);
                        loadCryptoSignals(false);
                        return;
                    }
                    // Khoá hội viên: ẩn nút Quét, VẪN tải nội dung để làm mờ (teaser) + khóa.
                    sigScanVisible('stockAlertScan', false);
                    sigScanVisible('cryptoAlertScan', false);
                    loadStockSignals(true);
                    loadCryptoSignals(true);
                };
                if (gate) gate.ensure().then(apply); else { loadStockSignals(false); loadCryptoSignals(false); }
            }
            function sigScanVisible(id, on) {
                const b = document.getElementById(id);
                if (b) b.style.display = on ? '' : 'none';
            }
            // ---- Tín hiệu Crypto: quét + hiển thị ----
            function loadCryptoSignals(lockedFree) {
                const list = document.getElementById('pfCryptoAlertList');
                if (!list) return;
                const scanBtn = document.getElementById('cryptoAlertScan');
                if (scanBtn && !scanBtn.getAttribute('data-bound')) {
                    scanBtn.setAttribute('data-bound', '1');
                    scanBtn.addEventListener('click', function() {
                        if (DEMO) { toast('Vui lòng đăng nhập để dùng Tín hiệu Crypto.', true); return; }
                        scanBtn.disabled = true;
                        scanBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI đang phân tích…';
                        fetch('/api/crypto-signals/scan', { method: 'POST', headers: authHeaders() })
                            .then(function(r) {
                                if (!r.ok) return r.json().then(function(e) { throw new Error((e && e.detail) || 'Quét tín hiệu thất bại.'); });
                                return r.json();
                            })
                            .then(function(res) {
                                const nSig = ((res.opportunities || []).length + (res.alerts || []).length + (res.trends || []).length);
                                toast('Đã phân tích ' + (res.symbols || []).length + ' mã, tìm thấy ' + nSig + ' tín hiệu.');
                                cryptoSignalsData = res;
                                renderCryptoSignals();
                                if (lockedFree) applyCryptoTeaser(lockedFree);
                            })
                            .catch(function(err) {
                                const msg = (err && err.message) || 'Quét tín hiệu thất bại.';
                                list.innerHTML = '<div class="pf-empty"><i class="fas fa-circle-exclamation"></i> ' + esc(msg) + '</div>';
                                notifyParentHeight();
                            })
                            .finally(function() {
                                scanBtn.disabled = false;
                                scanBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Quét tín hiệu';
                            });
                    });
                }
                if (DEMO) {
                    list.innerHTML = '<div class="pf-empty">Đăng nhập để xem Tín hiệu Crypto.</div>';
                    notifyParentHeight(); return;
                }
                fetch('/api/crypto-signals', { headers: authHeaders(), cache: 'no-store' })
                    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                    .then(function(res) {
                        cryptoSignalsData = res;
                        renderCryptoSignals();
                        if (lockedFree) applyCryptoTeaser(lockedFree);
                    })
                    .catch(function() { list.innerHTML = '<div class="pf-empty">Không tải được tín hiệu.</div>'; notifyParentHeight(); });
            }
            function applyCryptoTeaser(lockedFree) {
                const gate = window.TuniXMembership;
                if (!(lockedFree && gate)) return;
                const list = document.getElementById('pfCryptoAlertList');
                if (!list || list.getAttribute('data-tg-locked')) return;
                const hasCards = !!list.querySelector('.pf-alert-card');
                if (!hasCards) {
                    list.innerHTML = gate.lockCardHTML({
                        title: 'Tín hiệu Crypto dành cho Hội viên',
                        desc: 'AI phân tích vị thế & mã crypto đang theo dõi của bạn: Cơ hội, Cảnh báo, Xu hướng.',
                        icon: 'fa-coins'
                    });
                } else {
                    gate.lockBlur(list, false);
                }
            }

            function stockInPosition(sym) {

            // Mã bấm được → mở trang chi tiết tương ứng (cổ phiếu / crypto); dùng chung cho CƠ HỘI / CẢNH BÁO / XU HƯỚNG.
            function symChip(sym) {
                const s = esc(sym);

            // khóa mờ (.tg-blur-body có pointer-events:none → click vào chip sẽ không phát sinh sự kiện).
            function bindSignalLinks(listId, go) {
                const list = document.getElementById(listId);
                if (!list || list.getAttribute('data-linkbound')) return;
                list.setAttribute('data-linkbound', '1');
                function hit(e) { return e.target && e.target.closest ? e.target.closest('.ca-sym-link') : null; }
                list.addEventListener('click', function(e) {
                    const el = hit(e);
                    if (!el) return;
                    e.preventDefault();
                    go(el.getAttribute('data-sym'));
                });
                list.addEventListener('keydown', function(e) {
                    if (e.key !== 'Enter' && e.key !== ' ') return;
                    const el = hit(e);
                    if (!el) return;
                    e.preventDefault();
                    go(el.getAttribute('data-sym'));
                });
            }
            function stockItemHtml(it, kind) {

                const sev = CRYPTO_SEV_META[String(it.severity || '').toUpperCase()] || CRYPTO_SEV_META.MEDIUM;
                const str = Number(it.strength) || 0, conf = Number(it.confidence) || 0;
                const head = symChip(it.symbol) +
                    (stockInPosition(it.symbol) ? '<span class="ca-tag ca-pos"><i class="fas fa-briefcase"></i> Vị thế</span>' : '') +

                    '<span class="ca-str">Độ mạnh <b>' + str + '</b>/100 · Tin cậy <b>' + conf + '</b></span>';

                    if (it.zone) extra += '<div class="ca-zone"><i class="fas fa-arrows-left-right"></i> Vùng giá quan trọng: <b>' + esc(it.zone) + '</b> đ</div>';
                    if (it.confirmation) extra += '<div class="ca-confirm"><i class="fas fa-check-double"></i> Xác nhận: ' + esc(it.confirmation) + '</div>';

            function fmtAgo(iso) {
                if (!iso) return '';
                try {
                    const d = new Date(iso);
                    const s = Math.floor((Date.now() - d.getTime()) / 1000);
                    if (s < 60) return 'vừa xong';
                    if (s < 3600) return Math.floor(s / 60) + ' phút trước';
                    if (s < 86400) return Math.floor(s / 3600) + ' giờ trước';
                    return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                } catch (e) { return ''; }
            }

            // ---------- Watchlist ----------
            function renderWatchlist() {
                return '<div class="pf-card"><h3>Cổ phiếu đang theo dõi</h3>' +
                    '<div class="pf-wl-add">' + (DEMO ? '' : '<input id="wlInput" placeholder="Thêm mã, VD: VNM" /><button id="wlAdd"><i class="fas fa-plus"></i></button>') + '</div>' +

            // Màu theo quy ước trang Thị trường: Trần = tím, Tăng = xanh lá, Đứng = vàng, Giảm = đỏ, Sàn = xanh lơ
            const WL_COLORS = { ceiling: '#9A26F3', up: '#00A745', flat: '#FFC107', down: '#DC3545', floor: '#33b1e3' };
            function wlColor(q) {
                const p = Number(q.percent_change) || 0;
                const ex = String(q.exchange || '').toUpperCase();
                const ceil = ex === 'HNX' ? 9.5 : ex === 'UPCOM' ? 14.5 : 6.8;
                if (p >= ceil) return WL_COLORS.ceiling;
                if (p <= -ceil) return WL_COLORS.floor;
                if (p === 0) return WL_COLORS.flat;
                return p > 0 ? WL_COLORS.up : WL_COLORS.down;
            }
            function fmtVol(v) {
                const n = Number(v) || 0;
                if (!n) return '--';
                if (n >= 1e9) return (n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' tỷ';
                if (n >= 1e6) return (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' triệu';
                if (n >= 1e3) return (n / 1e3).toLocaleString('vi-VN', { maximumFractionDigits: 0 }) + ' nghìn';
                return String(Math.round(n));
            }
            function wlItemHtml(sym, showRemove) {
                return '<tr data-symbol="' + esc(sym) + '">' +
                    '<td><div class="td-sym">' + esc(sym) + '<span data-div="' + esc(sym) + '"></span><span class="name wl-name"></span></div></td>' +
                    '<td class="wl-price" style="font-weight:800;">--</td>' +
                    '<td class="wl-prev">--</td>' +
                    '<td class="wl-chg" style="font-weight:700;">--</td>' +
                    '<td class="wl-vol">--</td>' +
                    (showRemove ? '<td style="text-align:right;"><div class="td-actions" style="justify-content:flex-end;"><button type="button" class="act-btn del wl-rm" data-rm="' + esc(sym) + '" title="Xóa"><i class="fas fa-trash"></i></button></div></td>' : '') +
                '</tr>';
            }
            function fillWlQuotes(listEl, symbols) {
                symbols.forEach(function(sym) {
                    fetch('/api/stocks/' + encodeURIComponent(sym) + '/quote', { cache: 'no-store' })
                        .then(function(r) { return r.ok ? r.json() : null; })
                        .then(function(q) {
                            if (!q) return;
                            const row = listEl.querySelector('[data-symbol="' + sym + '"]');
                            if (!row) return;
                            const color = wlColor(q);
                            const price = Number(q.price) || 0;
                            const change = Number(q.change) || 0;
                            const pct = Number(q.percent_change) || 0;
                            const nameEl = row.querySelector('.wl-name');
                            if (nameEl) nameEl.textContent = q.company_name || q.name || '';
                            const priceEl = row.querySelector('.wl-price');
                            if (priceEl) { priceEl.textContent = price ? fmtMoney(price) : '--'; priceEl.style.color = color; }
                            const prevEl = row.querySelector('.wl-prev');
                            if (prevEl) { const prev = Number(q.reference_price) || 0; prevEl.textContent = prev ? fmtMoney(prev) : '--'; }
                            const chgEl = row.querySelector('.wl-chg');
                            if (chgEl) {
                                if (change === 0 && pct === 0) {
                                    chgEl.textContent = '0 (0%)';
                                } else {
                                    const sign = change > 0 ? '+' : change < 0 ? '−' : '';
                                    const pSign = pct > 0 ? '+' : pct < 0 ? '−' : '';
                                    chgEl.textContent = sign + fmtMoney(Math.abs(change)) + ' (' + pSign + Math.abs(pct).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + '%)';
                                }
                                chgEl.style.color = color;
                            }
                            const volEl = row.querySelector('.wl-vol');
                            if (volEl) volEl.textContent = fmtVol(q.volume);
                        }).catch(function() {});
                });
            }
            function loadWatchlist() {

            // ---------- Portfolio table (nắm giữ + theo dõi) ----------
            // Bảng danh mục cổ phiếu (như cũ) + Bảng danh mục crypto (gộp vị thế đang giữ + coin đang theo dõi).
            const CRYPTO_PT_HEADER = '<th>Coin</th><th>Giá Vốn TB</th><th>Giá hiện tại</th><th>Số lượng</th><th>Giá trị (USDT)</th><th>Lãi/Lỗ (%)</th><th>Hỗ trợ</th><th>Kháng cự</th><th>Trạng thái</th><th>Volume 24h</th>';
            function cryptoBoardRows() {
                const held = userAssets.crypto || [];
                const heldMap = {};
                held.forEach(function(p) { const s = String(p.label || '').trim().toUpperCase(); if (s) heldMap[s] = p; });
                const syms = [];
                held.forEach(function(p) { const s = String(p.label || '').trim().toUpperCase(); if (s && syms.indexOf(s) < 0) syms.push(s); });
                (cwSyms || []).forEach(function(s) { if (s && syms.indexOf(s) < 0) syms.push(s); });
                const rows = [];
                alphaSort(syms, symKey).forEach(function(sym) {
                    const p = heldMap[sym];
                    const it = cryptoMap[sym] || null;
                    const price = it ? (Number(it.price) || 0) : 0;
                    const vol = it ? (Number(it.volume) || 0) : null;
                    const qty = p ? (Number(p.quantity) || 0) : 0;
                    const cost = p ? (Number(p.amount) || 0) : 0;
                    const avg = p ? ((Number(p.unit_price) || 0) || (qty > 0 ? cost / qty : 0)) : 0;
                    let cur = null, pnl = null, pnlPct = null;
                    if (p) {
                        cur = price > 0 ? qty * price : cost;
                        if (price > 0) { pnl = cur - cost; pnlPct = cost > 0 ? pnl / cost * 100 : 0; }
                    }
                    rows.push({ sym: sym, name: (it && it.name && String(it.name).toUpperCase() !== sym) ? it.name : '', hold: !!p, avg: avg, qty: qty, price: price, vol: vol, cur: cur, pnl: pnl, pnlPct: pnlPct });
                });
                return rows;
            }
            function cryptoBoardRowHtml(o) {
                const name = o.name ? '<span class="name">' + esc(o.name) + '</span>' : '';

                const priceHtml = o.price > 0 ? '<span style="font-weight:800;">' + fmtDec(o.price) + '</span>' : '—';
                const pnlUp = (o.pnl || 0) >= 0;
                let pnlHtml = '<span>—</span>';
                if (o.pnl != null && o.pnlPct != null) {
                    const cls = pnlUp ? 'pos' : 'neg';
                    pnlHtml = '<span class="' + cls + '">' + (o.pnl >= 0 ? '+' : '−') + fmtDec(Math.abs(o.pnl)) +
                        ' <span style="font-size:11px;">(' + (o.pnlPct >= 0 ? '+' : '−') + Math.abs(o.pnlPct).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + '%)</span></span>';
                }
                return '<tr data-csym="' + esc(o.sym) + '">' +
                    '<td><div class="td-sym">' + esc(o.sym) + name + '</div></td>' +
                    '<td>' + avgHtml + '</td>' +
                    '<td>' + priceHtml + '</td>' +

                    '<td class="cr-res">…</td>' +

                function render() {
                    const rows = cryptoBoardRows();

                if (DEMO) { cwSyms = CW_DEMO.slice(); Promise.resolve(loadCryptoMeta()).then(function() { render(); }); return; }
                const metaP = Promise.resolve(loadCryptoMeta()).catch(function() {});
                const assetsP = new Promise(function(res) { loadUserAssets(function() { res(); }); });

            // Hỗ trợ/Kháng cự crypto (nến 1D Binance): đỉnh/đáy fractal + gom cụm → vùng gần giá hiện tại.
            const cryptoSrCache = {};
            function cryptoPivots(candles) {
                const highs = [], lows = [];
                for (let i = 2; i < candles.length - 2; i++) {
                    const h = candles[i].high, l = candles[i].low;
                    if (h > candles[i-1].high && h > candles[i-2].high && h > candles[i+1].high && h > candles[i+2].high) highs.push(h);
                    if (l < candles[i-1].low && l < candles[i-2].low && l < candles[i+1].low && l < candles[i+2].low) lows.push(l);
                }
                return { highs: highs, lows: lows };
            }
            function cryptoZonesFrom(vals) {
                const sorted = (vals || []).slice().sort(function(a, b) { return a - b; });
                const zones = [];
                sorted.forEach(function(v) {
                    let z = null;
                    for (let k = 0; k < zones.length; k++) { if (Math.abs(v - zones[k].c) / zones[k].c <= 0.004) { z = zones[k]; break; } }
                    if (z) { z.min = Math.min(z.min, v); z.max = Math.max(z.max, v); z.c = (z.c * z.n + v) / (z.n + 1); z.n += 1; }
                    else zones.push({ min: v, max: v, c: v, n: 1 });
                });
                return zones;
            }
            function cryptoNearestSr(candles, refPrice) {
                if (!candles || candles.length < 20 || !(refPrice > 0)) return { support: null, resistance: null };
                const pv = cryptoPivots(candles);
                const zs = cryptoZonesFrom(pv.highs).concat(cryptoZonesFrom(pv.lows)).sort(function(a, b) { return a.c - b.c; });
                let support = null, resistance = null;
                for (let i = 0; i < zs.length; i++) {
                    const z = zs[i];
                    if (z.max < refPrice && (!support || (refPrice - z.max) < (refPrice - support.max))) support = z;
                    if (z.min > refPrice && (!resistance || (z.min - refPrice) < (resistance.min - refPrice))) resistance = z;
                }
                return { support: support, resistance: resistance };
            }
            function srZoneText(z) {
                return '<span title="Vùng ' + z.n + ' lần chạm">' + fmtDec(z.min) + '–' + fmtDec(z.max) + '</span>';
            }
            function cryptoStatusHtml(st) {

            function loadCryptoSr() {

                document.querySelectorAll('#cryptoPortfolioBody tr[data-csym]').forEach(function(tr) {

                    cryptoSrCache[sym] = fetch('/api/crypto/klines?symbol=' + encodeURIComponent(sym) + '&interval=1d&limit=360', { cache: 'no-store' })

                            const mk = cryptoMap[sym];
                            const ref = mk ? (Number(mk.price) || 0) : (candles[candles.length - 1].close || 0);
                            const sr = cryptoNearestSr(candles, ref);
                            // Dùng đúng logic cột Trạng thái cổ phiếu (calcStatus): Gần hỗ trợ/kháng cự → MA20 + momentum.
                            const supObj = sr.support ? { upper_bound: sr.support.max } : null;
                            const resObj = sr.resistance ? { lower_bound: sr.resistance.min } : null;
                            sr.st = calcStatus(ref, supObj, resObj, candles);

            function renderPortfolioTable() {

            function nearestZone(zones, kind, price) {
                if (!Array.isArray(zones)) return null;

                if (!filtered.length) return null;
                filtered.sort(function(a, b) {
                    if (kind === 'support') return b.upper_bound - a.upper_bound;
                    return a.lower_bound - b.lower_bound;

                return filtered[0];

            function zoneCell(zone) {
                if (!zone) return '<span style="color:#b6c2d2;">-</span>';

                return '<span style="white-space:nowrap;">' + fmtMoney(zone.lower_bound) + '–' + fmtMoney(zone.upper_bound) +

            }
            function calcStatus(price, support, resistance, candles) {
                const neutral = { label: 'Trung lập', icon: 'fa-minus', color: '#8a99b1' };
                if (!price || price <= 0) return neutral;
                const nearPct = 0.02;
                if (support) {
                    const d = Math.abs(price - support.upper_bound) / price;
                    if (d <= nearPct) return { label: 'Gần hỗ trợ', icon: 'fa-arrow-down-to-line', color: '#26a69a' };
                }
                if (resistance) {
                    const d = Math.abs(resistance.lower_bound - price) / price;
                    if (d <= nearPct) return { label: 'Gần kháng cự', icon: 'fa-arrow-up-from-line', color: '#ef5350' };
                }
                let aboveMA = null, momentum = null;
                if (candles && candles.length >= 20) {
                    const ma20 = candles.slice(-20).reduce(function(s, c) { return s + c.close; }, 0) / 20;
                    aboveMA = price >= ma20;
                }
                if (candles && candles.length >= 6) {
                    momentum = price >= candles[candles.length - 6].close;

                if (aboveMA !== null && momentum !== null) {

                const wrap = document.getElementById('pfPerfChart');
                if (!wrap) return;
                if (!holdings.length) { wrap.innerHTML = '<div class="pf-empty">Chưa có dữ liệu.</div>'; return; }
                const qty = {};
                holdings.forEach(function(h) { qty[h.symbol] = Number(h.quantity) || 0; });
                // Biểu đồ luôn hiển thị TỪ KHI ĐẦU TƯ đến hiện tại (đã bỏ nút chọn kỳ hạn).
                let start = null;
                holdings.forEach(function(h) { if (h.created_at) { const d = String(h.created_at).slice(0, 10); if (!start || d < start) start = d; } });
                // Tổng vốn đã đầu tư (giá vốn) — dùng làm điểm gốc của biểu đồ hiệu suất.
                let totalCost = 0;
                holdings.forEach(function(h) { totalCost += (Number(h.quantity) || 0) * (Number(h.avg_price) || 0); });
                wrap.innerHTML = '<div class="pf-loading">Đang tải dữ liệu giá…</div>';
                // Dùng kỳ hạn 1y (dữ liệu NGÀY, cập nhật đến hôm nay) thay vì 5y
                // (Simplize trả 5y bị lag ~3 ngày + mật độ thưa → đường biểu đồ thiếu các ngày gần nhất).
                buildPerfCurve(holdings.map(function(h) { return h.symbol; }), qty, '1y').then(function(res) {
                    let curve = res.curve;
                    if (start) curve = curve.filter(function(c) { return c.date >= start; });
                    // Chèn điểm gốc = tổng vốn đầu tư (trước ngày bắt đầu 1 phiên) để biểu đồ luôn
                    // có ≥ 2 điểm → hiển thị được ngay cả khi danh mục mới đầu tư ít phiên.
                    if (start && totalCost > 0 && curve.length >= 1) {
                        curve = [{ date: prevTradingDay(start), value: totalCost }].concat(curve);
                    }
                    if (curve.length < 2) {
                        const startTxt = start ? fmtDateVi(start) : '—';
                        wrap.innerHTML = '<div class="pf-empty">Cần ít nhất 2 phiên giao dịch sau ngày bắt đầu đầu tư (' + startTxt + ') để vẽ biểu đồ.</div>';
                        return;
                    }
                    wrap.innerHTML = perfLineChart(curve, 540, 150);
                    if (res.failed > 0) {
                        const warn = document.getElementById('pfPerfWarn');
                        if (warn) warn.innerHTML = '<div class="pf-perf-warn"><i class="fas fa-exclamation-triangle"></i> Một số dữ liệu giá chưa được cập nhật.</div>';
                    }
                    notifyParentHeight();
                });
            }
            function buildPerfCurve(symbols, qty, histPeriod) {
                let failed = 0;
                const fetches = symbols.map(function(sym) {
                    return fetch('/api/stocks/' + encodeURIComponent(sym) + '/history?interval=1d&period=' + encodeURIComponent(histPeriod))
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(bars) {
                            const list = (Array.isArray(bars) ? bars : []).map(function(b) {
                                return { t: String(b.time || '').slice(0, 10), c: Number(b.close) || 0 };
                            }).filter(function(b) { return b.t && b.c > 0; });
                            if (!list.length) failed++;
                            return { sym: sym, bars: list };
                        })
                        .catch(function() { failed++; return { sym: sym, bars: [] }; });
                });
                return Promise.all(fetches).then(function(all) {
                    const byDate = new Map();
                    all.forEach(function(o) {
                        const q = qty[o.sym] || 0;
                        if (!q) return;
                        o.bars.forEach(function(b) {
                            if (!byDate.has(b.t)) byDate.set(b.t, {});
                            byDate.get(b.t)[o.sym] = b.c;
                        });
                    });
                    const dates = Array.from(byDate.keys()).sort();
                    const last = {};
                    const curve = dates.map(function(d) {
                        const o = byDate.get(d);
                        let v = 0;
                        all.forEach(function(item) {
                            const q = qty[item.sym] || 0;
                            if (!q) return;
                            const c = o[item.sym];
                            if (c != null) last[item.sym] = c;
                            if (last[item.sym] != null) v += q * last[item.sym];
                        });
                        return { date: d, value: v };
                    });
                    return { curve: curve, failed: failed };
                });
            }
            function perfLineChart(curve, w, h) {
                const values = curve.map(function(c) { return c.value; });
                const min = Math.min.apply(null, values), max = Math.max.apply(null, values);
                const range = (max - min) || 1;
                const padL = 8, padR = 8, padT = 14, padB = 22;
                const n = curve.length;
                const pts = values.map(function(v, i) {
                    return [padL + (i / (n - 1)) * (w - padL - padR), padT + (1 - (v - min) / range) * (h - padT - padB)];
                });
                const line = pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
                const area = padL + ',' + (h - padB) + ' ' + line + ' ' + (w - padR) + ',' + (h - padB);
                const up = values[n - 1] >= values[0];
                const col = up ? '#008080' : '#E5484D';
                const last = values[n - 1], first = values[0];
                const fmtDate = function(d) { const p = d.split('-'); return p[2] + '/' + p[1]; };
                const idxs = [0, Math.floor((n - 1) / 2), n - 1];
                const labels = idxs.map(function(i) {
                    return '<text x="' + pts[i][0].toFixed(0) + '" y="' + (h - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '" font-size="10" fill="#8a99b1" font-family="Inter">' + fmtDate(curve[i].date) + '</text>';
                }).join('');
                return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
                    '<defs><linearGradient id="pfPerfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + col + '" stop-opacity="0.25"/><stop offset="100%" stop-color="' + col + '" stop-opacity="0.02"/></linearGradient></defs>' +
                    '<polygon points="' + area + '" fill="url(#pfPerfGrad)"/>' +
                    '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
                    '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="3" fill="' + col + '"/>' +
                    '<text x="' + (w - padR - 4) + '" y="' + (pts[n - 1][1] - 8).toFixed(0) + '" text-anchor="end" font-size="11" font-weight="700" fill="' + col + '" font-family="Inter">' + fmtShort(last) + '</text>' +
                    '<text x="' + (padL + 2) + '" y="' + (pts[0][1] - 8).toFixed(0) + '" text-anchor="start" font-size="10" fill="#8a99b1" font-family="Inter">' + fmtShort(first) + '</text>' +
                    labels +
                '</svg>';
            }
