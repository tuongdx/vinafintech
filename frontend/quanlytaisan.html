                    if (priceEl) { priceEl.textContent = price ? fmtDec(price) : '--'; }
                    const chgEl = row.querySelector('.wl-chg');
                    if (chgEl) { chgEl.textContent = (pct === 0 ? '0%' : (up ? '+' : '−') + Math.abs(pct).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + '%'); chgEl.style.color = color; }
                    const volEl = row.querySelector('.wl-vol');
                    if (volEl) volEl.textContent = fmtVolUsd(mk.volume);
                });
            }
            function bindCwList() {
                document.querySelectorAll('#cwList .cw-rm').forEach(function(b) {
                    b.addEventListener('click', function() {
                        const sym = b.getAttribute('data-rm');
                        fetch('/api/crypto-watchlist/' + encodeURIComponent(sym), { method: 'DELETE', headers: authHeaders() })
                            .then(function(r) { if (!r.ok) return r.json().then(function(j) { throw new Error((j && j.detail) || 'Xóa thất bại'); }); return null; })
                            .then(function() {
                                cwSyms = cwSyms.filter(function(s) { return s !== sym; });
                                document.querySelectorAll('#cwList tr[data-cwsym="' + sym + '"]').forEach(function(el) { el.remove(); });
                                if (!cwSyms.length) { const l = document.getElementById('cwList'); if (l) l.innerHTML = '<tr><td colspan="5" class="pf-empty">Chưa có coin nào trong danh mục theo dõi.</td></tr>'; }
                                toast('Đã bỏ theo dõi ' + sym);
                                notifyParentHeight();
                            })
                            .catch(function(e) { toast('❌ ' + ((e && e.message) || 'Xóa thất bại'), true); });
                    });
                });
            }
            function renderCryptoWlList() {
                const listEl = document.getElementById('cwList');
                if (!listEl) return;
                if (!cwSyms.length) {
                    listEl.innerHTML = '<tr><td colspan="5" class="pf-empty">Chưa có coin nào — thêm coin bên trên để theo dõi giá.</td></tr>';
                    bindCwList();
                    notifyParentHeight();
                    return;
                }
                listEl.innerHTML = cwSyms.map(function(s) { return cryptoWlRowHtml(s, !DEMO); }).join('');
                cwFillRows(listEl, cwSyms);
                bindCwList();
                notifyParentHeight();
            }
            function loadCryptoWatchlist() {
                if (DEMO) {
                    cwSyms = alphaSort(CW_DEMO.slice(), symKey);
                    Promise.resolve(loadCryptoMeta()).then(function() { renderCryptoWlList(); });
                    return;
                }
                Promise.resolve(loadCryptoMeta()).then(function() {
                    return fetch('/api/crypto-watchlist', { headers: authHeaders() })
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(rows) {
                            // Sắp xếp theo mã coin (A→Z) — bảng "Crypto đang theo dõi".
                            cwSyms = alphaSort((Array.isArray(rows) ? rows : []).map(function(w) { return w.symbol; }), symKey);
                            renderCryptoWlList();
                            return null;
                        })
                        .catch(function() { const l = document.getElementById('cwList'); if (l) l.innerHTML = '<tr><td colspan="5" class="pf-empty">Không tải được danh sách theo dõi crypto.</td></tr>'; });
                });
            }
            function bindCwAdd() {
                const btn = document.getElementById('cwAdd');
                const input = document.getElementById('cwInput');
                if (!btn || !input) return;
                function submit() {
                    const raw = input.value.trim();
                    if (!raw) return;
                    // Nhập tự do như ô cổ phiếu (không tự điền/tự sửa khi gõ). Khi bấm Thêm:
                    // nếu khớp coin trong danh sách (mã/tên) → lấy đúng mã; ngược lại lấy chuỗi in hoa đã lọc.
                    const it = cryptoFind(raw);
                    const v = it ? String(it.symbol).toUpperCase() : raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    if (!v) { toast('Mã coin không hợp lệ.', true); return; }
                    fetch('/api/crypto-watchlist', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ symbol: v }) })
                        .then(function(r) { if (!r.ok) return r.json().then(function(j) { throw new Error((j && j.detail) || 'Lỗi'); }); return r.json(); })
                        .then(function() { input.value = ''; toast('Đã thêm ' + v + ' vào danh mục theo dõi'); loadCryptoWatchlist(); })
                        .catch(function(e) { toast('❌ ' + ((e && e.message) || 'Không thêm được'), true); });
                }
                btn.addEventListener('click', submit);
                input.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
            }
            function mountCryptoWl() {
                bindCwAdd();
                loadCryptoWatchlist();
            }
            function fetchPriceHint(symbol) {
                const hint = document.getElementById('pfPriceHint');
                if (!hint) return;
                fetch('/api/stocks/' + encodeURIComponent(symbol) + '/quote', { cache: 'no-store' })
                    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(function(q) {
                        if (!q || q.valid === false) { hint.innerHTML = 'Không tìm thấy mã ' + esc(symbol); return; }
                        const price = Number(q.price) || 0;
                        const useLabel = tradeMode === 'sell' ? 'Dùng giá này làm giá bán' : 'Dùng giá này làm giá mua';
                        hint.innerHTML = 'Giá hiện tại: <strong>' + fmtMoney(price) + ' đ</strong> · <a id="pfUsePrice">' + useLabel + '</a>';
                        const a = document.getElementById('pfUsePrice');
                        if (a) a.addEventListener('click', function() { const avg = document.getElementById('pfAvg'); if (avg) { avg.value = price; fmtMoneyInput(avg); toast('Đã điền giá hiện tại'); } });
                    })
                    .catch(function() { hint.innerHTML = ''; });
            }
            function submitHolding() {
                const symbol = (document.getElementById('pfSymbol').value || '').trim().toUpperCase();
                if (!symbol) { toast('Nhập mã cổ phiếu.', true); return; }
                const feeEl = document.getElementById('pfFee');
                const fee = feeEl ? (parseFloat(feeEl.value) || 0) : 0;
                if (fee < 0) { toast('Phí giao dịch không hợp lệ.', true); return; }
                function send(url, method, body) {
                    fetch(url, { method: method, headers: authHeaders(), body: JSON.stringify(body) })
                        .then(function(r) {
                            if (!r.ok) { return r.json().then(function(j) { throw new Error(j.detail || 'Lỗi'); }); }
                            return r.json();
                        })
                        .then(function(d) {
                            if (method === 'POST' && url.indexOf('/sell') !== -1) toast('✅ ' + (d.message || 'Đã bán'));
                            else if (method === 'POST') toast('✅ Đã mua thêm vào danh mục');
                            else toast('✅ Đã cập nhật');
                            editId = null;
                            refreshStockCard();
                        })
                        .catch(function(e) { if (e && e.message) toast('❌ ' + e.message, true); });
                }
                if (editId) {
                    const quantity = moneyNum('pfQty');
                    const avg_price = moneyNum('pfAvg');
                    if (!(quantity > 0)) { toast('Số lượng phải lớn hơn 0.', true); return; }
                    if (!(avg_price >= 0)) { toast('Giá vốn không hợp lệ.', true); return; }
                    send('/api/portfolio/' + editId, 'PUT', { quantity: quantity, avg_price: avg_price });
                    return;
                }
                const quantity = moneyNum('pfQty');
                const price = moneyNum('pfAvg');
                if (!(quantity > 0)) { toast('Số lượng mua/bán phải lớn hơn 0.', true); return; }
                if (!(price > 0)) { toast('Giá mua/bán không hợp lệ.', true); return; }
                if (quantity > 1000000) { toast('Số lượng tối đa 1.000.000.', true); return; }
                if (price > 1000000) { toast('Giá tối đa 1.000.000.', true); return; }
                if (tradeMode === 'sell') {
                    const h = holdings.find(function(x) { return x.symbol === symbol; });
                    if (!h) { toast('Mã ' + symbol + ' không có trong danh mục.', true); return; }
                    send('/api/portfolio/' + h.id + '/sell', 'POST', { quantity: quantity, fee: fee });
                    return;
                }
                const needVnd = quantity * price * (1 + fee / 100);
                if (needVnd > cashVnd) {
                    return needTopUp('VND', fmtMoney(needVnd) + ' đ');
                }
                send('/api/portfolio', 'POST', { symbol: symbol, quantity: quantity, avg_price: price, fee: fee });
            }
            function bindTable() {
                document.querySelectorAll('[data-apply]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        applyAdjusted(holdings.find(function(x) { return x.id === Number(btn.getAttribute('data-apply')); }));
                    });
                });
                document.querySelectorAll('[data-edit]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) { e.stopPropagation(); editId = Number(btn.getAttribute('data-edit')); render(); });
                });
                document.querySelectorAll('[data-del]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(btn.getAttribute('data-del'));
                        const h = holdings.find(function(x) { return x.id === id; });
                        if (!window.confirm('Xóa cổ phiếu ' + (h ? h.symbol : '') + ' khỏi danh mục?')) return;
                        fetch('/api/portfolio/' + id, { method: 'DELETE', headers: authHeaders() })
                            .then(function(r) {
                                if (!r.ok) { return r.json().then(function(j) { throw new Error((j && j.detail) || 'Xóa thất bại'); }); }
                                return r.json();
                            })
                            .then(function() {
                                // Cập nhật state NGAY: bỏ vị thế vừa xoá khỏi danh mục hiện tại, không cần load() lại từ server.
                                holdings = holdings.filter(function(x) { return x.id !== id; });
                                toast('🗑️ Đã xóa khỏi danh mục');
                                render();
                            })
                            .catch(function(e) { toast('❌ ' + ((e && e.message) || 'Xóa thất bại'), true); });
                    });
                });
                document.querySelectorAll('tbody tr[data-symbol]').forEach(function(tr) {
                    tr.addEventListener('click', function() { openStock(tr.getAttribute('data-symbol')); });
                });
            }

            // ---------- Screener map (sector/volume/risk) ----------
            function loadScreenerMap() {
                return fetch('/api/stocks/stock-screener')
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(d) {
                        if (!d) return false;
                        (d.stocks || []).forEach(function(s) {
                            screenerMap[s.symbol] = { sectorName: s.sectorName, volume_ratio: s.volume_ratio, risk: s.risk };
                        });
                        return true;
                    })
                    .catch(function() { return false; });
            }

            // ---------- Load ----------
            // ---------- Trang bị khóa (yêu cầu đăng nhập) ----------
            function showLocked() {
                DEMO = false;
                const banner = document.getElementById('pfDemoBanner');
                if (banner) banner.innerHTML = '';
                body.innerHTML =
                    '<div class="pf-locked">' +
                        '<div class="pf-lock-icon"><i class="fas fa-lock"></i></div>' +
                        '<h2>Trang bị khóa</h2>' +
                        '<p>Trang quản lý tài sản yêu cầu đăng nhập để bảo vệ danh mục đầu tư và tài sản của bạn.</p>' +
                        '<div class="pf-lock-actions">' +
                            '<a class="pf-lock-btn primary" href="/Login?next=' + encodeURIComponent('/quan-ly-tai-san') + '" target="_top"><i class="fas fa-sign-in-alt"></i> Đăng nhập</a>' +
                            '<a class="pf-lock-btn" href="/register" target="_top"><i class="fas fa-user-plus"></i> Tạo tài khoản</a>' +
                        '</div>' +
                    '</div>';
                notifyParentHeight();
            }

            // Sau khi Mua/Bán/Cập nhật cổ phiếu: nạp lại danh mục rồi CHỈ vẽ lại card cổ phiếu
            // (#pfStockCardWrap) + cập nhật số dư Tiền mặt. Nhờ vậy màn hình ĐỨNG YÊN: giữ nguyên
            // tab đang xem, vị trí cuộn và các block khác (Tiền mặt/crypto/vàng/tiền gửi).
            function refreshStockCard() {
                // Không ở tab "Danh mục đang nắm giữ" (hiếm) → giữ hành vi cũ.
                if (!document.getElementById('pfStockCardWrap')) { load(); return; }
                fetch('/api/portfolio', { headers: authHeaders() })
                    .then(function(r) {
                        if (r.status !== 401) return r;
                        return refreshSession().then(function(ok) { return ok ? fetch('/api/portfolio', { headers: authHeaders() }) : r; });
                    })
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(list) {
                        if (Array.isArray(list)) holdings = list;
                        editId = null;
                        const wrap = document.getElementById('pfStockCardWrap');
                        if (!wrap) return; // người dùng đã đổi tab trong lúc chờ → không đụng gì
                        wrap.innerHTML = renderTable();
                        bindTable();
                        bindForm();
                        // Mua/Bán có trừ/cộng quỹ VND → cập nhật số dư đang hiển thị trên card Tiền mặt.
                        loadCash(function() { applyCashUI(); notifyParentHeight(); });
                    })
                    .catch(function() { load(); });
            }
            function load() {
                const banner = document.getElementById('pfDemoBanner');
                if (banner) banner.innerHTML = '';
                if (!loggedIn()) {
                    showLocked();
                    return;
                }
                DEMO = false;
                // Tải screener (ngành/rủi ro cho nhãn) ở NỀN — không chặn hiển thị danh mục.
                const screenerDone = loadScreenerMap();
                fetch('/api/portfolio', { headers: authHeaders() })
                    .then(function(r) {
                        // 401 = access token hết hạn → refresh (phiên nhớ tới khi tự đăng xuất) rồi gọi lại 1 lần
                        if (r.status !== 401) return r;
                        return refreshSession().then(function(ok) {
                            if (!ok) return r;
                            return fetch('/api/portfolio', { headers: authHeaders() });
                        });
                    })
                    .then(function(r) {
                        if (!r) return null;
                        if (r.status === 401) { showLocked(); return null; }
                        if (!r.ok) throw new Error('Lỗi tải danh mục');
                        return r.json();
                    })
                    .then(function(list) {
                        if (list === null) return;
                        holdings = Array.isArray(list) ? list : [];
                        // Tải số tiền mặt trước khi render để Tổng giá trị / Phân bổ chính xác.
                        loadCash(function() {
                            render();
                            loadWatchlist();
                            // Deep-link ?tab=... CHỈ áp dụng ở lần nạp ĐẦU TIÊN. Nếu áp dụng lại ở mọi lần
                            // nạp thì mở trang bằng /quan-ly-tai-san/phan-tich-tai-san (?tab=overview),
                            // sang tab "Danh mục đang nắm giữ" rồi bấm Mua sẽ bị NHẢY về "Phân tích tài sản".
                            if (!initTabApplied && INIT_TAB && TAB_DEFS[INIT_TAB]) {
                                initTabApplied = true;
                                if (INIT_TAB !== currentTab) showTab(INIT_TAB);
                            }
                            // Screener về SAU khi tab đã render → cập nhật đúng ngành cho
                            // vùng "Phân bổ theo ngành" (không dựng lại toàn bộ tab).
                            screenerDone.then(function(ok) {
                                if (ok && currentTab === 'overview') refreshAlloc();
                            });
                        });
                    })
                    .catch(function(e) { if (e && e.message) { body.innerHTML = '<div class="pf-loading">Không tải được danh mục. <a href="#" onclick="location.reload();return false;">Thử lại</a></div>'; notifyParentHeight(); } });
            }
            function loadDemo() {
                const demoSyms = ['ACB', 'VCI', 'FPT', 'HPG', 'MBB'];
                const demoQty = { 'ACB': 5000, 'VCI': 2000, 'FPT': 800, 'HPG': 10000, 'MBB': 6000 };
                const demoAvg = { 'ACB': 18000, 'VCI': 20500, 'FPT': 92000, 'HPG': 18000, 'MBB': 16500 };
                const fetches = demoSyms.map(function(sym) {
                    return fetch('/api/stocks/' + encodeURIComponent(sym) + '/quote', { cache: 'no-store' })
                        .then(function(r) { return r.ok ? r.json() : null; })
                        .then(function(q) {
                            const price = (q && q.valid !== false) ? Number(q.price) || 0 : 0;
                            const pct = q ? Number(q.percent_change) || 0 : 0;
                            const info = screenerMap[sym] || {};
                            const qty = demoQty[sym], avg = demoAvg[sym];
                            const market_value = price * qty;
                            const cost = avg * qty;
                            const pnl = market_value - cost;
                            return {
                                id: sym, symbol: sym,
                                name: (q && (q.company_name || q.name)) || sym,
                                quantity: qty, avg_price: avg, price: price || avg, percent_change: pct,
                                market_value: market_value, cost: cost, pnl: pnl,
                                pnl_pct: cost ? (pnl / cost * 100) : 0,
                                created_at: '2026-03-15T00:00:00+07:00'
                            };
                        })
                        .catch(function() { return null; });
                });
                Promise.all(fetches).then(function(list) {
                    holdings = list.filter(function(h) { return h && h.price > 0; });
                    render();
                    loadWatchlist();
                });
            }

            // ===== Embed =====
            if (window.self !== window.top) document.body.classList.add('embedded');
            function applyEmbedTheme(mode) { document.body.classList.toggle('dark-mode', mode === 'dark'); }
            function notifyParentHeight() {
                try {
                    const el = document.querySelector('.app-wrapper') || document.body;
                    const height = Math.ceil(el.getBoundingClientRect().height);
                    if (!height || height <= 0) return;
                    if (Math.abs(height - (window.__lastSentH || 0)) < 2) return;
                    window.__lastSentH = height;
                    if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'tunix-embed-height', height: height }, '*');
                } catch (e) {}
            }
            window.addEventListener('message', function(event) {
                const data = event.data;
                if (!data) return;
                if (data.type === 'tunix-qlts-tab' && data.tab && TAB_DEFS[data.tab]) {
                    showTab(data.tab);
                    setTimeout(notifyParentHeight, 60);
                    return;
                }
                if (data.type !== 'tunix-theme') return;
                const mode = data.mode === 'dark' ? 'dark' : 'light';
                localStorage.setItem('theme', mode);
                applyEmbedTheme(mode);
                setTimeout(notifyParentHeight, 50);
            });
            window.addEventListener('load', function() {
                applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
                setTimeout(notifyParentHeight, 60);
                setTimeout(notifyParentHeight, 400);
            });
            window.addEventListener('resize', notifyParentHeight);
            if (window.ResizeObserver) { const obs = new ResizeObserver(notifyParentHeight); obs.observe(document.querySelector('.app-wrapper') || document.body); }
            applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
            load();
        })();
    </script>
