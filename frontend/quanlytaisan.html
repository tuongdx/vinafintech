                    '</div>' +
                    '<div class="pf-perf-sub">' +
                        '<div class="pf-sub-item"><div class="pf-sub-label">Tổng vốn đầu tư <span class="pf-tip" data-tip="' + esc(TIP_INVESTED) + '">i</span></div><div class="pf-sub-value">' + fmtMoney(t.totalCost) + ' đ</div></div>' +
                        '<div class="pf-sub-item"><div class="pf-sub-label">Tỷ suất lợi nhuận <span class="pf-tip" data-tip="' + esc(TIP_RETURN) + '">i</span></div><div class="pf-sub-value ' + cls + '">' + pctTxt + '</div></div>' +
                        '<div class="pf-sub-item"><div class="pf-sub-label">Thời gian đầu tư</div><div class="pf-sub-value">' + durTxt + '</div></div>' +
                        '<div class="pf-sub-item"><div class="pf-sub-label">Số mã đang nắm giữ</div><div class="pf-sub-value">' + holdings.length + ' mã</div></div>' +
                        '<div class="pf-sub-item"><div class="pf-sub-label">Mã sinh lời tốt nhất</div><div class="pf-sub-value ' + (best && best.p >= 0 ? 'pf-prof' : 'pf-neutral') + '">' + bestTxt + '</div></div>' +
                        '<div class="pf-sub-item"><div class="pf-sub-label">Mã giảm mạnh nhất</div><div class="pf-sub-value ' + (worst && worst.p < 0 ? 'pf-loss' : 'pf-neutral') + '">' + worstTxt + '</div></div>' +
                    '</div>' +
                    '<div id="pfPerfWarn"></div>';
                if (metaEl) metaEl.innerHTML = 'Hiệu suất từ <b>' + startTxt + '</b> · Đầu tư được <b>' + durTxt + '</b>';
                loadPerfChart();
                notifyParentHeight();
            }
            function prevTradingDay(dateStr) {
                const d = new Date(String(dateStr) + 'T00:00:00');
                d.setDate(d.getDate() - 1);
                const p = function(n) { return String(n).padStart(2, '0'); };
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
            }
            function fmtDateVi(dateStr) {
                const p = String(dateStr || '').split('-');
                return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : (dateStr || '—');
            }
            function loadPerfChart() {
                const wrap = document.getElementById('pfPerfChart');
                if (!wrap) return;
                if (!holdings.length) { wrap.innerHTML = '<div class="pf-empty">Chưa có dữ liệu.</div>'; return; }
                const qty = {};
                holdings.forEach(function(h) { qty[h.symbol] = Number(h.quantity) || 0; });
                // Biểu đồ luôn hiển thị TỪ KHI ĐẦU TƯ đến hiện tại (đã bỏ nút chọn kỳ hạn).
                let start = null;
                holdings.forEach(function(h) { if (h.created_at) { const d = String(h.created_at).slice(0, 10); if (!start || d < start) start = d; } });
                // Tổng vốn đã đầu tư (giá vốn) — dùng làm điểm gốc của biểu đồ hiệu suất.
                let totalCost = 0;
                holdings.forEach(function(h) { totalCost += (Number(h.quantity) || 0) * (Number(h.avg_price) || 0); });
                wrap.innerHTML = '<div class="pf-loading">Đang tải dữ liệu giá…</div>';
                // Dùng kỳ hạn 1y (dữ liệu NGÀY, cập nhật đến hôm nay) thay vì 5y
                // (Simplize trả 5y bị lag ~3 ngày + mật độ thưa → đường biểu đồ thiếu các ngày gần nhất).
                buildPerfCurve(holdings.map(function(h) { return h.symbol; }), qty, '1y').then(function(res) {
                    let curve = res.curve;
                    if (start) curve = curve.filter(function(c) { return c.date >= start; });
                    // Chèn điểm gốc = tổng vốn đầu tư (trước ngày bắt đầu 1 phiên) để biểu đồ luôn
                    // có ≥ 2 điểm → hiển thị được ngay cả khi danh mục mới đầu tư ít phiên.
                    if (start && totalCost > 0 && curve.length >= 1) {
                        curve = [{ date: prevTradingDay(start), value: totalCost }].concat(curve);
                    }
                    if (curve.length < 2) {
                        const startTxt = start ? fmtDateVi(start) : '—';
                        wrap.innerHTML = '<div class="pf-empty">Cần ít nhất 2 phiên giao dịch sau ngày bắt đầu đầu tư (' + startTxt + ') để vẽ biểu đồ.</div>';
                        return;
                    }
                    wrap.innerHTML = perfLineChart(curve, 540, 150);
                    if (res.failed > 0) {
                        const warn = document.getElementById('pfPerfWarn');
                        if (warn) warn.innerHTML = '<div class="pf-perf-warn"><i class="fas fa-exclamation-triangle"></i> Một số dữ liệu giá chưa được cập nhật.</div>';
                    }
                    notifyParentHeight();
                });
            }
            function buildPerfCurve(symbols, qty, histPeriod) {
                let failed = 0;
                const fetches = symbols.map(function(sym) {
                    return fetch('/api/stocks/' + encodeURIComponent(sym) + '/history?interval=1d&period=' + encodeURIComponent(histPeriod))
                        .then(function(r) { return r.ok ? r.json() : []; })
                        .then(function(bars) {
                            const list = (Array.isArray(bars) ? bars : []).map(function(b) {
                                return { t: String(b.time || '').slice(0, 10), c: Number(b.close) || 0 };
                            }).filter(function(b) { return b.t && b.c > 0; });
                            if (!list.length) failed++;
                            return { sym: sym, bars: list };
                        })
                        .catch(function() { failed++; return { sym: sym, bars: [] }; });
                });
                return Promise.all(fetches).then(function(all) {
                    const byDate = new Map();
                    all.forEach(function(o) {
                        const q = qty[o.sym] || 0;
                        if (!q) return;
                        o.bars.forEach(function(b) {
                            if (!byDate.has(b.t)) byDate.set(b.t, {});
                            byDate.get(b.t)[o.sym] = b.c;
                        });
                    });
                    const dates = Array.from(byDate.keys()).sort();
                    const last = {};
                    const curve = dates.map(function(d) {
                        const o = byDate.get(d);
                        let v = 0;
                        all.forEach(function(item) {
                            const q = qty[item.sym] || 0;
                            if (!q) return;
                            const c = o[item.sym];
                            if (c != null) last[item.sym] = c;
                            if (last[item.sym] != null) v += q * last[item.sym];
                        });
                        return { date: d, value: v };
                    });
                    return { curve: curve, failed: failed };
                });
            }
            function perfLineChart(curve, w, h) {
                const values = curve.map(function(c) { return c.value; });
                const min = Math.min.apply(null, values), max = Math.max.apply(null, values);
                const range = (max - min) || 1;
                const padL = 8, padR = 8, padT = 14, padB = 22;
                const n = curve.length;
                const pts = values.map(function(v, i) {
                    return [padL + (i / (n - 1)) * (w - padL - padR), padT + (1 - (v - min) / range) * (h - padT - padB)];
                });
                const line = pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
                const area = padL + ',' + (h - padB) + ' ' + line + ' ' + (w - padR) + ',' + (h - padB);
                const up = values[n - 1] >= values[0];
                const col = up ? '#008080' : '#E5484D';
                const last = values[n - 1], first = values[0];
                const fmtDate = function(d) { const p = d.split('-'); return p[2] + '/' + p[1]; };
                const idxs = [0, Math.floor((n - 1) / 2), n - 1];
                const labels = idxs.map(function(i) {
                    return '<text x="' + pts[i][0].toFixed(0) + '" y="' + (h - 6) + '" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '" font-size="10" fill="#8a99b1" font-family="Inter">' + fmtDate(curve[i].date) + '</text>';
                }).join('');
                return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
                    '<defs><linearGradient id="pfPerfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + col + '" stop-opacity="0.25"/><stop offset="100%" stop-color="' + col + '" stop-opacity="0.02"/></linearGradient></defs>' +
                    '<polygon points="' + area + '" fill="url(#pfPerfGrad)"/>' +
                    '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
                    '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="3" fill="' + col + '"/>' +
                    '<text x="' + (w - padR - 4) + '" y="' + (pts[n - 1][1] - 8).toFixed(0) + '" text-anchor="end" font-size="11" font-weight="700" fill="' + col + '" font-family="Inter">' + fmtShort(last) + '</text>' +
                    '<text x="' + (padL + 2) + '" y="' + (pts[0][1] - 8).toFixed(0) + '" text-anchor="start" font-size="10" fill="#8a99b1" font-family="Inter">' + fmtShort(first) + '</text>' +
                    labels +
                '</svg>';
            }
            function scrollToForm() {

            function loadEvents() {
                const el = document.getElementById('pfEvents');
                if (!el) return;
                // CHỈ hiển thị sự kiện liên quan cổ phiếu đang nắm giữ / theo dõi — không fallback tin thị trường chung.
                if (DEMO) { el.innerHTML = '<div class="pf-empty">Đăng nhập để xem sự kiện liên quan tài sản.</div>'; notifyParentHeight(); return; }
                fetch('/api/asset-events?limit=60', { headers: authHeaders(), cache: 'no-store' })
                    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                    .then(function(items) {
                        if (!items.length) {
                            el.innerHTML = '<div class="pf-empty">Chưa có sự kiện liên quan đến cổ phiếu bạn đang nắm giữ / theo dõi.</div>';
                            notifyParentHeight(); return;
                        }
                        renderEventList(items);
                    })
                    .catch(function() { el.innerHTML = '<div class="pf-empty">Không tải được sự kiện liên quan.</div>'; notifyParentHeight(); });
            }
            function bindChart() {
                document.querySelectorAll('.pf-chart-tabs button').forEach(function(b) {
                    b.addEventListener('click', function() {
                        chartPeriod = b.getAttribute('data-per');
                        document.querySelectorAll('.pf-chart-tabs button').forEach(function(x) { x.classList.toggle('active', x === b); });
                        loadChart();
                    });
                });
            }

            // ---------- Form handlers ----------
            function bindForm() {
                const submit = document.getElementById('pfSubmit');
                if (submit) submit.addEventListener('click', submitHolding);
                const cancel = document.getElementById('pfCancelEdit');
                if (cancel) cancel.addEventListener('click', function() { editId = null; render(); });
                const sym = document.getElementById('pfSymbol');
                if (sym) {
                    let t = null;
                    sym.addEventListener('input', function() {
                        // Chỉ cho ký tự chữ & số, tối đa 3 ký tự.
                        const cleaned = sym.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
                        if (sym.value !== cleaned) sym.value = cleaned;
                        const hint = document.getElementById('pfPriceHint');
                        clearTimeout(t);
                        if (!cleaned) { if (hint) hint.innerHTML = ''; return; }
                        t = setTimeout(function() { fetchPriceHint(cleaned); }, 350);
                    });
                }
                document.querySelectorAll('.pf-trade-toggle .pf-tt').forEach(function(b) {
                    b.addEventListener('click', function() {
                        tradeMode = b.getAttribute('data-mode') === 'sell' ? 'sell' : 'buy';
                        render();
                    });
                });
            }
            function bindWlAdd() {
                const wlAdd = document.getElementById('wlAdd');
                const wlInput = document.getElementById('wlInput');
                if (!wlAdd || !wlInput) return;
                wlAdd.addEventListener('click', function() {
                    const v = wlInput.value.trim().toUpperCase();
                    if (!v) return;
                    fetch('/api/watchlist', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ symbol: v }) })
                        .then(function(r) { if (!r.ok) throw new Error('Lỗi'); return r.json(); })
                        .then(function() { wlInput.value = ''; toast('Đã thêm ' + v + ' vào danh sách theo dõi'); loadWatchlist(); })
                        .catch(function() { toast('Không thêm được. Đã tồn tại?', true); });
                });
                wlInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') wlAdd.click(); });
            }
            function fetchPriceHint(symbol) {
                const hint = document.getElementById('pfPriceHint');
                if (!hint) return;
                fetch('/api/stocks/' + encodeURIComponent(symbol) + '/quote', { cache: 'no-store' })
                    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(function(q) {
                        if (!q || q.valid === false) { hint.innerHTML = 'Không tìm thấy mã ' + esc(symbol); return; }
                        const price = Number(q.price) || 0;
                        const useLabel = tradeMode === 'sell' ? 'Dùng giá này làm giá bán' : 'Dùng giá này làm giá mua';
                        hint.innerHTML = 'Giá hiện tại: <strong>' + fmtMoney(price) + ' đ</strong> · <a id="pfUsePrice">' + useLabel + '</a>';
                        const a = document.getElementById('pfUsePrice');
                        if (a) a.addEventListener('click', function() { const avg = document.getElementById('pfAvg'); if (avg) { avg.value = price; toast('Đã điền giá hiện tại'); } });
                    })
                    .catch(function() { hint.innerHTML = ''; });
            }
            function submitHolding() {
                const symbol = (document.getElementById('pfSymbol').value || '').trim().toUpperCase();
                if (!symbol) { toast('Nhập mã cổ phiếu.', true); return; }
                const feeEl = document.getElementById('pfFee');
                const fee = feeEl ? (parseFloat(feeEl.value) || 0) : 0;
                if (fee < 0) { toast('Phí giao dịch không hợp lệ.', true); return; }
                function send(url, method, body) {
                    fetch(url, { method: method, headers: authHeaders(), body: JSON.stringify(body) })
                        .then(function(r) {
                            if (!r.ok) { return r.json().then(function(j) { throw new Error(j.detail || 'Lỗi'); }); }
                            return r.json();
                        })
                        .then(function(d) {
                            if (method === 'POST' && url.indexOf('/sell') !== -1) toast('✅ ' + (d.message || 'Đã bán'));
                            else if (method === 'POST') toast('✅ Đã mua thêm vào danh mục');
                            else toast('✅ Đã cập nhật');
                            editId = null;
                            load();
                        })
                        .catch(function(e) { if (e && e.message) toast('❌ ' + e.message, true); });
                }
                if (editId) {
                    const quantity = parseFloat(document.getElementById('pfQty').value);
                    const avg_price = parseFloat(document.getElementById('pfAvg').value);
                    if (!(quantity > 0)) { toast('Số lượng phải lớn hơn 0.', true); return; }
                    if (!(avg_price >= 0)) { toast('Giá vốn không hợp lệ.', true); return; }
                    send('/api/portfolio/' + editId, 'PUT', { quantity: quantity, avg_price: avg_price });
                    return;
                }
                const quantity = parseFloat(document.getElementById('pfQty').value);
                const price = parseFloat(document.getElementById('pfAvg').value);
                if (!(quantity > 0)) { toast('Số lượng mua/bán phải lớn hơn 0.', true); return; }
                if (!(price > 0)) { toast('Giá mua/bán không hợp lệ.', true); return; }
                if (quantity > 1000000) { toast('Số lượng tối đa 1.000.000.', true); return; }
                if (price > 1000000) { toast('Giá tối đa 1.000.000.', true); return; }
                if (tradeMode === 'sell') {
                    const h = holdings.find(function(x) { return x.symbol === symbol; });
                    if (!h) { toast('Mã ' + symbol + ' không có trong danh mục.', true); return; }
                    send('/api/portfolio/' + h.id + '/sell', 'POST', { quantity: quantity, fee: fee });
                    return;
                }
                send('/api/portfolio', 'POST', { symbol: symbol, quantity: quantity, avg_price: price, fee: fee });
            }
            function bindTable() {
                document.querySelectorAll('[data-edit]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) { e.stopPropagation(); editId = Number(btn.getAttribute('data-edit')); render(); });
                });
                document.querySelectorAll('[data-del]').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(btn.getAttribute('data-del'));
                        const h = holdings.find(function(x) { return x.id === id; });
                        if (!window.confirm('Xóa cổ phiếu ' + (h ? h.symbol : '') + ' khỏi danh mục?')) return;
                        fetch('/api/portfolio/' + id, { method: 'DELETE', headers: authHeaders() })
                            .then(function(r) {
                                if (!r.ok) { return r.json().then(function(j) { throw new Error((j && j.detail) || 'Xóa thất bại'); }); }
                                return r.json();
                            })
                            .then(function() {
                                // Cập nhật state NGAY: bỏ vị thế vừa xoá khỏi danh mục hiện tại, không cần load() lại từ server.
                                holdings = holdings.filter(function(x) { return x.id !== id; });
                                toast('🗑️ Đã xóa khỏi danh mục');
                                render();
                            })
                            .catch(function(e) { toast('❌ ' + ((e && e.message) || 'Xóa thất bại'), true); });
                    });
                });
                document.querySelectorAll('tbody tr[data-symbol]').forEach(function(tr) {
                    tr.addEventListener('click', function() { openStock(tr.getAttribute('data-symbol')); });
                });
            }

            // ---------- Screener map (sector/volume/risk) ----------
            function loadScreenerMap() {
                return fetch('/api/stocks/stock-screener')
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(d) {
                        if (!d) return false;
                        (d.stocks || []).forEach(function(s) {
                            screenerMap[s.symbol] = { sectorName: s.sectorName, volume_ratio: s.volume_ratio, risk: s.risk };
                        });
                        return true;
                    })
                    .catch(function() { return false; });
            }

            // ---------- Load ----------
            // ---------- Trang bị khóa (yêu cầu đăng nhập) ----------
            function showLocked() {
                DEMO = false;
                const banner = document.getElementById('pfDemoBanner');
                if (banner) banner.innerHTML = '';
                body.innerHTML =
                    '<div class="pf-locked">' +
                        '<div class="pf-lock-icon"><i class="fas fa-lock"></i></div>' +
                        '<h2>Trang bị khóa</h2>' +
                        '<p>Trang quản lý tài sản yêu cầu đăng nhập để bảo vệ danh mục đầu tư và tài sản của bạn.</p>' +
                        '<div class="pf-lock-actions">' +
                            '<a class="pf-lock-btn primary" href="/Login?next=' + encodeURIComponent('/quan-ly-tai-san') + '" target="_top"><i class="fas fa-sign-in-alt"></i> Đăng nhập</a>' +
                            '<a class="pf-lock-btn" href="/register" target="_top"><i class="fas fa-user-plus"></i> Tạo tài khoản</a>' +
                        '</div>' +
                    '</div>';
                notifyParentHeight();
            }

            function load() {
                const banner = document.getElementById('pfDemoBanner');
                if (banner) banner.innerHTML = '';
                if (!loggedIn()) {
                    showLocked();
                    return;
                }
                DEMO = false;
                // Tải screener (ngành/rủi ro cho nhãn) ở NỀN — không chặn hiển thị danh mục.
                const screenerDone = loadScreenerMap();
                fetch('/api/portfolio', { headers: authHeaders() })
                    .then(function(r) {
                        if (r.status === 401) { showLocked(); return null; }
                        if (!r.ok) throw new Error('Lỗi tải danh mục');
                        return r.json();
                    })
                    .then(function(list) {
                        if (list === null) return;
                        holdings = Array.isArray(list) ? list : [];
                        render();
                        loadWatchlist();
                        // Screener về SAU khi tab đã render → cập nhật đúng ngành cho
                        // vùng "Phân bổ theo ngành" (không dựng lại toàn bộ tab).
                        screenerDone.then(function(ok) {
                            if (ok && currentTab === 'overview') refreshAlloc();
                        });
                    })
                    .catch(function(e) { if (e && e.message) { body.innerHTML = '<div class="pf-loading">Không tải được danh mục. <a href="#" onclick="location.reload();return false;">Thử lại</a></div>'; notifyParentHeight(); } });
            }
            function loadDemo() {
                const demoSyms = ['ACB', 'VCI', 'FPT', 'HPG', 'MBB'];
                const demoQty = { 'ACB': 5000, 'VCI': 2000, 'FPT': 800, 'HPG': 10000, 'MBB': 6000 };
                const demoAvg = { 'ACB': 18000, 'VCI': 20500, 'FPT': 92000, 'HPG': 18000, 'MBB': 16500 };
                const fetches = demoSyms.map(function(sym) {
                    return fetch('/api/stocks/' + encodeURIComponent(sym) + '/quote', { cache: 'no-store' })
                        .then(function(r) { return r.ok ? r.json() : null; })
                        .then(function(q) {
                            const price = (q && q.valid !== false) ? Number(q.price) || 0 : 0;
                            const pct = q ? Number(q.percent_change) || 0 : 0;
                            const info = screenerMap[sym] || {};
                            const qty = demoQty[sym], avg = demoAvg[sym];
                            const market_value = price * qty;
                            const cost = avg * qty;
                            const pnl = market_value - cost;
                            return {
                                id: sym, symbol: sym,
                                name: (q && (q.company_name || q.name)) || sym,
                                quantity: qty, avg_price: avg, price: price || avg, percent_change: pct,
                                market_value: market_value, cost: cost, pnl: pnl,
                                pnl_pct: cost ? (pnl / cost * 100) : 0,
                                created_at: '2026-03-15T00:00:00+07:00'
                            };
                        })
                        .catch(function() { return null; });
                });
                Promise.all(fetches).then(function(list) {
                    holdings = list.filter(function(h) { return h && h.price > 0; });
                    render();
                    loadWatchlist();
                });
            }

            // ===== Embed =====
            if (window.self !== window.top) document.body.classList.add('embedded');
            function applyEmbedTheme(mode) { document.body.classList.toggle('dark-mode', mode === 'dark'); }
            function notifyParentHeight() {
                try {
                    const el = document.querySelector('.app-wrapper') || document.body;
                    const height = Math.ceil(el.getBoundingClientRect().height);
                    if (!height || height <= 0) return;
                    if (Math.abs(height - (window.__lastSentH || 0)) < 2) return;
                    window.__lastSentH = height;
                    if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'tunix-embed-height', height: height }, '*');
                } catch (e) {}
            }
            window.addEventListener('message', function(event) {
                const data = event.data;
                if (!data || data.type !== 'tunix-theme') return;
                const mode = data.mode === 'dark' ? 'dark' : 'light';
                localStorage.setItem('theme', mode);
                applyEmbedTheme(mode);
                setTimeout(notifyParentHeight, 50);
            });
            window.addEventListener('load', function() {
                applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
                setTimeout(notifyParentHeight, 60);
                setTimeout(notifyParentHeight, 400);
            });
            window.addEventListener('resize', notifyParentHeight);
            if (window.ResizeObserver) { const obs = new ResizeObserver(notifyParentHeight); obs.observe(document.querySelector('.app-wrapper') || document.body); }
            applyEmbedTheme(localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
            load();
        })();
    </script>
