<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuniX · Quên mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
            color: #1a1f36;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background: #0d1117;
            color: #e6edf3;
        }

        /* Card chính */
        .auth-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px 36px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .auth-card {
            background: #161b22;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        /* Logo */
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
            text-decoration: none;
        }

        .auth-logo .tuni {
            color: #008080;
        }
        .auth-logo .x {
            color: #8A95A5;
        }

        body.dark-mode .auth-logo .x {
            color: #6b7a8f;
        }

        /* Theme toggle */
        .theme-toggle-mini {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 18px;
            color: #4a5a72;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            outline: none;
        }

        .theme-toggle-mini:hover {
            color: #008080;
        }

        body.dark-mode .theme-toggle-mini {
            color: #8b949e;
        }
        body.dark-mode .theme-toggle-mini:hover {
            color: #008080;
        }

        /* Tiêu đề trang */
        .auth-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-title .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #e8ecf5;
            color: #008080;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
            transition: all 0.3s ease;
        }

        body.dark-mode .auth-title .icon-circle {
            background: #21262d;
            color: #008080;
        }

        .auth-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1f36;
            transition: color 0.3s ease;
        }

        body.dark-mode .auth-title h1 {
            color: #e6edf3;
        }

        .auth-title p {
            font-size: 14px;
            color: #6b7a8f;
            margin-top: 4px;
            line-height: 1.6;
            transition: color 0.3s ease;
        }

        body.dark-mode .auth-title p {
            color: #8b949e;
        }

        /* Input group */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #4a5a72;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
            transition: color 0.3s ease;
        }

        body.dark-mode .input-group label {
            color: #8b949e;
        }

        .input-icon-wrapper {
            display: flex;
            align-items: center;
            background: #f8faff;
            border: 1px solid #e5e9f0;
            border-radius: 14px;
            padding: 0 14px;
            transition: all 0.25s ease;
        }

        body.dark-mode .input-icon-wrapper {
            background: #0d1117;
            border-color: #30363d;
        }

        .input-icon-wrapper:focus-within {
            border-color: #008080;
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.08);
        }

        body.dark-mode .input-icon-wrapper:focus-within {
            border-color: #008080;
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.12);
        }

        .input-icon-wrapper i {
            color: #8a99b1;
            font-size: 15px;
            width: 20px;
            transition: color 0.3s ease;
        }

        body.dark-mode .input-icon-wrapper i {
            color: #6b7a8f;
        }

        .input-icon-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 14px 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #1a1f36;
            outline: none;
        }

        body.dark-mode .input-icon-wrapper input {
            color: #e6edf3;
        }

        .input-icon-wrapper input::placeholder {
            color: #b0b8c4;
            font-weight: 400;
        }

        body.dark-mode .input-icon-wrapper input::placeholder {
            color: #6b7a8f;
        }

        /* Nút chính */
        .btn-primary {
            width: 100%;
            border: none;
            background: #008080;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            padding: 14px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.25s ease, box-shadow 0.2s;
            margin-top: 8px;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: #0e4ad0;
            box-shadow: 0 6px 18px rgba(26, 92, 255, 0.2);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        body.dark-mode .btn-primary {
            background: #238636;
        }
        body.dark-mode .btn-primary:hover {
            background: #2ea043;
            box-shadow: 0 6px 18px rgba(35, 134, 54, 0.25);
        }

        .btn-primary .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Auth switch */
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7a8f;
            transition: color 0.3s ease;
        }

        body.dark-mode .auth-switch {
            color: #8b949e;
        }

        .auth-switch a {
            color: #008080;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        body.dark-mode .auth-switch a {
            color: #008080;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        /* Message box */
        .message-box {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
        }

        .message-box.show {
            display: flex;
        }

        .message-box.success {
            background: #e8f8ef;
            border: 1px solid #2ecc71;
            color: #1a7a3a;
        }

        .message-box.error {
            background: #fde8e5;
            border: 1px solid #e74c3c;
            color: #a93226;
        }

        .message-box.info {
            background: #e8ecf5;
            border: 1px solid #008080;
            color: #1a3a7a;
        }

        body.dark-mode .message-box.success {
            background: #1b2d1f;
            border-color: #3fb950;
            color: #3fb950;
        }

        body.dark-mode .message-box.error {
            background: #2d1b1e;
            border-color: #f85149;
            color: #f85149;
        }

        body.dark-mode .message-box.info {
            background: #1c2333;
            border-color: #008080;
            color: #008080;
        }

        .message-box i {
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .auth-card {
                padding: 32px 20px 28px;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/typography.css" />
</head>
<body>
    <div class="auth-card">
        <!-- Theme toggle -->
        <button class="theme-toggle-mini" id="themeToggleMini" aria-label="Chuyển đổi giao diện">
            <i class="fas fa-moon"></i>
        </button>

        <!-- Logo -->
        <a href="/" class="auth-logo">
            <span class="tuni">Tuni</span><span class="x">X</span>
        </a>

        <!-- Title -->
        <div class="auth-title">
            <div class="icon-circle">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Quên mật khẩu</h1>
            <p>Nhập email đăng ký của bạn để nhận hướng dẫn đặt lại mật khẩu</p>
        </div>

        <!-- Message Box -->
        <div class="message-box" id="messageBox">
            <i class="fas fa-info-circle"></i>
            <span id="messageText">Thông báo</span>
        </div>

        <!-- Forgot Password Form -->
        <form id="forgotForm" autocomplete="off">
            <div class="input-group">
                <label for="email">Email đăng ký</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="example@tunix.vn" required />
                </div>
            </div>

            <button type="submit" class="btn-primary" id="resetBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-paper-plane"></i> Gửi yêu cầu</span>
            </button>
        </form>

        <div class="auth-switch">
            <a href="/Login"><i class="fas fa-arrow-left"></i> Quay lại đăng nhập</a>
        </div>
    </div>

    <script>
        (function() {
            // ---- Theme toggle ----
            const themeBtn = document.getElementById('themeToggleMini');
            const icon = themeBtn.querySelector('i');
            let isDark = localStorage.getItem('theme') === 'dark';

            if (isDark) {
                document.body.classList.add('dark-mode');
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }

            themeBtn.addEventListener('click', function() {
                isDark = !isDark;
                if (isDark) {
                    document.body.classList.add('dark-mode');
                    icon.className = 'fas fa-sun';
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    icon.className = 'fas fa-moon';
                    localStorage.setItem('theme', 'light');
                }
            });

            // ---- Message box ----
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');

            function showMessage(text, type = 'info') {
                messageBox.className = 'message-box show ' + type;
                messageText.textContent = text;
                clearTimeout(messageBox._hideTimer);
                messageBox._hideTimer = setTimeout(() => {
                    messageBox.classList.remove('show');
                }, 5000);
            }

            // ---- Forgot form ----
            const forgotForm = document.getElementById('forgotForm');
            const resetBtn = document.getElementById('resetBtn');
            const emailInput = document.getElementById('email');

            forgotForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = emailInput.value.trim();

                if (!email) {
                    showMessage('Vui lòng nhập email đăng ký.', 'error');
                    emailInput.focus();
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showMessage('Vui lòng nhập địa chỉ email hợp lệ.', 'error');
                    emailInput.focus();
                    return;
                }

                // Show loading
                resetBtn.classList.add('loading');
                resetBtn.disabled = true;

                fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                })
                    .then(res => res.json().then(data => ({ ok: res.ok, data })))
                    .then(function({ ok, data }) {
                        resetBtn.classList.remove('loading');
                        resetBtn.disabled = false;
                        if (!ok) {
                            showMessage('❌ ' + (data.detail || 'Đã có lỗi xảy ra. Vui lòng thử lại.'), 'error');
                            return;
                        }
                        // Backend luôn trả cùng message (chống lộ email tồn tại)
                        showMessage('✅ ' + (data.message || 'Hướng dẫn đặt lại mật khẩu đã được gửi đến email của bạn. Vui lòng kiểm tra hộp thư.'), 'success');
                        emailInput.value = '';
                        setTimeout(() => { window.location.href = '/Login'; }, 3000);
                    })
                    .catch(function() {
                        resetBtn.classList.remove('loading');
                        resetBtn.disabled = false;
                        showMessage('❌ Đã có lỗi xảy ra. Vui lòng thử lại.', 'error');
                    });
            });
            });

            // ---- Enter key ----
            emailInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    forgotForm.dispatchEvent(new Event('submit'));
                }
            });

            // Auto focus
            document.addEventListener('DOMContentLoaded', function() {
                emailInput.focus();
            });
        })();
    </script>
</body>
</html>
