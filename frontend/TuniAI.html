<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="/frontend/Logo/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/frontend/Logo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/frontend/Logo/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/frontend/Logo/apple-touch-icon.png" />
    <title>TuniAI - Trợ lý tài chính thông minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" /><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" /></noscript>
        <link rel="stylesheet" href="/static/tuniai.css?v=20260906d" />
    <link rel="stylesheet" href="/static/block-tint.css?v=20260908t" />
</head>
<body>
    <div class="ta-page">
        <div class="ta-app">
            <aside class="ta-side">
                <div class="ta-side-head">
                    <div class="ta-brand"><i class="fas fa-robot"></i> TuniAI</div>
                    <button type="button" class="ta-new-btn" id="taNewChat"><i class="fas fa-plus"></i> Trò chuyện mới</button>
                </div>
                <div class="ta-side-label">Lịch sử trò chuyện</div>
                <div class="ta-history" id="taHistory"></div>
                <div class="ta-side-foot"><i class="fas fa-brain"></i> TuniAI học hỏi từ lịch sử trò chuyện để hiểu sở thích và nhớ những gì bạn đã nói.</div>
            </aside>
            <main class="ta-main">
                <header class="ta-main-head">
                    <div class="ta-head-left">
                        <div class="ta-chat-title" id="taChatTitle">Cuộc trò chuyện mới</div>
                        <div class="ta-chat-meta"><i class="fas fa-circle-info"></i> TuniAI — Trợ lý chứng khoán Việt Nam · Dữ liệu realtime từ TuniX</div>
                    </div>
                    <div class="ta-head-actions">
                        <button type="button" class="ta-fs-btn" id="taPdfBtn" title="Xuất PDF"><i class="fas fa-file-pdf"></i></button>
                        <button type="button" class="ta-fs-btn" id="taFsToggle" title="Xem toàn màn hình"><i class="fas fa-expand"></i></button>
                    </div>
                </header>
                <div class="ta-messages" id="taMessages"></div>
                <div class="ta-composer">
                    <div class="ta-input-row">
                        <i class="fas fa-magnifying-glass"></i>
                        <input id="taInput" type="text" placeholder="Hỏi về cổ phiếu, thị trường, tin tức..." autocomplete="off" />
                        <button id="taBtn" title="Gửi"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    <div class="ta-composer-note">TuniAI cung cấp thông tin tham khảo, không phải khuyến nghị đầu tư.</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Vùng nội dung dùng riêng cho việc xuất PDF (ẩn trên màn hình, chỉ hiện khi in) -->
    <div id="pdfSheet" class="pdf-sheet" aria-hidden="true"></div>
    <!-- Watermark chữ tunix.vn (chỉ hiện khi in / xuất PDF) -->
    <div id="pdfWatermark" class="pdf-watermark" aria-hidden="true"></div>

        <script src="/static/tuniai.js?v=20260906d"></script>
    <script src="/static/membership-gate.js?v=20260905f"></script>
    <script src="/static/context-menu.js?v=20260827a"></script>
</body>
</html>
